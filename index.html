    --priority-media:#38D188;
    --priority-media-light:#152E24;
    --priority-alta:#FFAA4D;
    --priority-alta-light:#332413;
    --priority-critica:#FF6B85;
    --priority-critica-light:#38181F;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
    --shadow-md:0 6px 20px rgba(0,0,0,.45);
  }
  [data-theme="dark"] .status-dot{background:var(--ink-faint);}
  [data-theme="dark"] .status-dot.saved{background:var(--primary);}
  [data-theme="dark"] .status-dot.dirty{background:var(--accent);}
  [data-theme="dark"] img, [data-theme="dark"] .profile-avatar-img{filter:brightness(.92);}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--ink);
    height:100vh;
    overflow:hidden;
    transition:background-color .15s, color .15s;
  }
  button{font-family:inherit; cursor:pointer;}
  input, textarea, select{font-family:inherit;}
  ::selection{background:#3B82F6; color:#fff;}

  .app{
    display:grid;
    grid-template-columns:236px 1fr;
    height:100vh;
    transition:grid-template-columns .15s;
  }
  .app.sidebar-collapsed{grid-template-columns:68px 1fr;}
  .app.sidebar-collapsed .sidebar{padding:20px 10px;}
  .app.sidebar-collapsed .brand-sub{display:none;}
  .app.sidebar-collapsed .brand-block{padding-bottom:12px; margin-bottom:12px;}
  .app.sidebar-collapsed .brand-wordmark{font-size:0;}
  .app.sidebar-collapsed .brand-wordmark::before{content:'T'; font-size:20px; font-weight:800;}
  .app.sidebar-collapsed .nav-item{justify-content:center; padding:9px; gap:0;}
  .app.sidebar-collapsed .nav-label,
  .app.sidebar-collapsed .nav-count,
  .app.sidebar-collapsed .sidebar-section-label,
  .app.sidebar-collapsed .cat-list,
  .app.sidebar-collapsed .settings-btn span{display:none;}
  .app.sidebar-collapsed .cat-collapsed-btn{justify-content:center; padding:9px; gap:0;}
  .app.sidebar-collapsed .settings-btn{justify-content:center; padding:9px;}
  .app.sidebar-collapsed #sidebarCollapseIcon{transform:rotate(180deg);}
  .cat-collapsed-wrap{margin-top:4px;}
  .cat-collapsed-btn{width:100%;}
  .cat-collapsed-popover{
    position:fixed; z-index:70; min-width:180px; max-height:60vh; overflow-y:auto;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow-md); padding:6px;
  }
  .cat-collapsed-pop-item{
    display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:var(--radius-sm);
    font-size:13px; color:var(--ink); cursor:pointer;
  }
  .cat-collapsed-pop-item:hover{background:var(--surface-2);}
  .cat-collapsed-pop-item.active{background:var(--primary-light); color:var(--primary-dark); font-weight:600;}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    --bg:#15171C;
    --surface:#1E2127;
    --surface-2:#282C34;
    --ink:#E9EAEE;
    --ink-soft:#A6ACB8;
    --ink-faint:#6B7280;
    --border:#34383F;
    --primary:#3FA087;
    --primary-dark:#8FD9BF;
    --primary-light:#1B332C;
    --accent:#EFBD5C;
    --accent-light:#332812;
    --danger:#E2685C;
    --danger-light:#3A211F;
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding:20px 16px;
    position:relative;
  }
  .sidebar-float-toggle{
    position:absolute; top:28px; right:-14px; z-index:20;
    width:28px; height:28px; border-radius:50%;
    background:var(--primary); color:#fff; border:3px solid var(--bg);
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow-sm); cursor:pointer;
  }
  .sidebar-float-toggle svg{width:14px; height:14px; transition:transform .15s;}
  .sidebar-float-toggle:hover{filter:brightness(0.8);}
  .app.sidebar-collapsed .sidebar-float-toggle svg{transform:rotate(180deg);}
  .brand-block{
    padding-bottom:16px;
    margin-bottom:16px;
    border-bottom:1px solid var(--border);
    text-align:center;
  }
  .brand{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:10px;
    margin-bottom:7px;
  }
  .brand-logo{
    height:16px;
    width:auto;
    display:block;
  }
  .brand-wordmark{
    font-family:var(--font-display);
    font-weight:800;
    font-size:22px;
    letter-spacing:.01em;
    color:var(--primary);
  }
  .brand-suffix{
    font-family:var(--font-display);
    font-weight:600;
    font-size:16px;
    letter-spacing:.02em;
    color:var(--ink-faint);
    padding-left:10px;
    border-left:1px solid var(--border);
    line-height:1.1;
  }
  .brand-sub{
    font-size:11.5px;
    color:var(--ink-faint);
    text-align:center;
  }
  .profile-card{
    display:flex; align-items:center; gap:10px;
    padding:10px; margin-bottom:18px;
    border:1px solid var(--border); border-radius:var(--radius);
    background:var(--surface); position:relative;
  }
  .profile-avatar{
    width:38px; height:38px; border-radius:50%; flex-shrink:0;
    background:var(--primary-light); color:var(--primary-dark);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:14px;
    overflow:hidden;
  }
  .profile-avatar img{width:100%; height:100%; object-fit:cover; display:block;}
  .profile-avatar svg{width:60%; height:60%;}
  .profile-info{flex:1; min-width:0;}
  .profile-name{font-size:13.5px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .profile-email{font-size:11.5px; color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .notification-btn{
    border:1px solid var(--border); background:var(--surface); color:var(--ink-soft);
    width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; margin-left:auto;
  }
  .notification-btn:hover{background:var(--surface-2); color:var(--ink);}
  .notification-btn svg{width:17px; height:17px;}
  .topbar-avatar-wrap{position:relative; margin-left:10px;}
  .topbar-avatar-btn{
    border:none; background:transparent; padding:0; border-radius:50%; cursor:pointer;
    width:36px; height:36px; flex-shrink:0;
  }
  .topbar-avatar-btn .profile-avatar{width:36px; height:36px;}
  .topbar-avatar-btn:hover .profile-avatar{box-shadow:0 0 0 2px var(--primary-light);}
  .avatar-dropdown-menu{
    position:absolute; top:calc(100% + 8px); right:0; width:230px; z-index:60;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow-md); padding:8px; display:flex; flex-direction:column; gap:2px;
  }
  .avatar-dropdown-header{
    display:flex; align-items:center; gap:10px; padding:8px 8px 12px; margin-bottom:6px;
    border-bottom:1px solid var(--border);
  }
  .avatar-dropdown-item{
    display:flex; align-items:center; gap:9px; width:100%; text-align:left;
    padding:9px 10px; border-radius:var(--radius-sm); border:none; background:transparent;
    font-size:13.5px; font-weight:500; color:var(--ink);
  }
  .avatar-dropdown-item svg{width:16px; height:16px; flex-shrink:0; color:var(--ink-soft);}
  .avatar-dropdown-item:hover{background:var(--surface-2);}
  .avatar-dropdown-item.danger{color:var(--danger);}
  .avatar-dropdown-item.danger svg{color:var(--danger);}
  .avatar-dropdown-item.danger:hover{background:var(--danger-light);}

  .settings-btn{
    display:flex; align-items:center; gap:9px;
    padding:9px 10px; border-radius:var(--radius-sm);
    border:none; background:transparent; color:var(--ink-soft);
    font-size:13.5px; font-weight:500; text-align:left; margin-bottom:8px;
  }
  .settings-btn:hover{background:var(--surface-2); color:var(--ink);}
  .settings-btn.active{background:var(--primary-light); color:var(--primary-dark); font-weight:600;}
  .settings-btn svg{width:16px; height:16px; flex-shrink:0;}

  .settings-tabs{
    display:flex; gap:4px; border-bottom:1px solid var(--border);
    max-width:640px; margin:0 auto 24px;
  }
  .settings-tab-btn{
    padding:10px 4px; margin-right:22px; border:none; background:transparent;
    font-size:14px; font-weight:600; color:var(--ink-faint);
    border-bottom:2px solid transparent; position:relative; top:1px;
  }
  .settings-tab-btn:hover{color:var(--ink-soft);}
  .settings-tab-btn.active{color:var(--primary-dark); border-bottom-color:var(--primary);}
  .settings-panel{max-width:640px; margin:0 auto;}
  .settings-section-title{font-family:var(--font-display); font-weight:700; font-size:17px; margin-bottom:4px;}
  .settings-section-header-row{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:14px;}
  .settings-header-text{flex:1; min-width:0;}
  .settings-order-control{display:flex; align-items:center; gap:6px; flex-shrink:0; padding-top:2px;}
  .settings-order-label{font-size:12px; color:var(--ink-soft); white-space:nowrap;}
  .settings-order-select{width:auto; max-width:118px; flex-shrink:0; font-size:12px; padding:5px 7px;}
  .reorder-btn{
    border:none; background:none; color:var(--ink-faint); width:20px; height:20px;
    border-radius:5px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .reorder-btn:hover:not(:disabled){background:var(--surface-2); color:var(--ink);}
  .reorder-btn:disabled{opacity:.25; cursor:default;}
  .reorder-btn:disabled:hover{background:none; color:var(--ink-faint);}
  .reorder-btn svg{width:12px; height:12px;}
  .fav-star-btn{
    border:none; background:transparent; color:var(--ink-faint); width:26px; height:26px;
    display:flex; align-items:center; justify-content:center; border-radius:6px; flex-shrink:0;
  }
  .fav-star-btn:hover{background:var(--surface-2); color:var(--accent);}
  .fav-star-btn.active{color:var(--accent);}
  .fav-star-btn svg{width:16px; height:16px;}
  .settings-section-desc{font-size:13px; color:var(--ink-faint); margin-bottom:20px;}

  .nav{display:flex; flex-direction:column; gap:2px; margin-bottom:22px;}
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:9px 10px;
    border-radius:var(--radius-sm);
    border:none; background:transparent;
    color:var(--ink-soft);
    font-size:14px; font-weight:500;
    text-align:left;
    transition:background .15s, color .15s;
  }
  .nav-item svg{width:17px; height:17px; flex-shrink:0;}
  .nav-item:hover{background:var(--surface-2); color:var(--ink);}
  .nav-item.active{background:var(--primary-light); color:var(--primary-dark); font-weight:600;}
  .nav-count{
    margin-left:auto;
    font-family:var(--font-body);
    font-size:11px;
    color:var(--ink-faint);
  }

  .sidebar-section-label{
    font-size:10.5px; font-weight:600; letter-spacing:.06em;
    text-transform:uppercase; color:var(--ink-faint);
    padding:0 10px; margin-bottom:8px;
  }
  .cat-list{display:flex; flex-direction:column; gap:1px; overflow-y:auto; flex:1;}
  .cat-item{
    display:flex; align-items:center; gap:9px;
    padding:7px 10px;
    border-radius:var(--radius-sm);
    font-size:13.5px; color:var(--ink-soft);
    cursor:pointer;
  }
  .cat-item:hover{background:var(--surface-2);}
  .cat-item.active{background:var(--surface-2); color:var(--ink); font-weight:600;}
  .cat-swatch{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .cat-item .cat-name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .sidebar-footer{
    display:flex; flex-direction:column; gap:6px;
    padding-top:14px; border-top:1px solid var(--border);
    margin-top:auto;
  }
  .status-dot{width:6px; height:6px; border-radius:50%; background:var(--ink-faint); flex-shrink:0;}
  .status-dot.saved{background:var(--primary);}
  .status-dot.dirty{background:var(--accent);}

  /* ---------- MAIN ---------- */
  .main{display:flex; flex-direction:column; height:100vh; overflow:hidden;}
  .topbar{
    display:flex; align-items:center; gap:14px;
    padding:18px 28px; border-bottom:1px solid var(--border);
    background:var(--surface);
  }
  .view-title-wrap{display:flex; flex-direction:column; justify-content:center;}
  .view-title{font-family:var(--font-display); font-weight:700; font-size:20px;}
  .view-subtitle{font-size:12px; color:var(--ink-faint); text-transform:capitalize; margin-top:1px;}
  .search-wrap{
    flex:1; max-width:360px; position:relative; margin-left:8px;
  }
  .search-wrap input{
    width:100%; padding:8px 35px 8px 32px;
    border:1px solid var(--border); border-radius:8px;
    background:var(--bg); font-size:13.5px; color:var(--ink);
  }
  .search-wrap input:focus{outline:none; border-color:var(--primary);}
  .search-clear-btn{
    position:absolute; right:11px; top:50%; transform:translateY(-50%);
    width:20px; height:20px; border:none; background:transparent; color:var(--ink-faint);
    border-radius:5px; align-items:center; justify-content:center;
  }
  .search-clear-btn:hover{background:var(--surface-2); color:var(--ink);}
  .search-clear-btn svg{position:static; width:12px; height:12px; transform:none;}

  .file-bar{
    display:flex; align-items:center; gap:6px; margin-left:auto; flex-shrink:0;
  }
  .file-bar-name{
    display:flex; align-items:center; gap:6px;
    font-size:12px; color:var(--ink-faint); font-family:var(--font-mono);
    padding:0 6px 0 2px; white-space:nowrap;
  }
  .file-bar-btn{
    border:1px solid var(--border); background:var(--surface); color:var(--ink);
    font-size:12.5px; font-weight:600; padding:8px 13px; border-radius:8px;
    white-space:nowrap;
  }
  .file-bar-btn:hover{background:var(--surface-2);}
  .file-bar-btn.primary{background:var(--ink); color:#fff; border-color:var(--ink);}
  .file-bar-btn.primary:hover{background:#000;}
  .file-bar-btn.danger{background:transparent; color:var(--danger); border-color:var(--danger-light);}
  .file-bar-btn.danger:hover{background:var(--danger-light);}
  .icon-add-btn{
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    width:36px; height:36px; border-radius:50%; border:none;
    background:var(--primary); color:#fff; box-shadow:var(--shadow-sm);
  }
  .icon-add-btn:hover{background:var(--primary-dark);}
  .icon-add-btn svg{width:18px; height:18px;}
  .icon-add-btn.fab{
    position:fixed; right:32px; bottom:28px; width:52px; height:52px;
    box-shadow:0 6px 18px rgba(27,33,48,.25); z-index:45;
    transition:right .15s;
  }
  .icon-add-btn.fab.shifted{ right:calc(var(--edit-panel-width, 500px) + 32px); }
  .icon-add-btn.fab svg{width:22px; height:22px;}
  .icon-add-btn.fab:active{transform:scale(.94);}
  .search-wrap svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--ink-faint);}
  .btn{
    display:inline-flex; align-items:center; gap:6px;
    padding:9px 16px; border-radius:8px; border:none;
    font-size:13.5px; font-weight:600;
    background:var(--primary); color:#fff;
    box-shadow:var(--shadow-sm);
  }
  .btn:hover{background:var(--primary-dark);}
  .btn.ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--border); box-shadow:none;}
  .btn.ghost:hover{background:var(--surface-2); color:var(--ink);}
  .btn.small{padding:6px 11px; font-size:12.5px;}
  .btn svg{width:14px; height:14px;}

  .view{flex:1; overflow-y:auto; padding:24px 28px 60px;}

  /* ---------- TASKS (Planner style) ---------- */
  .tasks-layout{ display:flex; gap:20px; align-items:flex-start; }
  .group-mode-bar{
    display:flex; align-items:center; gap:10px; margin-bottom:16px;
  }
  .group-mode-label{font-size:12px; color:var(--ink-faint); font-weight:500;}
  .group-mode-select-wrap{position:relative;}
  .tp-status-trigger.group-mode-trigger{
    width:auto; height:30px; min-width:0; padding:0 10px 0 8px; font-size:12px; gap:6px;
  }
  .group-mode-trigger .tp-status-icon{width:13px; height:13px;}
  .group-mode-select-wrap .tp-status-dropdown{min-width:170px; width:max-content;}
  .group-mode-tabs{display:flex; gap:2px; background:var(--surface-2); padding:3px; border-radius:8px;}
  .group-mode-tabs button{
    border:none; background:transparent; padding:6px 12px; border-radius:6px;
    font-size:12.5px; font-weight:600; color:var(--ink-soft);
  }
  .group-mode-tabs button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm);}

  .tag-filter-control{position:relative;}
  .tag-filter-btn{
    display:flex; align-items:center; gap:6px;
    border:1px solid var(--border); border-radius:8px;
    padding:7px 10px; font-size:12.5px; color:var(--ink-soft); background:var(--surface);
  }
  .tag-filter-btn:hover{color:var(--ink); background:var(--surface-2);}
  .tag-filter-btn svg{width:14px; height:14px; flex-shrink:0;}
  .tag-filter-popover{
    position:absolute; top:calc(100% + 6px); right:0; z-index:40;
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    box-shadow:var(--shadow-md); padding:8px; min-width:180px; max-height:240px; overflow-y:auto;
  }
  .tag-filter-row{
    display:flex; align-items:center; gap:8px; padding:6px 4px; font-size:13px; cursor:pointer; border-radius:6px;
  }
  .tag-filter-row:hover{background:var(--surface-2);}
  .tag-filter-row input{margin:0;}
  .filter-clear-btn{
    width:100%; margin-top:6px; padding-top:8px; border:none; border-top:1px solid var(--border);
    background:none; color:var(--primary); font-size:12.5px; font-weight:600; text-align:left; cursor:pointer;
  }
  .filter-clear-btn:hover{color:var(--primary-dark);}
  .filter-clear-btn:disabled{color:var(--ink-faint); cursor:default;}
  .filter-clear-all-btn{
    display:flex; align-items:center; gap:5px; border:none; background:none;
    color:var(--danger); font-size:12.5px; font-weight:600;
  }
  .filter-clear-all-btn:hover{color:#a03a30;}
  .filter-clear-all-btn svg{width:13px; height:13px;}

  .completed-toggle{
    display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-soft);
    cursor:pointer; user-select:none; margin-left:auto;
  }
  .completed-toggle input{position:absolute; opacity:0; width:0; height:0;}
  .completed-toggle-track{
    width:34px; height:19px; border-radius:20px; background:var(--surface-2);
    position:relative; transition:background .15s; flex-shrink:0; border:1px solid var(--border);
  }
  .completed-toggle-thumb{
    position:absolute; top:1px; left:1px; width:15px; height:15px; border-radius:50%;
    background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:transform .15s;
  }
  .completed-toggle input:checked + .completed-toggle-track{background:var(--primary);}
  .completed-toggle input:checked + .completed-toggle-track .completed-toggle-thumb{transform:translateX(15px);}
  .recurrence-toggle-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px; color:var(--ink);
    cursor:pointer; user-select:none; font-weight:600;
  }
  .recurrence-toggle-row input{position:absolute; opacity:0; width:0; height:0;}
  .recurrence-toggle-row input:checked + .completed-toggle-track{background:var(--primary);}
  .theme-toggle-switch{
    display:flex; align-items:center; justify-content:space-between; gap:16px; cursor:pointer;
    user-select:none; max-width:420px; padding:14px; border:1px solid var(--border); border-radius:var(--radius);
  }
  .theme-toggle-switch input{position:absolute; opacity:0; width:0; height:0;}
  .theme-toggle-switch input:checked + .completed-toggle-track{background:var(--primary);}
  .theme-toggle-switch input:checked + .completed-toggle-track .completed-toggle-thumb{transform:translateX(15px);}
  .theme-toggle-title{font-weight:600; font-size:13.5px; margin-bottom:2px;}
  .theme-toggle-desc{font-size:12px; color:var(--ink-faint); line-height:1.4;}
  .recurrence-toggle-row input:checked + .completed-toggle-track .completed-toggle-thumb{transform:translateX(15px);}

  .tasks-list-col{ flex:1; min-width:0; }

  .bucket{margin-bottom:22px;}
  .bucket-header{
    display:flex; align-items:center; gap:10px;
    margin-bottom:10px; padding:0 2px; cursor:pointer;
  }
  .bucket-header .cat-swatch{width:11px; height:11px;}
  .bucket-title{font-family:var(--font-display); font-weight:600; font-size:13px;}
  .bucket-count{
    font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint);
    background:var(--surface-2); padding:1px 7px; border-radius:20px;
  }
  .bucket-chevron{
    display:flex; align-items:center; justify-content:center;
    width:18px; height:18px; color:var(--ink-faint); flex-shrink:0;
    transition:transform .15s;
  }
  .bucket-chevron svg{width:14px; height:14px;}
  .bucket.collapsed .bucket-chevron{transform:rotate(-90deg);}
  .bucket.collapsed .bucket-body{display:none;}
  .bucket-body{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); overflow:hidden;
  }
  .task-row{
    display:flex; align-items:center; gap:10px;
    padding:10px 14px 10px 10px;
    border-bottom:1px solid var(--border);
    border-left:4px solid transparent;
    font-size:13px; cursor:pointer; position:relative;
  }
  .task-row.pri-baixa{border-left-color:var(--priority-baixa);}
  .task-row.pri-media{border-left-color:var(--priority-media);}
  .task-row.pri-alta{border-left-color:var(--priority-alta);}
  .task-row.pri-critica{border-left-color:var(--priority-critica);}
  .task-row:last-child{border-bottom:none;}
  .task-row:hover{background:var(--bg);}
  .task-row.selected{background:var(--primary-light);}
  .task-check{
    width:18px; height:18px; border-radius:5px;
    border:1.5px solid var(--ink-faint);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; background:var(--surface);
  }
  .task-check.done{background:var(--primary); border-color:var(--primary);}
  .task-check svg{width:12px; height:12px; color:#fff; display:none;}
  .task-check.done svg{display:block;}
  .task-check-circle{border-radius:50%;}
  .task-row-left{
    flex:1; min-width:0; display:flex; align-items:center; gap:9px; overflow:hidden;
  }
  .task-title{
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex-shrink:1; min-width:40px;
    font-weight:600;
  }
  .task-id-badge{
    font-family:var(--font-mono); font-size:10px; color:var(--ink-faint); flex-shrink:0;
    background:var(--surface-2); padding:1px 5px; border-radius:4px;
  }
  .task-row.done .task-title{color:var(--ink-faint); text-decoration:line-through;}
  .task-row.overdue .task-title{color:var(--priority-critica);}
  .task-status-label{
    font-style:italic; font-size:11px; color:var(--ink-faint); flex-shrink:0; white-space:nowrap;
  }
  .task-cal-badge{
    display:inline-flex; align-items:center; gap:4px; flex-shrink:0;
    font-family:inherit; font-size:11.5px; color:var(--ink-soft);
    white-space:nowrap;
  }
  .task-cal-badge svg{width:12px; height:12px; flex-shrink:0;}
  .task-cal-badge.overdue{color:var(--priority-critica);}
  .task-subtask-badge{
    font-family:inherit; font-size:11.5px; color:var(--ink-faint); flex-shrink:0;
  }
  .task-tag-pill{
    display:inline-flex; align-items:center; gap:5px; flex-shrink:0;
    padding:2px 9px; border-radius:20px; font-size:12px; font-weight:600; white-space:nowrap;
  }
  .task-tag-pill .dot{width:6px; height:6px; border-radius:50%; flex-shrink:0;}
  .task-tag-more{
    font-size:11px; font-weight:600; color:var(--ink-faint); flex-shrink:0;
    background:var(--surface-2); padding:2px 7px; border-radius:20px; white-space:nowrap;
  }
  .task-row-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .task-comment-badge{
    display:inline-flex; align-items:center; gap:3px; flex-shrink:0;
    font-family:inherit; font-size:11.5px; color:var(--ink-faint);
  }
  .task-comment-badge svg{width:13px; height:13px;}
  .task-recurrence-icon{display:inline-flex; align-items:center; flex-shrink:0; color:var(--primary); opacity:.55;}
  .task-recurrence-icon svg{width:15px; height:15px; stroke-width:2.3;}
  .task-status-pill{
    font-family:inherit; font-size:11.5px; font-weight:700;
    padding:3px 9px; border-radius:20px; flex-shrink:0; white-space:nowrap;
  }
  .task-status-pill.overdue{background:var(--priority-critica); color:#fff;}
  .task-status-pill.today{background:var(--priority-alta); color:#fff;}

  .task-menu-wrap{position:relative; flex-shrink:0;}
  .task-menu-btn{
    opacity:.45; width:26px; height:26px; border:none; background:transparent;
    color:var(--ink-soft); border-radius:6px; display:flex; align-items:center; justify-content:center;
  }
  .task-row:hover .task-menu-btn, .task-menu-wrap.open .task-menu-btn{opacity:1;}
  .task-menu-btn:hover{background:var(--surface-2); color:var(--ink);}
  .task-menu-btn.open, .task-menu-wrap.open .task-menu-btn{background:var(--surface-2); color:var(--ink);}
  .task-menu-btn svg{width:17px; height:17px;}
  .task-menu-portal{
    display:none; position:fixed; z-index:500;
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    box-shadow:var(--shadow-md); min-width:150px; padding:6px;
  }
  .task-menu-portal.show{display:block;}
  .task-menu-item{
    display:flex; align-items:center; gap:9px; width:100%;
    padding:8px 10px; border:none; background:transparent; border-radius:6px;
    font-size:13px; color:var(--ink); text-align:left;
  }
  .task-menu-item:hover{background:var(--surface-2);}
  .task-menu-item svg{width:14px; height:14px; color:var(--ink-faint); flex-shrink:0;}
  .task-menu-item.danger{color:var(--danger);}
  .task-menu-item.danger svg{color:var(--danger);}

  .quick-add{
    display:flex; align-items:center; gap:10px;
    padding:10px 14px; border-top:1px dashed var(--border);
    background:var(--bg);
  }
  .quick-add input{
    flex:1; border:none; background:transparent; font-size:14px; outline:none;
  }
  .quick-add input::placeholder{color:var(--ink-faint);}
  .quick-add input[type=date]{
    flex:none; width:130px; color:var(--ink-soft); font-family:var(--font-mono); font-size:12px;
  }
  .quick-add select{
    flex:none; border:1px solid var(--border); border-radius:6px; background:var(--surface);
    font-size:12px; padding:4px 6px; color:var(--ink-soft);
  }

  /* ---------- TASK PANEL (side drawer) ---------- */
  .task-panel{
    position:fixed; top:0; right:0; bottom:0;
    width:var(--edit-panel-width, 500px);
    background:var(--surface); border-left:1px solid var(--border);
    box-shadow:-10px 0 28px rgba(27,33,48,.12);
    padding:24px 26px 40px;
    overflow-y:auto;
    z-index:40;
  }
  .tp-header{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .tp-header-compact{margin-bottom:6px;}
  .tp-header-compact h3{font-size:15px;}
  .tp-panel-title{
    font-family:var(--font-display); font-weight:700; font-size:16px;
    margin:0 0 10px; padding-right:34px;
  }
  .tp-header h3{font-family:var(--font-display); font-weight:700; font-size:16px;}
  .tp-close{
    width:26px; height:26px; border:none; background:transparent; color:var(--ink-faint);
    margin-left:auto;
    border-radius:6px; display:flex; align-items:center; justify-content:center;
  }
  .tp-close:hover{background:var(--surface-2); color:var(--ink);}
  .tp-close svg{width:16px; height:16px;}
  .tp-close-floating{position:absolute; top:14px; right:14px; z-index:30; margin-left:0;}
  .tp-field{margin-bottom:16px;}
  .tp-label{
    display:block; font-size:13px; font-weight:600; letter-spacing:.01em;
    color:var(--ink-soft); margin-bottom:6px;
  }
  .tp-name-row{display:flex; align-items:center; gap:10px;}
  .tp-name-row .task-check{flex-shrink:0;}
  .tp-name-row .tp-close{flex-shrink:0;}
  .tp-name-input{
    width:100%; height:32px; line-height:32px; box-sizing:border-box;
    border:none; border-bottom:2px solid var(--border); padding:0;
    font-family:var(--font-display); font-weight:700; font-size:15px; background:transparent;
  }
  .tp-name-input[readonly]{cursor:pointer; border-bottom-color:transparent;}
  .tp-name-input.done{color:var(--ink-faint); text-decoration:line-through;}
  .tp-name-input:focus{outline:none; border-color:var(--primary);}
  .tp-done-banner{
    display:flex; align-items:center; gap:6px; margin-top:8px;
    font-size:12px; font-weight:600; color:var(--priority-media);
  }
  .tp-done-banner svg{width:14px; height:14px;}
  .tp-created-at{font-size:10.5px; color:var(--ink-faint); margin-top:2px;}
  .tp-select, .tp-input, .tp-textarea{
    width:100%; border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:13.5px;
    background:var(--surface); color:var(--ink); box-sizing:border-box;
  }
  .tp-date-input, .tp-time-input{height:34px;}
  .tp-select:focus, .tp-input:focus, .tp-textarea:focus{outline:none; border-color:var(--primary);}
  .tp-textarea{resize:vertical; min-height:90px; line-height:1.5;}
  .tp-row2{display:flex; gap:8px;}
  .tp-row2 > *{flex:1;}
  .tp-row2 .tp-time-input{flex:0 0 104px; min-width:0;}
  .tp-row2 .tp-date-input{flex:0 0 128px; min-width:0;}
  .tp-row-mixed{display:flex; gap:10px; align-items:flex-start;}
  .ev-daterange-row{display:flex; gap:12px;}
  .ev-daterange-col{flex:1; min-width:0;}
  .ev-daterange-col .tp-row2{gap:6px;}
  .ev-daterange-col .tp-time-input{flex:0 0 96px;}
  .tp-row-mixed .tp-col-small{flex:0 0 130px;}
  .tp-row-mixed .tp-col-large{flex:0 0 auto; min-width:0;}
  .tp-row-mixed .tp-col-recurrence{flex:1; min-width:0;}
  .tp-recurrence-field-icon{
    width:14px; height:14px; color:var(--ink-faint); flex-shrink:0;
  }
  .tp-header-status{margin-left:auto; margin-right:4px;}
  .tp-top-flag{
    height:10px; margin:-24px -26px 22px;
  }
  .tp-top-flag.overdue{background:var(--priority-critica);}
  .tp-top-flag.today{background:var(--priority-alta);}
  .tp-top-flag.normal{background:var(--primary);}

  .tp-priority-group{display:flex; gap:5px; width:100%;}
  .tp-priority-btn{
    flex:1; height:34px; display:flex; align-items:center; justify-content:center; gap:5px;
    padding:0 6px; border-radius:8px; border:1.5px solid transparent;
    font-size:12px; font-weight:600;
    box-sizing:border-box; transition:background .12s, color .12s;
  }
  .tp-priority-btn[data-p="baixa"]{background:var(--surface); border-color:var(--border); color:var(--priority-baixa);}
  .tp-priority-btn[data-p="media"]{background:var(--surface); border-color:var(--border); color:var(--priority-media);}
  .tp-priority-btn[data-p="alta"]{background:var(--surface); border-color:var(--border); color:var(--priority-alta);}
  .tp-priority-btn[data-p="critica"]{background:var(--surface); border-color:var(--border); color:var(--priority-critica);}
  .tp-priority-btn.active[data-p="baixa"]{background:var(--priority-baixa); color:#fff;}
  .tp-priority-btn.active[data-p="media"]{background:var(--priority-media); color:#fff;}
  .tp-priority-btn.active[data-p="alta"]{background:var(--priority-alta); color:#fff;}
  .tp-priority-btn.active[data-p="critica"]{background:var(--priority-critica); color:#fff;}

  .tp-col-status{flex:0 0 128px;}
  .tp-col-priority{flex:1; min-width:0;}
  .tp-status-select-wrap{position:relative;}
  .tp-status-trigger{
    width:100%; height:34px; display:flex; align-items:center; gap:7px;
    border:1px solid var(--border); border-radius:8px; padding:0 10px;
    background:var(--surface); font-size:13.5px; color:var(--ink);
    box-sizing:border-box;
  }
  .tp-status-trigger:hover{background:var(--surface-2);}
  .tp-status-trigger-label{flex:1; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tp-status-chevron{width:13px; height:13px; color:var(--ink-faint); flex-shrink:0;}
  .tp-status-icon{width:15px; height:15px; display:flex; flex-shrink:0;}
  .tp-status-icon svg{width:100%; height:100%;}
  .tp-status-icon.status-nao_iniciado{color:var(--ink-faint);}
  .tp-status-icon.status-em_andamento{color:#4B5563;}
  .tp-status-icon.status-concluida{color:var(--primary);}
  .tp-status-dropdown{
    position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:20;
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    box-shadow:var(--shadow-md); padding:4px;
  }
  .tp-status-option{
    display:flex; align-items:center; gap:8px; padding:8px 8px; border-radius:6px; font-size:13.5px; cursor:pointer;
  }
  .tp-status-option:hover{background:var(--surface-2);}
  .tp-status-option.active{background:var(--primary-light);}

  .tp-tags-selected{display:flex; flex-wrap:wrap; align-items:center; gap:6px;}
  .tp-tag-chip{
    display:inline-flex; align-items:center; gap:5px;
    padding:4px 9px; border-radius:20px; font-size:12px; font-weight:600;
    color:#fff;
  }
  .tp-tag-chip[data-tag-id]{cursor:pointer; transition:filter .1s;}
  .tp-tag-chip[data-tag-id]:hover{filter:brightness(0.88);}
  .tp-tags-add-btn{
    border:1px dashed var(--border); background:transparent; color:var(--ink-faint);
    font-size:12px; font-weight:600; padding:4px 10px; border-radius:20px;
  }
  .tp-tags-add-btn:hover{color:var(--ink-soft); border-color:var(--ink-faint);}
  .tp-tags-popover{
    position:absolute; top:calc(100% + 4px); left:0; width:260px; z-index:20;
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    box-shadow:var(--shadow-md); padding:10px;
  }
  .tags-picker-portal{
    display:none; position:fixed; width:220px; z-index:700;
  }
  .tags-picker-portal.show{display:block;}
  .recurrence-portal{width:230px;}
  .recurrence-unit-options{display:flex; flex-direction:column; gap:2px;}
  .recurrence-unit-options .tp-status-option{padding:8px 8px;}
  .recurrence-detail-fields{
    margin-top:8px; padding-top:10px; border-top:1px solid var(--border);
    display:flex; flex-direction:column; gap:10px;
  }
  .recurrence-detail-fields .tp-field{margin:0;}
  .recurrence-detail-fields .tp-label{font-size:11px; margin-bottom:4px;}
  .tp-tags-popover-list{max-height:180px; overflow-y:auto; margin-bottom:8px;}
  .tp-tags-popover-row{
    display:flex; align-items:center; gap:8px; padding:6px 4px; border-radius:6px; font-size:13px;
  }
  .tp-tags-popover-row:hover{background:var(--surface-2);}
  .tp-tags-popover-name{flex:1; cursor:pointer;}
  .tag-picker-search{
    width:100%; border:1px solid var(--border); border-radius:7px; padding:7px 31px 7px 9px;
    font-size:13px; margin-bottom:8px; box-sizing:border-box;
  }
  .tag-picker-search:focus{outline:none; border-color:var(--primary);}
  .search-input-wrap{position:relative;}
  .search-input-wrap .search-clear-btn{
    position:absolute; right:9px; top:7px;
    width:20px; height:20px; border:none; background:transparent; color:var(--ink-faint);
    border-radius:5px; align-items:center; justify-content:center;
  }
  .search-input-wrap .search-clear-btn:hover{background:var(--surface-2); color:var(--ink);}
  .search-input-wrap .search-clear-btn svg{width:12px; height:12px;}
  .tag-row-color-dot{
    width:14px; height:14px; border-radius:50%; border:1px solid rgba(0,0,0,.1); flex-shrink:0; padding:0; cursor:pointer;
  }
  .tag-create-row{color:var(--primary); font-weight:600;}
  .tag-create-row .tp-tags-popover-name{cursor:pointer;}
  .tp-tag-add-row{display:flex; gap:6px; align-items:center; padding-top:8px; border-top:1px solid var(--border);}
  .tp-tag-add-row input[type=text]{flex:1;}
  .tp-tag-add-row input[type=color]{width:30px; height:30px; border:none; border-radius:7px; padding:0;}
  .tp-tags-popover-section{
    font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.04em;
    color:var(--ink-faint); margin:8px 2px 4px;
  }
  .tp-tags-popover-section:first-child{margin-top:0;}
  .tp-tag-general-check{
    display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft);
    margin-top:8px; cursor:pointer;
  }
  .tp-tag-general-check input{margin:0;}

  .tag-row-settings select.tag-cat-select{
    border:1px solid var(--border); border-radius:6px; padding:6px 8px; font-size:12.5px;
    color:var(--ink-soft); background:var(--surface); flex-shrink:0; max-width:150px;
  }

  .tp-subtask-row{display:flex; align-items:center; gap:6px; padding:6px 0;}
  .tp-subtask-row .task-check{width:16px; height:16px;}
  .tp-subtask-title{flex:1; font-size:13.5px; outline:none; word-break:break-word; min-width:0; padding:2px 4px; border-radius:4px;}
  .tp-subtask-title:focus{background:var(--surface-2);}
  .tp-subtask-row.done .tp-subtask-title{color:var(--ink-faint); text-decoration:line-through;}
  .tp-subtask-move{
    border:none; background:none; color:var(--ink-faint); width:20px; height:20px; border-radius:5px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .tp-subtask-move:hover{background:var(--surface-2); color:var(--ink);}
  .tp-subtask-move:disabled{opacity:.25; cursor:default;}
  .tp-subtask-move:disabled:hover{background:none; color:var(--ink-faint);}
  .tp-subtask-move svg{width:12px; height:12px;}
  .tp-subtask-del{border:none; background:none; color:var(--danger); opacity:.6; width:20px; height:20px; border-radius:5px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .tp-subtask-del:hover{background:var(--danger-light); color:var(--danger); opacity:1;}
  .tp-subtask-del svg{width:12px; height:12px;}
  .tp-subtask-progress{font-size:11.5px; color:var(--ink-faint); margin-bottom:6px;}
  .tp-subtask-progress-bar{
    width:100%; height:6px; border-radius:20px; background:var(--surface-2);
    overflow:hidden; margin-bottom:4px;
  }
  .tp-subtask-progress-fill{
    height:100%; background:#12E06A; border-radius:20px; transition:width .2s ease;
  }
  .tp-subtask-header-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .tp-subtask-progress-pct{
    font-size:11.5px; font-weight:700; color:var(--ink-soft);
  }
  .tp-add-inline{
    display:flex; align-items:center; gap:8px; margin-top:8px;
    padding-top:8px; border-top:1px dashed var(--border);
  }
  .tp-add-inline input{flex:1; border:none; background:transparent; font-size:13px; outline:none;}

  .tp-comment{
    background:var(--bg); border-radius:8px; padding:8px 10px; margin-bottom:8px; font-size:13px;
  }
  .tp-comment-text{margin-bottom:6px; word-break:break-word; white-space:pre-wrap;}
  .tp-comment-text.editing{outline:1.5px solid var(--primary); border-radius:4px; padding:2px 4px;}
  .tp-comment-footer{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .tp-comment-meta{font-size:10.5px; color:var(--ink-faint); font-family:var(--font-mono);}
  .tp-comment-actions{display:flex; align-items:center; gap:2px;}
  .tp-comment-edit, .tp-comment-del{
    border:none; background:none; cursor:pointer; width:22px; height:22px; border-radius:5px;
    display:flex; align-items:center; justify-content:center; color:var(--ink-faint);
  }
  .tp-comment-edit svg, .tp-comment-del svg{width:13px; height:13px;}
  .tp-comment-edit:hover{background:var(--surface-2); color:var(--ink-soft);}
  .tp-comment-del:hover{background:var(--danger-light); color:var(--danger);}

  /* ---------- NOTES (Keep style) ---------- */
  .composer{
    padding:0;
  }
  #noteComposerModal h3{ margin-bottom:14px; }
  .composer input.note-title{
    width:100%; border:none; outline:none; font-family:var(--font-display);
    font-weight:700; font-size:16px; margin-bottom:6px; background:transparent;
  }
  .composer textarea{
    width:100%; border:none; outline:none; resize:none; font-size:14px;
    background:transparent; min-height:40px; line-height:1.5;
  }
  .composer-footer{
    display:flex; align-items:center; gap:8px; margin-top:10px; padding-top:10px;
    border-top:1px solid var(--border); flex-wrap:wrap;
  }
  .note-bottom-bar{
    position:sticky; bottom:0; z-index:15;
    display:flex; flex-direction:column; gap:8px;
    margin:14px -22px -22px; padding:10px 22px;
    border-top:1px solid var(--border); background:var(--surface);
  }
  .note-bottom-row-top{display:flex; align-items:center; gap:8px;}
  .note-bottom-row{display:flex; align-items:center; gap:10px;}
  .note-bottom-bar .note-cat-select{flex-shrink:0; max-width:140px;}
  .note-bottom-bar .tp-tags-selected{flex:1; min-width:0;}
  .rt-toolbar-color-group{
    display:flex; align-items:center; gap:6px; padding-left:8px; margin-left:4px;
    border-left:1px solid var(--border);
  }
  .rt-palette-icon{width:16px; height:16px; color:var(--ink-faint); flex-shrink:0;}
  .color-dot{
    width:20px; height:20px; border-radius:50%; border:2px solid transparent; flex-shrink:0;
  }
  .color-dot.selected{border-color:var(--ink);}
  .composer select{
    border:1px solid var(--border); border-radius:6px; padding:5px 8px; font-size:12.5px; color:var(--ink-soft);
  }

  .notes-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));

  .app.sidebar-collapsed .notes-grid{max-width:1280px;}
  .note-card{

    box-shadow:var(--shadow-sm);
  }
  .note-card.selected{ border-color:var(--primary); box-shadow:var(--shadow-md); }

  .note-card::after{

  .note-body-preview{font-size:13px; line-height:1.5; color:var(--ink-soft); word-break:break-word;}
  .note-cat-chip-mini{

  }
  .note-meta-left{display:flex; align-items:center; gap:6px; min-width:0; overflow:hidden;}
  .note-tag-pill-mini{
    display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600;
    padding:2px 8px; border-radius:20px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .note-tag-pill-mini .dot{width:5px; height:5px; border-radius:50%; flex-shrink:0;}
  .note-tag-more-mini{
    font-size:10.5px; color:var(--ink-faint); font-weight:600; flex-shrink:0;
  }
  .note-attach-row-preview{display:flex; gap:5px; margin-top:8px;}
  .note-attach-row-preview img{width:40px; height:40px; border-radius:6px; object-fit:cover; border:1px solid var(--border);}
  .note-attach-more{
    display:flex; align-items:center; justify-content:center; width:40px; height:40px;
    border-radius:6px; background:var(--surface-2); color:var(--ink-faint); font-size:11px; font-weight:600;
  }
  .notes-layout{ display:flex; gap:20px; align-items:flex-start; }
  .notes-list-col{ flex:1; min-width:0; }
  .notes-list-col.with-panel{ max-width:calc(100% - var(--edit-panel-width, 500px) - 28px); }
  .note-edit-panel .note-body-input{ min-height:200px; }
  .tp-header-actions{display:flex; align-items:center; gap:2px;}
  .tp-header-icon-btn{
    width:28px; height:28px; border:none; background:transparent; color:var(--ink-faint);
    border-radius:6px; display:flex; align-items:center; justify-content:center;
  }
  .tp-header-icon-btn svg{width:15px; height:15px;}
  .tp-header-icon-btn:hover{background:var(--surface-2); color:var(--ink-soft);}
  .tp-header-icon-btn.active{color:var(--accent);}
  .tp-header-icon-btn.danger:hover{background:var(--danger-light); color:var(--danger);}
  .note-title{font-family:var(--font-display); font-weight:700; font-size:14.5px; margin-bottom:6px; outline:none;}
  .rt-toolbar{
    display:none;
    align-items:center; gap:1px; flex-wrap:wrap;
    padding-top:8px; margin-top:8px; border-top:1px solid var(--border);
  }
  .composer:focus-within .rt-toolbar,
  .note-card:focus-within .rt-toolbar,
  .note-edit-panel .rt-toolbar{
    display:flex;
  }
  .composer .rt-toolbar{
    position:sticky; top:0; z-index:20;
    background:var(--surface); padding:8px 2px; margin:0 0 10px;
    border-top:none; border-bottom:1px solid var(--border);
  }
  .rt-btn{
    width:25px; height:24px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    border:none; background:transparent; border-radius:6px;
    color:var(--ink-soft); font-size:12.5px; font-family:var(--font-body);
  }
  .rt-btn:hover{background:var(--surface-2); color:var(--ink);}
  .rt-btn.active{background:#BFE0D3; color:var(--primary-dark);}
  .rt-btn svg{width:14px; height:14px;}
  .rt-sep{width:1px; height:16px; background:var(--border); margin:0 5px; flex-shrink:0;}
  .rt-format-select{
    border:1px solid var(--border); border-radius:6px; background:var(--surface);
    font-size:12px; color:var(--ink-soft); padding:3px 4px; flex-shrink:0; max-width:88px;
  }
  .rt-format-select:hover{color:var(--ink);}
  .rt-format-select:focus{outline:none;}

  .note-body-input h1, .note-body h1, .note-body-preview h1{font-family:var(--font-display); font-size:20px; font-weight:700; margin:6px 0;}
  .note-body-input h2, .note-body h2, .note-body-preview h2{font-family:var(--font-display); font-size:17px; font-weight:700; margin:5px 0;}
  .note-body-input h3, .note-body h3, .note-body-preview h3{font-family:var(--font-display); font-size:14.5px; font-weight:700; margin:4px 0;}

  .note-body-input, .note-body{
    font-size:13.5px; line-height:1.55; outline:none; color:var(--ink-soft);
    min-height:20px; word-break:break-word;
  }
  .note-body-input:empty:before, .note-body:empty:before{
    content:attr(data-placeholder); color:var(--ink-faint);
  }
  .note-body-input ul, .note-body ul, .note-body-preview ul{ padding-left:20px; list-style:disc; }
  .note-body-input ol, .note-body ol, .note-body-preview ol{ padding-left:20px; list-style:decimal; }
  .note-meta{
    display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:10px;
    font-size:11.5px; color:var(--ink-faint); font-family:var(--font-mono);
  }
  .note-cat-chip{
    display:inline-flex; align-items:center; gap:4px;
    padding:2px 7px; border-radius:20px; background:rgba(0,0,0,.05);
  }
  .note-cat-picker{
    border:none; background:transparent; font-size:12px; font-weight:700;
    font-family:var(--font-display); padding:2px 2px 2px 0;
  }
  .note-cat-picker:hover{opacity:.8; cursor:pointer;}
  .note-cat-picker:focus{outline:none;}
  .note-footer-row{
    display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-top:8px;
  }
  .color-swatch-btn{
    width:16px; height:16px; border-radius:50%; border:1.5px solid var(--border);
    cursor:pointer; flex-shrink:0; padding:0;
  }
  .color-swatch-label{
    display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft); cursor:pointer;
  }
  .confirm-action-portal{
    display:none; position:fixed; z-index:800; width:220px;
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    box-shadow:var(--shadow-md); padding:12px;
  }
  .confirm-action-portal.show{display:block;}
  .confirm-action-msg{font-size:13px; color:var(--ink); margin-bottom:10px; line-height:1.4;}
  .confirm-action-buttons{display:flex; justify-content:flex-end; gap:8px;}
  .confirm-action-danger{background:var(--danger); border-color:var(--danger);}
  .confirm-action-danger:hover{background:#a03a30;}

  .color-popover-portal{
    display:none; position:fixed; z-index:600;
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    box-shadow:var(--shadow-md); padding:8px;
    grid-template-columns:repeat(4, 1fr); gap:6px; width:150px;
  }
  .color-popover-portal.show{display:grid;}
  .note-color-dot{
    width:13px; height:13px; border-radius:50%; flex-shrink:0; cursor:pointer;
    border:1.5px solid transparent;
  }
  .note-color-dot.selected{border-color:var(--ink);}
  .color-popover-portal .note-color-dot{ width:22px; height:22px; border-width:2px; }
  .note-updated-at{font-size:10px; color:var(--ink-faint); font-family:var(--font-mono); white-space:nowrap;}
  .note-attach-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .note-attach-thumb{
    position:relative; width:56px; height:56px; border-radius:6px; overflow:hidden;
    border:1px solid var(--border); flex-shrink:0;
  }
  .note-attach-thumb img{width:100%; height:100%; object-fit:cover; display:block; cursor:pointer;}
  .note-attach-del{
    position:absolute; top:1px; right:1px; width:16px; height:16px; border-radius:50%;
    border:none; background:rgba(0,0,0,.55); color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:10px; line-height:1;
  }
  .note-attach-btn{
    border:none; background:transparent; color:var(--ink-faint); width:22px; height:22px;
    border-radius:5px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .note-attach-btn:hover{background:var(--surface-2); color:var(--ink-soft);}
  .note-attach-btn svg{width:14px; height:14px;}
  .note-linked-task-btn{
    display:flex; align-items:center; gap:6px; border:1px dashed var(--border); background:transparent;
    color:var(--ink-faint); font-size:12px; padding:4px 10px; border-radius:20px; margin-left:6px;
  }
  .note-linked-task-btn svg{width:12px; height:12px; flex-shrink:0;}
  .note-linked-task-btn:hover{background:var(--surface-2); color:var(--ink-soft);}
  .note-linked-task-btn.linked{border-style:solid; border-color:var(--primary); color:var(--primary); font-weight:600;}
  .move-group-btn{
    border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); width:32px; height:32px;
    border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .move-group-btn:hover{background:var(--surface-2); color:var(--ink);}
  .move-group-btn svg{width:15px; height:15px;}
  .move-group-btn.pinned-active{color:var(--danger); border-color:var(--danger);}
  .group-current-chip{
    display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:20px;
    font-size:12.5px; font-weight:600; flex-shrink:0; white-space:nowrap;
  }
  .group-move-row{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .cat-tags-combined-row{display:flex; align-items:center; gap:10px;}
  .cat-tags-combined-row .tp-tags-selected{flex:1; min-width:0;}
  .note-actions{
    position:absolute; top:10px; right:10px; z-index:10;
    display:flex; gap:4px;
  }
  .note-actions button{
    width:24px; height:24px; border-radius:6px; border:none; background:transparent;
    display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
    opacity:0; transition:opacity .15s, background .15s;
  }
  .note-actions button.pinned{color:var(--danger);}
  .note-card:hover .note-actions button{opacity:1; background:var(--note-bg);}
  .note-actions button:hover{filter:brightness(0.94); color:var(--ink);}
  .note-actions button svg{width:13px; height:13px;}
  .note-corner-pin{
    position:absolute; top:0; right:0; z-index:9;
    width:22px; height:22px; display:flex; align-items:center; justify-content:center;
    color:var(--danger); border-radius:0 var(--radius) 0 8px;
    transition:opacity .15s;
  }
  .note-corner-pin svg{width:12px; height:12px;}
  .note-card:hover .note-corner-pin{opacity:0; pointer-events:none;}

  /* ===== Dashboard ===== */
  .dash-wrap{display:flex; flex-direction:column; gap:20px; max-width:1180px; margin:0 auto; padding-bottom:30px;}

  .dash-header-row{display:flex; align-items:flex-start; justify-content:flex-end; flex-wrap:wrap; gap:12px;}
  .dash-main-title{font-family:var(--font-display); font-weight:800; font-size:24px; margin-bottom:2px;}
  .dash-date-subtitle{font-size:13px; color:var(--ink-faint); text-transform:capitalize;}
  .dash-header-actions{display:flex; gap:8px;}
  .dash-header-actions .btn{display:flex; align-items:center; gap:6px;}
  .dash-header-actions .btn svg{width:14px; height:14px;}

  .dash-alert-cards{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
  .dash-alert-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px;
  }
  .dash-alert-card.danger{background:var(--danger-light); border-color:var(--danger-light);}
  .dash-alert-card.warn{background:var(--priority-alta-light); border-color:var(--priority-alta-light);}
  .dash-alert-card.info{background:var(--priority-baixa-light); border-color:var(--priority-baixa-light);}
  .dash-alert-card.purple{background:var(--accent-light); border-color:var(--accent-light);}
  .dash-alert-card-top{display:flex; align-items:center; justify-content:space-between;}
  .dash-alert-label{font-size:13px; color:var(--ink-soft); font-weight:600;}
  .dash-alert-icon{
    width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .dash-alert-icon svg{width:16px; height:16px;}
  .dash-alert-icon.danger{background:var(--danger); color:#fff;}
  .dash-alert-icon.warn{background:var(--priority-alta); color:#fff;}
  .dash-alert-icon.info{background:var(--priority-baixa); color:#fff;}
  .dash-alert-icon.purple{background:var(--accent); color:#fff;}
  .dash-alert-num{font-family:var(--font-display); font-size:30px; font-weight:800; margin-top:14px;}

  .dash-critical-banner{
    display:flex; align-items:center; gap:8px; background:var(--danger-light); color:var(--danger);
    border:1px solid var(--danger); border-radius:var(--radius); padding:10px 14px; font-size:13px; font-weight:600;
  }
  .dash-critical-banner svg{width:18px; height:18px; flex-shrink:0;}

  .dash-section{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; min-width:0;}
  .dash-section-title{
    display:flex; align-items:center; gap:8px;
    font-family:var(--font-display); font-weight:700; font-size:14px; margin-bottom:12px;
  }
  .dash-section-title svg{width:16px; height:16px; flex-shrink:0;}
  .dash-grid-2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .dash-grid-priority-prod{display:grid; grid-template-columns:2fr 3fr; gap:16px;}
  .dash-grid-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; align-items:stretch;}
  .dash-section-stack{display:flex; flex-direction:column; gap:16px;}

  .dash-empty-state{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:34px 10px; color:var(--ink-faint); text-align:center;}
  .dash-empty-state svg{width:34px; height:34px; margin-bottom:10px; opacity:.5;}
  .dash-empty-state p{font-size:12.5px;}

  .dash-list{display:flex; flex-direction:column; gap:2px;}
  .dash-list-row{
    display:flex; align-items:center; gap:10px; padding:8px 6px; border-radius:6px; cursor:pointer; font-size:13px; min-width:0;
  }
  .dash-list-row:hover{background:var(--surface-2);}
  .dash-list-title{flex:1; min-width:0; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .dash-list-date{font-size:11.5px; color:var(--ink-faint); font-family:var(--font-mono); flex-shrink:0;}
  .dash-list-date.overdue{color:var(--danger); font-weight:700;}
  .dash-note-tag{font-size:11px; font-weight:600; flex-shrink:0;}
  .dash-strip-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .dash-strip-header .dash-section-title{margin-bottom:0;}
  .dash-see-all-link{font-size:12.5px; font-weight:600; color:var(--primary); text-decoration:none;}
  .dash-see-all-link:hover{text-decoration:underline;}
  .dash-notes-strip{display:grid; grid-template-columns:repeat(5, 1fr); gap:10px;}
  .dash-note-card{
    border:1px solid; border-radius:10px; padding:10px 12px; cursor:pointer; min-width:0;
    transition:transform .1s;
  }
  .dash-note-card:hover{transform:translateY(-2px);}
  .dash-note-card-title{font-weight:700; font-size:13.5px; margin-bottom:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .dash-note-card-snippet{
    font-size:12px; color:var(--ink-soft); line-height:1.4; margin-bottom:8px;
    display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden;
  }
  .dash-note-card-date{font-size:11px; color:var(--ink-faint); font-family:var(--font-mono);}
  .dash-empty{font-size:12.5px; color:var(--ink-faint);}

  .dash-priority-bars{display:flex; flex-direction:column; gap:12px;}
  .dash-priority-row-top{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; margin-bottom:5px;}
  .dash-priority-row-top .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .dash-priority-frac{margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); font-weight:400;}
  .dash-priority-track{height:7px; border-radius:20px; background:var(--surface-2); overflow:hidden;}
  .dash-priority-fill{height:100%; border-radius:20px;}

  .dash-prod-stat-row{display:flex; gap:10px;}
  .dash-prod-stat-box{flex:1; background:var(--surface-2); border-radius:8px; padding:12px; text-align:center;}
  .dash-prod-stat-label{font-size:11.5px; color:var(--ink-soft);}
  .dash-prod-stat-value{font-family:var(--font-display); font-size:22px; font-weight:700; margin-top:2px;}
  .dash-prod-extra{display:flex; flex-direction:column; gap:4px; margin-top:12px; font-size:11.5px; color:var(--ink-soft);}

  .dash-donut-row{display:flex; align-items:center; gap:28px; padding:6px 0;}
  .dash-donut-wrap{position:relative; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
  .dash-donut-center{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; pointer-events:none;}
  .dash-donut-center-num{font-family:var(--font-display); font-size:26px; font-weight:800; line-height:1;}
  .dash-donut-center-label{font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em; margin-top:2px;}
  .dash-donut-legend{display:flex; flex-direction:column; gap:12px; font-size:13px; flex:1;}
  .dash-legend-row{display:flex; align-items:center; gap:8px;}
  .dash-legend-row .dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .dash-legend-name{color:var(--ink-soft); font-weight:600;}
  .dash-legend-count{margin-left:auto; font-family:var(--font-display); font-weight:700; font-size:15px;}
  .dash-legend-pct{width:40px; text-align:right; font-size:11.5px; color:var(--ink-faint); font-family:var(--font-mono);}
  .dash-prod-stats{display:flex; flex-direction:column; gap:4px; margin-top:10px; font-size:12.5px; color:var(--ink-soft);}
  .dash-avg-priority{font-size:11.5px;}

  .dash-kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  .dash-kpi-card{background:var(--surface-2); border-radius:8px; padding:12px;}
  .dash-kpi-value{font-family:var(--font-display); font-size:20px; font-weight:700;}
  .dash-kpi-trend{font-size:12px; font-weight:600;}
  .dash-kpi-trend.up{color:var(--priority-media);}
  .dash-kpi-trend.down{color:var(--danger);}
  .dash-kpi-label{font-size:11.5px; color:var(--ink-soft); margin-top:3px;}
  .dash-catload-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .dash-catload-pill{
    display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600;
    padding:4px 10px; border-radius:20px;
  }
  .dash-catload-pill .dot{width:6px; height:6px; border-radius:50%;}

  .dash-hygiene-row{display:flex; flex-wrap:wrap; gap:8px;}
  .dash-hygiene-pill{
    font-size:12px; font-weight:600; color:var(--ink-soft); background:var(--surface-2);
    padding:5px 12px; border-radius:20px;
  }
  @media (max-width: 1000px){
    .dash-grid-3{grid-template-columns:1fr;}
  }
  @media (max-width: 900px){
    .dash-alert-cards, .dash-kpi-grid{grid-template-columns:repeat(2,1fr);}
    .dash-grid-2{grid-template-columns:1fr;}
    .dash-grid-priority-prod{grid-template-columns:1fr;}
    .dash-notes-strip{grid-template-columns:repeat(2,1fr);}
  }

    /* ===== Calendário ===== */
  .cal-header{
    display:flex; align-items:center; gap:16px; margin-bottom:20px; flex-wrap:wrap;
  }
  .cal-view-toggle{display:flex; gap:2px; background:var(--surface-2); padding:3px; border-radius:8px;}
  .cal-view-toggle button{
    border:none; background:transparent; padding:6px 14px; border-radius:6px; font-size:13px; color:var(--ink-soft);
  }
  .cal-view-toggle button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm); font-weight:600;}
  .cal-nav{display:flex; align-items:center; gap:4px;}
  .cal-nav button{
    border:1px solid var(--border); background:var(--surface); border-radius:7px;
    width:30px; height:30px; display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
  }
  .cal-nav button svg{width:14px; height:14px;}
  .cal-nav #calTodayBtn{width:auto; padding:0 12px; font-size:12.5px;}
  .cal-period-label{font-family:var(--font-display); font-weight:700; font-size:16px; margin-left:4px;}

  .cal-month-grid{
    display:grid; grid-template-columns:repeat(7,1fr); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;
  }
  .cal-month-weekday{
    padding:8px; text-align:center; font-size:11.5px; font-weight:600; color:var(--ink-faint);
    background:var(--surface-2); border-bottom:1px solid var(--border);
  }
  .cal-month-cell{
    min-height:100px; min-width:0; border-right:1px solid var(--border); border-bottom:1px solid var(--border);
    padding:6px; background:var(--surface); cursor:pointer; display:flex; flex-direction:column; gap:4px;
  }
  .cal-month-cell:nth-child(7n){border-right:none;}
  .cal-month-cell.other-month{background:var(--bg); color:var(--ink-faint);}
  .cal-month-cell.other-month .cal-month-daynum{color:var(--ink-faint);}
  .cal-month-cell.weekend{background:var(--surface-2);}
  .cal-month-cell.weekend.other-month{background:var(--bg);}
  .cal-month-cell.today .cal-month-daynum{
    background:var(--primary); color:#fff; border-radius:50%; width:20px; height:20px;
    display:flex; align-items:center; justify-content:center;
  }
  .cal-month-weekday.weekend{color:var(--danger);}
  .cal-month-daynum{font-size:12.5px; font-weight:600;}
  .cal-month-events{display:flex; flex-direction:column; gap:3px; min-width:0;}
  .cal-event-pill{
    font-size:10.5px; font-weight:600; padding:2px 6px; border-radius:5px;
    white-space:normal; word-break:break-word; overflow-wrap:break-word;
    display:flex; align-items:flex-start; gap:4px; line-height:1.3;
  }
  .cal-event-pill .dot{width:5px; height:5px; border-radius:50%; flex-shrink:0; margin-top:4px;}
  .cal-event-more{font-size:10px; color:var(--ink-faint); padding-left:4px;}

  .cal-week-wrap{border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; background:var(--surface); display:flex; flex-direction:column;}
  .cal-week-headrow, .cal-week-alldayrow{display:grid; grid-template-columns:52px repeat(7,1fr); border-bottom:1px solid var(--border);}
  .cal-week-gutter-cell{border-right:1px solid var(--border);}
  .cal-week-colhead{
    padding:8px; text-align:center; font-size:12px; font-weight:600; color:var(--ink-soft);
    background:var(--surface-2); border-right:1px solid var(--border);
  }
  .cal-week-colhead.today{background:var(--primary-light); color:var(--primary-dark);}
  .cal-week-colhead.weekend{background:var(--danger-light); color:var(--danger);}
  .cal-week-colhead.weekend.today{background:var(--primary-light); color:var(--primary-dark);}
  .cal-week-colhead span{display:block; font-size:15px; font-family:var(--font-display); color:var(--ink);}
  .cal-week-allday-cell{
    padding:4px; border-right:1px solid var(--border); display:flex; flex-direction:column; gap:3px; min-height:26px;
  }
  .cal-week-allday-cell.weekend{background:var(--surface-2);}
  .cal-week-scroll{
    flex:1; overflow-y:auto; height:calc(100vh - 340px); min-height:360px;
  }
  .cal-week-hourgrid{display:grid; grid-template-columns:52px repeat(7,1fr); position:relative;}
  .cal-week-gutter{border-right:1px solid var(--border);}
  .cal-week-hour-label{
    font-size:10.5px; color:var(--ink-faint); text-align:right; padding-right:6px;
    box-sizing:border-box; border-bottom:1px solid var(--border); transform:translateY(-6px);
  }
  .cal-density-row{display:flex; justify-content:flex-end; padding:8px 8px 0;}
  .cal-density-row .cal-view-toggle button{padding:5px 12px; font-size:12px;}
  .cal-week-daycol{position:relative; border-right:1px solid var(--border); cursor:pointer;}
  .cal-week-daycol.today{background:var(--primary-light-faint, rgba(47,111,94,.03));}
  .cal-week-daycol.weekend{background:var(--surface-2);}
  .cal-week-daycol.weekend.today{background:var(--primary-light-faint, rgba(47,111,94,.03));}
  .cal-week-hour-line{position:absolute; left:0; right:0; border-top:1px solid var(--border);}
  .cal-event-block-timed{
    position:absolute; left:3px; right:3px; border-left:3px solid; border-radius:6px; padding:3px 6px;
    overflow:hidden; display:flex; flex-direction:column; gap:1px; box-sizing:border-box; z-index:2;
  }
  .cal-event-time{font-size:10.5px; font-weight:700; color:var(--ink-soft);}
  .cal-event-title{font-size:12.5px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cal-event-tag{
    font-size:10px; font-weight:600; opacity:.75; white-space:nowrap;
  }
  .cal-empty-day{font-size:11.5px; color:var(--ink-faint); text-align:center; padding-top:20px;}

  .cal-day-list{display:flex; flex-direction:column; gap:8px; margin-bottom:14px;}
  .cal-day-row{
    display:flex; align-items:center; gap:14px; padding:12px 14px; background:var(--surface);
    border:1px solid var(--border); border-left-width:4px; border-radius:var(--radius); cursor:pointer;
  }
  .cal-day-time{font-family:var(--font-mono); font-size:12.5px; color:var(--ink-soft); flex-shrink:0; width:110px;}
  .cal-day-title{font-weight:600; flex:1;}
  .cal-day-cat{font-size:12px; font-weight:600; flex-shrink:0;}
  .cal-day-add-btn{
    width:100%; padding:10px; border:1.5px dashed var(--border); border-radius:var(--radius);
    background:transparent; color:var(--ink-soft); font-size:13px; font-weight:600;
  }
  .cal-day-add-btn:hover{background:var(--surface-2); color:var(--ink);}

  .tp-agenda-notes-row{display:flex; gap:16px;}
  .tp-agenda-notes-col{flex:1; min-width:0;}
  .tp-task-agenda-row{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px;
    background:var(--surface-2); font-size:12.5px; margin-bottom:6px;
  }
  .tp-task-agenda-row .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .tp-task-agenda-date{color:var(--ink-faint); font-family:var(--font-mono); font-size:11px; flex-shrink:0;}

  }

  .empty-state p{font-size:14px; max-width:280px; margin:0 auto;}

  .section-label{
    font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-faint); margin:26px 0 10px; max-width:1100px; margin-left:auto; margin-right:auto;
  }

  /* ---------- MODAL (categorias) ---------- */
  .overlay{

  }

    width:32px; height:32px; border:none; border-radius:8px; padding:0; background:none;

  .cat-row button{
    width:28px; height:28px; border:none; background:transparent; color:var(--ink-faint); border-radius:6px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .cat-row button:hover{background:var(--danger-light); color:var(--danger);}
  .cat-row button svg{width:14px; height:14px;}
  .modal-footer{display:flex; justify-content:space-between; margin-top:16px;}

  .profile-form label{
    display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin:14px 0 5px;
  }
  .profile-form label:first-of-type{margin-top:4px;}
  .profile-form input[type=text], .profile-form input[type=email]{
    width:100%; border:1px solid var(--border); border-radius:8px; padding:9px 11px; font-size:14px;
  }

  .avatar-picker{display:flex; align-items:center; gap:16px; margin-top:4px;}
  .avatar-preview{
    width:64px; height:64px; border-radius:50%; object-fit:cover; flex-shrink:0;
    background:var(--primary-light); color:var(--primary-dark);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:22px; overflow:hidden;
  }
  .avatar-preview img{width:100%; height:100%; object-fit:cover;}

  .crop-stage{
    width:220px; height:220px; border-radius:50%; overflow:hidden;
    position:relative; margin:14px auto 12px; background:var(--surface-2);
    border:1px dashed var(--border); cursor:grab;
  }
  .crop-stage:active{cursor:grabbing;}
  .crop-stage img{position:absolute; top:0; left:0; user-select:none; pointer-events:none;}
  .crop-controls{display:flex; align-items:center; gap:10px; max-width:220px; margin:0 auto;}
  .crop-controls svg{width:15px; height:15px; color:var(--ink-faint); flex-shrink:0;}
  .crop-controls input[type=range]{flex:1; accent-color:var(--primary);}
  .crop-hint{text-align:center; font-size:11px; color:var(--ink-faint); margin-top:6px;}

  .link-desc{font-size:13.5px; color:var(--ink-soft); line-height:1.5; margin-bottom:16px;}
  .link-option{
    display:flex; align-items:center; gap:12px; width:100%;
    padding:13px 14px; border-radius:var(--radius); border:1px solid var(--border);
    background:var(--surface); text-align:left; margin-bottom:10px;
  }
  .link-option:hover{background:var(--surface-2); border-color:var(--primary);}
  .link-option .icon{font-size:20px; flex-shrink:0;}
  .link-option .txt strong{display:block; font-size:14px; color:var(--ink);}
  .link-option .txt span{display:block; font-size:12px; color:var(--ink-faint); margin-top:1px;}
  .link-option.primary{border-color:var(--primary); background:var(--primary-light);}
  .link-skip{
    display:block; width:100%; text-align:center; margin-top:6px;
    background:none; border:none; font-size:12.5px; color:var(--ink-faint); text-decoration:underline;
    padding:6px;
  }
  .link-skip:hover{color:var(--ink-soft);}

  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (max-width:760px){
    .app{grid-template-columns:1fr;}
    .sidebar{display:none;}
  }
</style>
</head>
