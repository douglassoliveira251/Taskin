<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230a1c3d'/%3E%3Crect x='10' y='12' width='14' height='76' rx='7' fill='%233FA087'/%3E%3Crect x='10' y='12' width='70' height='14' rx='7' fill='%233FA087'/%3E%3Crect x='29' y='37' width='53' height='10' rx='5' fill='%233FA087'/%3E%3Crect x='29' y='56' width='34' height='10' rx='5' fill='%233FA087'/%3E%3Cpath d='M42 76l10 10 28 -28' stroke='%233FA087' stroke-width='11' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
<title>Taskin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --edit-panel-width: 500px;
    --bg:#F5F6F8;
    --surface:#FFFFFF;
    --surface-2:#EEF0F3;
    --ink:#1B2130;
    --ink-soft:#5B6472;
    --ink-faint:#9AA2AE;
    --border:#E1E4E9;
    --primary:#2F6F5E;
    --primary-dark:#234F42;
    --primary-light:#E4F0EC;
    --accent:#E2A83D;
    --accent-light:#FBF0D9;
    --danger:#C0453A;
    --danger-light:#F8E6E4;
    --priority-baixa:#2E90FA;
    --priority-baixa-light:#EFF7FF;
    --priority-media:#12B76A;
    --priority-media-light:#EBFAF3;
    --priority-alta:#F79009;
    --priority-alta-light:#FFF6E9;
    --priority-critica:#E11D48;
    --priority-critica-light:#FEEDF0;
    --radius:10px;
    --radius-sm:6px;
    --shadow-sm:0 1px 2px rgba(27,33,48,.06);
    --shadow-md:0 6px 20px rgba(27,33,48,.10);
    --font-display:'Sora',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  [data-theme="dark"]{
    --bg:#15171C;
    --surface:#1E2127;
    --surface-2:#282C34;
    --ink:#E9EAEE;
    --ink-soft:#A6ACB8;
    --ink-faint:#6B7280;
    --border:#34383F;
    --primary:#3FA087;
    --primary-dark:#8FD9BF;
    --primary-light:#1B332C;
    --accent:#EFBD5C;
    --accent-light:#332812;
    --danger:#E2685C;
    --danger-light:#3A211F;
    --priority-baixa:#5CA8FF;
    --priority-baixa-light:#16263A;
    --priority-media:#38D188;
    --priority-media-light:#152E24;
    --priority-alta:#FFAA4D;
    --priority-alta-light:#332413;
    --priority-critica:#FF6B85;
    --priority-critica-light:#38181F;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
    --shadow-md:0 6px 20px rgba(0,0,0,.45);
  }
  [data-theme="dark"] .status-dot{background:var(--ink-faint);}
  [data-theme="dark"] .status-dot.saved{background:var(--primary);}
  [data-theme="dark"] .status-dot.dirty{background:var(--accent);}
  [data-theme="dark"] img, [data-theme="dark"] .profile-avatar-img{filter:brightness(.92);}
  [data-theme="dark"] input[type="date"],
  [data-theme="dark"] input[type="time"]{color-scheme:dark;}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--ink);
    height:100vh;
    overflow:hidden;
    transition:background-color .15s, color .15s;
  }
  button{font-family:inherit; cursor:pointer;}
  input, textarea, select{font-family:inherit;}
  ::selection{background:#3B82F6; color:#fff;}

  .app{
    display:grid;
    grid-template-columns:236px 1fr;
    height:100vh;
    transition:grid-template-columns .15s;
  }
  .app.sidebar-collapsed{grid-template-columns:68px 1fr;}
  .app.sidebar-collapsed .sidebar{padding:20px 10px;}
  .app.sidebar-collapsed .brand-sub{display:none;}
  .app.sidebar-collapsed .brand-block{padding-bottom:12px; margin-bottom:12px;}
  .app.sidebar-collapsed .brand-wordmark{display:none;}
  .app.sidebar-collapsed .brand{justify-content:center;}
  .app.sidebar-collapsed .nav-item{justify-content:center; padding:9px; gap:0;}
  .app.sidebar-collapsed .nav-label,
  .app.sidebar-collapsed .nav-count,
  .app.sidebar-collapsed .sidebar-section-label,
  .app.sidebar-collapsed .cat-list,
  .app.sidebar-collapsed .settings-btn span{display:none;}
  .app.sidebar-collapsed .cat-collapsed-btn{justify-content:center; padding:9px; gap:0;}
  .app.sidebar-collapsed .settings-btn{justify-content:center; padding:9px;}
  .app.sidebar-collapsed #sidebarCollapseIcon{transform:rotate(180deg);}
  .cat-collapsed-wrap{margin-top:4px;}
  .cat-collapsed-btn{width:100%;}
  .cat-collapsed-popover{
    position:fixed; z-index:70; min-width:180px; max-height:60vh; overflow-y:auto;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow-md); padding:6px;
  }
  .cat-collapsed-pop-item{
    display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:var(--radius-sm);
    font-size:13px; color:var(--ink); cursor:pointer;
  }
  .cat-collapsed-pop-item:hover{background:var(--surface-2);}
  .cat-collapsed-pop-item.active{background:var(--primary-light); color:var(--primary-dark); font-weight:600;}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    --bg:#15171C;
    --surface:#1E2127;
    --surface-2:#282C34;
    --ink:#E9EAEE;
    --ink-soft:#A6ACB8;
    --ink-faint:#6B7280;
    --border:#34383F;
    --primary:#3FA087;
    --primary-dark:#8FD9BF;
    --primary-light:#1B332C;
    --accent:#EFBD5C;
    --accent-light:#332812;
    --danger:#E2685C;
    --danger-light:#3A211F;
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding:20px 16px;
    position:relative;
  }
  .sidebar-float-toggle{
    position:absolute; top:28px; right:-14px; z-index:20;
    width:28px; height:28px; border-radius:50%;
    background:var(--primary); color:#fff; border:3px solid var(--bg);
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow-sm); cursor:pointer;
  }
  .sidebar-float-toggle svg{width:14px; height:14px; transition:transform .15s;}
  .sidebar-float-toggle:hover{filter:brightness(0.8);}
  .app.sidebar-collapsed .sidebar-float-toggle svg{transform:rotate(180deg);}
  .brand-block{
    padding-bottom:16px;
    margin-bottom:16px;
    border-bottom:1px solid var(--border);
    text-align:center;
  }
  .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    margin-bottom:7px;
  }
  .brand-icon{
    width:26px;
    height:26px;
    flex-shrink:0;
    border-radius:6px;
  }
  .brand-wordmark{
    font-family:var(--font-display);
    font-weight:800;
    font-size:22px;
    letter-spacing:.01em;
    color:var(--primary);
  }
  .brand-suffix{
    font-family:var(--font-display);
    font-weight:600;
    font-size:16px;
    letter-spacing:.02em;
    color:var(--ink-faint);
    padding-left:10px;
    border-left:1px solid var(--border);
    line-height:1.1;
  }
  .brand-sub{
    font-size:11.5px;
    color:var(--ink-faint);
    text-align:center;
  }
  .profile-card{
    display:flex; align-items:center; gap:10px;
    padding:10px; margin-bottom:18px;
    border:1px solid var(--border); border-radius:var(--radius);
    background:var(--surface); position:relative;
  }
  .profile-avatar{
    width:38px; height:38px; border-radius:50%; flex-shrink:0;
    background:var(--primary-light); color:var(--primary-dark);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:14px;
    overflow:hidden;
  }
  .profile-avatar img{width:100%; height:100%; object-fit:cover; display:block;}
  .profile-avatar svg{width:60%; height:60%;}
  .profile-info{flex:1; min-width:0;}
  .profile-name{font-size:13.5px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .profile-email{font-size:11.5px; color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .notification-btn{
    border:1px solid var(--border); background:var(--surface); color:var(--ink-soft);
    width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; margin-left:auto;
  }
  .notification-btn:hover{background:var(--surface-2); color:var(--ink);}
  .notification-btn svg{width:17px; height:17px;}
  .topbar-avatar-wrap{position:relative; margin-left:10px;}
  .topbar-avatar-btn{
    border:none; background:transparent; padding:0; border-radius:50%; cursor:pointer;
    width:36px; height:36px; flex-shrink:0;
  }
  .topbar-avatar-btn .profile-avatar{width:36px; height:36px;}
  .topbar-avatar-btn:hover .profile-avatar{box-shadow:0 0 0 2px var(--primary-light);}
  .avatar-dropdown-menu{
    position:absolute; top:calc(100% + 8px); right:0; width:230px; z-index:60;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow-md); padding:8px; display:flex; flex-direction:column; gap:2px;
  }
  .avatar-dropdown-header{
    display:flex; align-items:center; gap:10px; padding:8px 8px 12px; margin-bottom:6px;
    border-bottom:1px solid var(--border);
  }
  .avatar-dropdown-item{
    display:flex; align-items:center; gap:9px; width:100%; text-align:left;
    padding:9px 10px; border-radius:var(--radius-sm); border:none; background:transparent;
    font-size:13.5px; font-weight:500; color:var(--ink);
  }
  .avatar-dropdown-item svg{width:16px; height:16px; flex-shrink:0; color:var(--ink-soft);}
  .avatar-dropdown-item:hover{background:var(--surface-2);}
  .avatar-dropdown-item.danger{color:var(--danger);}
  .avatar-dropdown-item.danger svg{color:var(--danger);}
  .avatar-dropdown-item.danger:hover{background:var(--danger-light);}

  .settings-btn{
    display:flex; align-items:center; gap:9px;
    padding:9px 10px; border-radius:var(--radius-sm);
    border:none; background:transparent; color:var(--ink-soft);
    font-size:13.5px; font-weight:500; text-align:left; margin-bottom:8px;
  }
  .settings-btn:hover{background:var(--surface-2); color:var(--ink);}
  .settings-btn.active{background:var(--primary-light); color:var(--primary-dark); font-weight:600;}
  .settings-btn svg{width:16px; height:16px; flex-shrink:0;}

  .settings-tabs{
    display:flex; gap:4px; border-bottom:1px solid var(--border);
    max-width:640px; margin:0 auto 24px;
  }
  .settings-tab-btn{
    padding:10px 4px; margin-right:22px; border:none; background:transparent;
    font-size:14px; font-weight:600; color:var(--ink-faint);
    border-bottom:2px solid transparent; position:relative; top:1px;
  }
  .settings-tab-btn:hover{color:var(--ink-soft);}
  .settings-tab-btn.active{color:var(--primary-dark); border-bottom-color:var(--primary);}
  .settings-panel{max-width:640px; margin:0 auto;}
  .settings-section-title{font-family:var(--font-display); font-weight:700; font-size:17px; margin-bottom:4px;}
  .settings-section-header-row{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:14px;}
  .settings-header-text{flex:1; min-width:0;}
  .settings-order-control{display:flex; align-items:center; gap:6px; flex-shrink:0; padding-top:2px;}
  .settings-order-label{font-size:12px; color:var(--ink-soft); white-space:nowrap;}
  .settings-order-select{width:auto; max-width:118px; flex-shrink:0; font-size:12px; padding:5px 7px;}
  .reorder-btn{
    border:none; background:none; color:var(--ink-faint); width:20px; height:20px;
    border-radius:5px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .reorder-btn:hover:not(:disabled){background:var(--surface-2); color:var(--ink);}
  .reorder-btn:disabled{opacity:.25; cursor:default;}
  .reorder-btn:disabled:hover{background:none; color:var(--ink-faint);}
  .reorder-btn svg{width:12px; height:12px;}
  .fav-star-btn{
    border:none; background:transparent; color:var(--ink-faint); width:26px; height:26px;
    display:flex; align-items:center; justify-content:center; border-radius:6px; flex-shrink:0;
  }
  .fav-star-btn:hover{background:var(--surface-2); color:var(--accent);}
  .fav-star-btn.active{color:var(--accent);}
  .fav-star-btn svg{width:16px; height:16px;}
  .settings-section-desc{font-size:13px; color:var(--ink-faint); margin-bottom:20px;}

  .nav{display:flex; flex-direction:column; gap:2px; margin-bottom:22px;}
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:9px 10px;
    border-radius:var(--radius-sm);
    border:none; background:transparent;
    color:var(--ink-soft);
    font-size:14px; font-weight:500;
    text-align:left;
    transition:background .15s, color .15s;
  }
  .nav-item svg{width:17px; height:17px; flex-shrink:0;}
  .nav-item:hover{background:var(--surface-2); color:var(--ink);}
  .nav-item.active{background:var(--primary-light); color:var(--primary-dark); font-weight:600;}
  .nav-count{
    margin-left:auto;
    font-family:var(--font-body);
    font-size:11px;
    color:var(--ink-faint);
  }

  .sidebar-section-label{
    font-size:10.5px; font-weight:600; letter-spacing:.06em;
    text-transform:uppercase; color:var(--ink-faint);
    padding:0 10px; margin-bottom:8px;
  }
  .cat-list{display:flex; flex-direction:column; gap:1px; overflow-y:auto; flex:1;}
  .cat-item{
    display:flex; align-items:center; gap:9px;
    padding:7px 10px;
    border-radius:var(--radius-sm);
    font-size:13.5px; color:var(--ink-soft);
    cursor:pointer;
  }
  .cat-item:hover{background:var(--surface-2);}
  .cat-item.active{background:var(--surface-2); color:var(--ink); font-weight:600;}
  .cat-swatch{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .cat-item .cat-name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .sidebar-footer{
    display:flex; flex-direction:column; gap:6px;
    padding-top:14px; border-top:1px solid var(--border);
    margin-top:auto;
  }
  .status-dot{width:6px; height:6px; border-radius:50%; background:var(--ink-faint); flex-shrink:0;}
  .status-dot.saved{background:var(--primary);}
  .status-dot.dirty{background:var(--accent);}

  /* ---------- MAIN ---------- */
  .main{display:flex; flex-direction:column; height:100vh; overflow:hidden;}
  .topbar{
    display:flex; align-items:center; gap:14px;
    padding:18px 28px; border-bottom:1px solid var(--border);
    background:var(--surface);
  }
  .space-selector-wrap{position:relative; margin-right:4px;}
  .space-selector-btn{
    display:flex; align-items:center; gap:8px; border:1px solid var(--border); background:var(--surface);
    color:var(--ink); padding:9px 12px 9px 9px; border-radius:20px; font-size:13px; font-weight:600;
  }
  .space-selector-btn:hover{background:var(--surface-2);}
  .space-selector-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .space-selector-name{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px;}
  .space-selector-chevron{width:13px; height:13px; flex-shrink:0;}
  .space-selector-dropdown{
    position:absolute; top:calc(100% + 8px); left:0; width:220px; z-index:60;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow-md); padding:8px; display:flex; flex-direction:column; gap:1px;
  }
  .space-selector-label{
    font-size:10.5px; font-weight:700; color:var(--ink-faint); letter-spacing:.04em;
    padding:4px 10px 6px;
  }
  .space-selector-item{
    display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:var(--radius-sm);
    font-size:13px; color:var(--ink); cursor:pointer;
  }
  .space-selector-item:hover{background:var(--surface-2);}
  .space-selector-item-name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .space-selector-check{width:14px; height:14px; color:var(--primary); flex-shrink:0;}
  .space-selector-item.action{color:var(--ink-soft); font-weight:500;}
  .space-selector-item.action svg{width:15px; height:15px; flex-shrink:0; color:var(--ink-faint);}
  .space-selector-divider{height:1px; background:var(--border); margin:6px 4px;}
  .view-title-wrap{display:flex; flex-direction:column; justify-content:center;}
  .view-title{font-family:var(--font-display); font-weight:700; font-size:20px;}
  .view-subtitle{font-size:12px; color:var(--ink-faint); text-transform:capitalize; margin-top:1px;}
  .search-wrap{
    flex:1; max-width:360px; position:relative; margin-left:8px;
  }
  .search-wrap input{
    width:100%; padding:8px 35px 8px 32px;
    border:1px solid var(--border); border-radius:8px;
    background:var(--bg); font-size:13.5px; color:var(--ink);
  }
  .search-wrap input:focus{outline:none; border-color:var(--primary);}
  .search-clear-btn{
    position:absolute; right:11px; top:50%; transform:translateY(-50%);
    width:20px; height:20px; border:none; background:transparent; color:var(--ink-faint);
    border-radius:5px; align-items:center; justify-content:center;
  }
  .search-clear-btn:hover{background:var(--surface-2); color:var(--ink);}
  .search-clear-btn svg{position:static; width:12px; height:12px; transform:none;}

  .file-bar{
    display:flex; align-items:center; gap:6px; margin-left:auto; flex-shrink:0;
  }
  .file-bar-name{
    display:flex; align-items:center; gap:6px;
    font-size:12px; color:var(--ink-faint); font-family:var(--font-mono);
    padding:0 6px 0 2px; white-space:nowrap;
  }
  .file-bar-btn{
    border:1px solid var(--border); background:var(--surface); color:var(--ink);
    font-size:12.5px; font-weight:600; padding:8px 13px; border-radius:8px;
    white-space:nowrap;
  }
  .file-bar-btn:hover{background:var(--surface-2);}
  .file-bar-btn.primary{background:var(--ink); color:#fff; border-color:var(--ink);}
  .file-bar-btn.primary:hover{background:#000;}
  .file-bar-btn.danger{background:transparent; color:var(--danger); border-color:var(--danger-light);}
  .file-bar-btn.danger:hover{background:var(--danger-light);}
  .icon-add-btn{
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    width:36px; height:36px; border-radius:50%; border:none;
    background:var(--primary); color:#fff; box-shadow:var(--shadow-sm);
  }
  .icon-add-btn:hover{background:var(--primary-dark);}
  .icon-add-btn svg{width:18px; height:18px;}
  .icon-add-btn.fab{
    position:fixed; right:32px; bottom:28px; width:52px; height:52px;
    box-shadow:0 6px 18px rgba(27,33,48,.25); z-index:45;
    transition:right .15s;
  }
  .icon-add-btn.fab.shifted{ right:calc(var(--edit-panel-width, 500px) + 32px); }
  .icon-add-btn.fab svg{width:22px; height:22px;}
  .icon-add-btn.fab:active{transform:scale(.94);}
  .search-wrap svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--ink-faint);}
  .btn{
    display:inline-flex; align-items:center; gap:6px;
    padding:9px 16px; border-radius:8px; border:none;
    font-size:13.5px; font-weight:600;
    background:var(--primary); color:#fff;
    box-shadow:var(--shadow-sm);
  }
  .btn:hover{background:var(--primary-dark);}
  .btn.ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--border); box-shadow:none;}
  .btn.ghost:hover{background:var(--surface-2); color:var(--ink);}
  .btn.small{padding:6px 11px; font-size:12.5px;}
  .btn svg{width:14px; height:14px;}

  .view{flex:1; overflow-y:auto; padding:24px 28px 60px;}

  /* ---------- TASKS (Planner style) ---------- */
  .tasks-layout{ display:flex; gap:20px; align-items:flex-start; }
  .group-mode-bar{
    display:flex; align-items:center; gap:10px; margin-bottom:16px;
  }
  .group-mode-label{font-size:12px; color:var(--ink-faint); font-weight:500;}
  .group-mode-select-wrap{position:relative;}
  .tp-status-trigger.group-mode-trigger{
    width:auto; height:30px; min-width:0; padding:0 10px 0 8px; font-size:12px; gap:6px;
  }
  .group-mode-trigger .tp-status-icon{width:13px; height:13px;}
  .group-mode-select-wrap .tp-status-dropdown{min-width:170px; width:max-content;}
  .group-mode-tabs{display:flex; gap:2px; background:var(--surface-2); padding:3px; border-radius:8px;}
  .group-mode-tabs button{
    border:none; background:transparent; padding:6px 12px; border-radius:6px;

  .recurrence-toggle-row{

    cursor:pointer; user-select:none; font-weight:600;

  .recurrence-toggle-row input:checked + .completed-toggle-track{background:var(--primary);}

  .theme-toggle-desc{font-size:12px; color:var(--ink-faint); line-height:1.4;}

  .tasks-list-col{ flex:1; min-width:0; }

  .bucket{margin-bottom:22px;}
  .bucket-header{

  .bucket-body{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); overflow:hidden;
  }
  .task-row{
    display:flex; align-items:center; gap:10px;
    padding:10px 14px 10px 10px;
    border-bottom:1px solid var(--border);
    border-left:4px solid transparent;
    font-size:13px; cursor:pointer; position:relative;
  }

  .task-row.pri-media{border-left-color:var(--priority-media);}
  .task-row.pri-alta{border-left-color:var(--priority-alta);}
  .task-row.pri-critica{border-left-color:var(--priority-critica);}

  .task-row.selected{background:var(--primary-light);}
  .task-check{
    width:18px; height:18px; border-radius:5px;
    border:1.5px solid var(--ink-faint);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; background:var(--surface);
  }
  .task-check.done{background:var(--primary); border-color:var(--primary);}

  .task-check.done svg{display:block;}
  .task-check-circle{border-radius:50%;}

  .task-row.overdue .task-title{color:var(--priority-critica);}

    font-style:italic; font-size:11px; color:var(--ink-faint); flex-shrink:0; white-space:nowrap;
  }

    font-family:inherit; font-size:11.5px; color:var(--ink-soft);

  }
  .task-cal-badge svg{width:12px; height:12px; flex-shrink:0;}
  .task-cal-badge.overdue{color:var(--priority-critica);}

    font-family:inherit; font-size:11.5px; color:var(--ink-faint); flex-shrink:0;

  }
  .task-row-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}

  .task-menu-wrap{position:relative; flex-shrink:0;}

  .task-menu-item svg{width:14px; height:14px; color:var(--ink-faint); flex-shrink:0;}
  .task-menu-item.danger{color:var(--danger);}

  .dash-list-title{flex:1; min-width:0; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .dash-list-date{font-size:10.5px; color:var(--ink-faint); font-family:var(--font-mono); flex-shrink:0;}
  .dash-list-date.overdue{color:var(--danger); font-weight:700;}
  .dash-note-tag{font-size:11px; font-weight:600; flex-shrink:0;}
  .dash-strip-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .dash-strip-header .dash-section-title{margin-bottom:0;}
  .dash-see-all-link{font-size:12.5px; font-weight:600; color:var(--primary); text-decoration:none;}
  .dash-see-all-link:hover{text-decoration:underline;}
  .dash-notes-strip{display:grid; grid-template-columns:repeat(5, 1fr); gap:10px;}
  .dash-note-card{
    border:1px solid; border-radius:10px; padding:10px 12px; cursor:pointer; min-width:0;
    transition:transform .1s;
  }
  .dash-note-card:hover{transform:translateY(-2px);}
  .dash-note-card-title{font-weight:700; font-size:13.5px; margin-bottom:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .dash-note-card-snippet{
    font-size:12px; color:var(--ink-soft); line-height:1.4; margin-bottom:8px;
    display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden;
  }
  .dash-note-card-date{font-size:11px; color:var(--ink-faint); font-family:var(--font-mono);}
  .dash-empty{font-size:12.5px; color:var(--ink-faint);}

  .dash-priority-bars{display:flex; flex-direction:column; gap:12px;}
  .dash-priority-row-top{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; margin-bottom:5px;}
  .dash-priority-row-top .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .dash-priority-frac{margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); font-weight:400;}
  .dash-priority-track{height:7px; border-radius:20px; background:var(--surface-2); overflow:hidden;}
  .dash-priority-fill{height:100%; border-radius:20px;}

  .dash-prod-stat-row{display:flex; gap:10px;}
  .dash-prod-stat-box{flex:1; background:var(--surface-2); border-radius:8px; padding:12px; text-align:center;}
  .dash-prod-stat-label{font-size:11.5px; color:var(--ink-soft);}
  .dash-prod-stat-value{font-family:var(--font-display); font-size:22px; font-weight:700; margin-top:2px;}
  .dash-prod-extra{display:flex; flex-direction:column; gap:4px; margin-top:12px; font-size:11.5px; color:var(--ink-soft);}

  .dash-donut-row{display:flex; align-items:center; gap:28px; padding:6px 0;}
  .dash-activity-list{display:flex; flex-direction:column; gap:2px;}
  .dash-activity-row{display:flex; align-items:flex-start; gap:10px; padding:8px 4px; border-radius:8px;}
  .dash-activity-icon{
    width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .dash-activity-icon svg{width:15px; height:15px;}
  .dash-activity-icon.priority-media{background:var(--priority-media-light); color:var(--priority-media);}
  .dash-activity-icon.purple{background:var(--accent-light); color:var(--accent);}
  .dash-activity-icon.info{background:var(--priority-baixa-light); color:var(--priority-baixa);}
  .dash-activity-body{flex:1; min-width:0;}
  .dash-activity-msg{font-size:11.5px; font-weight:600; color:var(--ink); line-height:1.4;}
  .dash-activity-meta{font-size:11px; color:var(--ink-faint); margin-top:2px;}
  .dash-activity-time{font-size:11px; color:var(--ink-faint); flex-shrink:0; white-space:nowrap; padding-top:2px;}

  .dash-upcoming-list{display:flex; flex-direction:column; gap:4px;}
  .dash-upcoming-row{display:flex; align-items:center; gap:10px; padding:8px 4px; border-radius:8px; cursor:pointer;}
  .dash-upcoming-row:hover{background:var(--surface-2);}
  .dash-upcoming-time{
    display:flex; flex-direction:column; font-family:var(--font-mono); font-size:11px; color:var(--ink-soft);
    flex-shrink:0; width:44px; text-align:right;
  }
  .dash-upcoming-time-end{color:var(--ink-faint);}
  .dash-upcoming-row .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .dash-upcoming-body{flex:1; min-width:0;}
  .dash-upcoming-title{font-size:12px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .dash-upcoming-sub{font-size:11.5px; color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .dash-notelist{display:flex; flex-direction:column;}
  .dash-notelist-row{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--border); cursor:pointer;}
  .dash-notelist-row:last-child{border-bottom:none;}
  .dash-notelist-row:hover{background:var(--surface-2);}
  .dash-notelist-icon{width:28px; height:28px; border-radius:7px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .dash-notelist-icon svg{width:14px; height:14px;}
  .dash-notelist-title{flex:1; min-width:0; font-size:12.5px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .dash-notelist-cat{font-size:10px; font-weight:700; padding:2px 7px; border-radius:20px; flex-shrink:0;}
  .dash-notelist-time{font-size:11px; color:var(--ink-faint); flex-shrink:0; white-space:nowrap;}

  .dash-tasklist{display:flex; flex-direction:column;}
  .dash-tasklist-row{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--border); cursor:pointer;}
  .dash-tasklist-row:last-child{border-bottom:none;}
  .dash-tasklist-row:hover{background:var(--surface-2);}
  .dash-tasklist-check{width:16px; height:16px; border-radius:50%; border:1.5px solid var(--border); flex-shrink:0;}
  .dash-tasklist-title{flex:1; min-width:0; font-size:12.5px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .dash-tasklist-priority{font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:20px; flex-shrink:0;}
  .dash-tasklist-date{font-size:11.5px; color:var(--ink-faint); flex-shrink:0; width:64px;}
  .dash-tasklist-flag{width:14px; height:14px; color:var(--ink-faint); flex-shrink:0;}
  .dash-tasklist-flag.filled{color:var(--danger);}
  .dash-tasklist-flag svg{width:100%; height:100%;}
  .dash-donut-wrap{position:relative; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
  .dash-donut-center{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; pointer-events:none;}
  .dash-donut-center-num{font-family:var(--font-display); font-size:24px; font-weight:600; line-height:1;}
  .dash-donut-center-label{font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em; margin-top:2px;}
  .dash-donut-legend{display:flex; flex-direction:column; gap:12px; font-size:13px; flex:1;}
  .dash-legend-row{display:flex; align-items:center; gap:8px;}
  .dash-legend-row .dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .dash-legend-name{color:var(--ink-soft); font-weight:600;}
  .dash-legend-count{margin-left:auto; font-family:var(--font-display); font-weight:700; font-size:13px;}
  .dash-legend-pct{width:40px; text-align:right; font-size:11.5px; color:var(--ink-faint); font-family:var(--font-mono);}
  .dash-prod-stats{display:flex; flex-direction:column; gap:4px; margin-top:10px; font-size:12.5px; color:var(--ink-soft);}
  .dash-avg-priority{font-size:11.5px;}

  .dash-kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  .dash-kpi-card{background:var(--surface-2); border-radius:8px; padding:12px;}
  .dash-kpi-value{font-family:var(--font-display); font-size:17px; font-weight:700;}
  .dash-kpi-trend{font-size:12px; font-weight:600;}
  .dash-kpi-trend.up{color:var(--priority-media);}
  .dash-kpi-trend.down{color:var(--danger);}
  .dash-kpi-label{font-size:11.5px; color:var(--ink-soft); margin-top:3px;}
  .dash-catload-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .dash-catload-pill{
    display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600;
    padding:4px 10px; border-radius:20px;
  }
  .dash-catload-pill .dot{width:6px; height:6px; border-radius:50%;}

  .dash-hygiene-row{display:flex; flex-wrap:wrap; gap:8px;}
  .dash-hygiene-pill{
    font-size:12px; font-weight:600; color:var(--ink-soft); background:var(--surface-2);
    padding:5px 12px; border-radius:20px;
  }
  @media (max-width: 1000px){
    .dash-grid-3{grid-template-columns:1fr;}
  }
  @media (max-width: 900px){
    .dash-alert-cards, .dash-kpi-grid{grid-template-columns:repeat(2,1fr);}
    .dash-alert-cards.dash-kpi-5{grid-template-columns:repeat(2,1fr);}
    .dash-grid-2{grid-template-columns:1fr;}
    .dash-grid-priority-prod{grid-template-columns:1fr;}
    .dash-notes-strip{grid-template-columns:repeat(2,1fr);}
  }

    /* ===== Calendário ===== */
  .cal-header{
    display:flex; align-items:center; gap:16px; margin-bottom:20px; flex-wrap:wrap;
  }
  .cal-view-toggle{display:flex; gap:2px; background:var(--surface-2); padding:3px; border-radius:8px;}
  .cal-view-toggle button{
    border:none; background:transparent; padding:6px 14px; border-radius:6px; font-size:13px; color:var(--ink-soft);
  }
  .cal-view-toggle button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm); font-weight:600;}
  .cal-nav{display:flex; align-items:center; gap:4px;}
  .cal-nav button{
    border:1px solid var(--border); background:var(--surface); border-radius:7px;
    width:30px; height:30px; display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
  }
  .cal-nav button svg{width:14px; height:14px;}
  .cal-nav #calTodayBtn{width:auto; padding:0 12px; font-size:12.5px;}
  .cal-period-label{font-family:var(--font-display); font-weight:700; font-size:16px; margin-left:4px;}

  .cal-month-grid{
    display:grid; grid-template-columns:repeat(7,1fr); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;
  }
  .cal-month-weekday{
    padding:8px; text-align:center; font-size:11.5px; font-weight:600; color:var(--ink-faint);
    background:var(--surface-2); border-bottom:1px solid var(--border);
  }
  .cal-month-cell{
    min-height:100px; min-width:0; border-right:1px solid var(--border); border-bottom:1px solid var(--border);
    padding:6px; background:var(--surface); cursor:pointer; display:flex; flex-direction:column; gap:4px;
  }
  .cal-month-cell:nth-child(7n){border-right:none;}
  .cal-month-cell.other-month{background:var(--bg); color:var(--ink-faint);}
  .cal-month-cell.other-month .cal-month-daynum{color:var(--ink-faint);}
  .cal-month-cell.weekend{background:var(--surface-2);}
  .cal-month-cell.weekend.other-month{background:var(--bg);}
  .cal-month-cell.today .cal-month-daynum{
    background:var(--primary); color:#fff; border-radius:50%; width:20px; height:20px;
    display:flex; align-items:center; justify-content:center;
  }
  .cal-month-weekday.weekend{color:var(--danger);}
  .cal-month-daynum{font-size:12.5px; font-weight:600;}
  .cal-month-events{display:flex; flex-direction:column; gap:3px; min-width:0;}
  .cal-event-pill{
    font-size:10.5px; font-weight:600; padding:2px 6px; border-radius:5px;
    white-space:normal; word-break:break-word; overflow-wrap:break-word;
    display:flex; align-items:flex-start; gap:4px; line-height:1.3;
  }
  .cal-event-pill .dot{width:5px; height:5px; border-radius:50%; flex-shrink:0; margin-top:4px;}
  .cal-event-more{font-size:10px; color:var(--ink-faint); padding-left:4px;}

  .cal-week-wrap{border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; background:var(--surface); display:flex; flex-direction:column;}
  .cal-week-headrow, .cal-week-alldayrow{display:grid; grid-template-columns:52px repeat(7,1fr); border-bottom:1px solid var(--border);}
  .cal-week-gutter-cell{border-right:1px solid var(--border);}
  .cal-week-colhead{
    padding:8px; text-align:center; font-size:12px; font-weight:600; color:var(--ink-soft);
    background:var(--surface-2); border-right:1px solid var(--border);
  }
  .cal-week-colhead.today{background:var(--primary-light); color:var(--primary-dark);}
  .cal-week-colhead.weekend{background:var(--danger-light); color:var(--danger);}
  .cal-week-colhead.weekend.today{background:var(--primary-light); color:var(--primary-dark);}
  .cal-week-colhead span{display:block; font-size:15px; font-family:var(--font-display); color:var(--ink);}
  .cal-week-allday-cell{
    padding:4px; border-right:1px solid var(--border); display:flex; flex-direction:column; gap:3px; min-height:26px;
  }
  .cal-week-allday-cell.weekend{background:var(--surface-2);}
  .cal-week-scroll{
    flex:1; overflow-y:auto; height:calc(100vh - 340px); min-height:360px;
  }
  .cal-week-hourgrid{display:grid; grid-template-columns:52px repeat(7,1fr); position:relative;}
  .cal-week-gutter{border-right:1px solid var(--border);}
  .cal-week-hour-label{
    font-size:10.5px; color:var(--ink-faint); text-align:right; padding-right:6px;
    box-sizing:border-box; border-bottom:1px solid var(--border); transform:translateY(-6px);
  }
  .cal-density-row{display:flex; justify-content:flex-end; padding:8px 8px 0;}
  .cal-density-row .cal-view-toggle button{padding:5px 12px; font-size:12px;}
  .cal-week-daycol{position:relative; border-right:1px solid var(--border); cursor:pointer;}
  .cal-week-daycol.today{background:var(--primary-light-faint, rgba(47,111,94,.03));}
  .cal-week-daycol.weekend{background:var(--surface-2);}
  .cal-week-daycol.weekend.today{background:var(--primary-light-faint, rgba(47,111,94,.03));}
  .cal-week-hour-line{position:absolute; left:0; right:0; border-top:1px solid var(--border);}
  .cal-event-block-timed{
    position:absolute; left:3px; right:3px; border-left:3px solid; border-radius:6px; padding:3px 6px;
    overflow:hidden; display:flex; flex-direction:column; gap:1px; box-sizing:border-box; z-index:2;
  }
  .cal-event-time{font-size:10.5px; font-weight:700; color:var(--ink-soft);}
  .cal-event-title{font-size:12.5px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cal-event-tag{
    font-size:10px; font-weight:600; opacity:.75; white-space:nowrap;
  }
  .cal-empty-day{font-size:11.5px; color:var(--ink-faint); text-align:center; padding-top:20px;}

  .cal-day-list{display:flex; flex-direction:column; gap:8px; margin-bottom:14px;}
  .cal-day-row{
    display:flex; align-items:center; gap:14px; padding:12px 14px; background:var(--surface);
    border:1px solid var(--border); border-left-width:4px; border-radius:var(--radius); cursor:pointer;
  }
  .cal-day-time{font-family:var(--font-mono); font-size:12.5px; color:var(--ink-soft); flex-shrink:0; width:110px;}
  .cal-day-title{font-weight:600; flex:1;}
  .cal-day-cat{font-size:12px; font-weight:600; flex-shrink:0;}
  .cal-day-add-btn{
    width:100%; padding:10px; border:1.5px dashed var(--border); border-radius:var(--radius);
    background:transparent; color:var(--ink-soft); font-size:13px; font-weight:600;
  }
  .cal-day-add-btn:hover{background:var(--surface-2); color:var(--ink);}

  .tp-agenda-notes-row{display:flex; gap:16px;}
  .tp-agenda-notes-col{flex:1; min-width:0;}
  .tp-task-agenda-row{
    display:flex; align-items:flex-start; gap:10px; padding:8px 10px; border-radius:8px;
    background:var(--surface-2); font-size:12.5px; margin-bottom:6px;
  }
  .tp-task-agenda-row .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:5px;}
  .tp-task-agenda-body{flex:1; min-width:0;}
  .tp-task-agenda-date{color:var(--ink-soft); font-size:10px; margin-bottom:2px;}
  .tp-task-agenda-title{font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--ink-faint);
  }
  .empty-state svg{width:40px; height:40px; margin-bottom:12px; opacity:.5;}
  .empty-state p{font-size:14px; max-width:280px; margin:0 auto;}

  .section-label{
    font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-faint); margin:26px 0 10px; max-width:1100px; margin-left:auto; margin-right:auto;
  }

  /* ---------- MODAL (espaços) ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(27,33,48,.35);
    display:none; align-items:center; justify-content:center; z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--surface); border-radius:14px; width:420px; max-width:90vw;
    box-shadow:var(--shadow-md); padding:22px;
  }
  .modal h3{font-family:var(--font-display); font-size:17px; margin-bottom:16px;}
  .about-close-btn{
    position:absolute; top:14px; right:14px; width:26px; height:26px;
    display:flex; align-items:center; justify-content:center; border-radius:50%;
    color:var(--ink-faint); background:transparent;
  }
  .about-close-btn:hover{background:var(--surface-2); color:var(--ink);}
  .cat-row{
    display:flex; align-items:center; gap:10px; margin-bottom:8px;
  }
  .cat-row input[type=text]{
    flex:1; border:1px solid var(--border); border-radius:6px; padding:7px 9px; font-size:13.5px;
  }
  .cat-row input[type=color]{
    width:32px; height:32px; border:none; border-radius:8px; padding:0; background:none;
  }
  .cat-row button{
    width:28px; height:28px; border:none; background:transparent; color:var(--ink-faint); border-radius:6px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .cat-row button:hover{background:var(--danger-light); color:var(--danger);}
  .cat-row button svg{width:14px; height:14px;}
  .modal-footer{display:flex; justify-content:space-between; margin-top:16px;}

  .profile-form label{
    display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin:14px 0 5px;
  }
  .profile-form label:first-of-type{margin-top:4px;}
  .profile-form input[type=text], .profile-form input[type=email]{
    width:100%; border:1px solid var(--border); border-radius:8px; padding:9px 11px; font-size:14px;
  }
  .profile-form input:focus{outline:none; border-color:var(--primary);}

  .avatar-picker{display:flex; align-items:center; gap:16px; margin-top:4px;}
  .avatar-preview{
    width:64px; height:64px; border-radius:50%; object-fit:cover; flex-shrink:0;
    background:var(--primary-light); color:var(--primary-dark);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:22px; overflow:hidden;
  }
  .avatar-preview img{width:100%; height:100%; object-fit:cover;}

  .crop-stage{
    width:220px; height:220px; border-radius:50%; overflow:hidden;
    position:relative; margin:14px auto 12px; background:var(--surface-2);
    border:1px dashed var(--border); cursor:grab;
  }
  .crop-stage:active{cursor:grabbing;}
  .crop-stage img{position:absolute; top:0; left:0; user-select:none; pointer-events:none;}
  .crop-controls{display:flex; align-items:center; gap:10px; max-width:220px; margin:0 auto;}
  .crop-controls svg{width:15px; height:15px; color:var(--ink-faint); flex-shrink:0;}
  .crop-controls input[type=range]{flex:1; accent-color:var(--primary);}
  .crop-hint{text-align:center; font-size:11px; color:var(--ink-faint); margin-top:6px;}

  .link-desc{font-size:13.5px; color:var(--ink-soft); line-height:1.5; margin-bottom:16px;}
  .link-option{
    display:flex; align-items:center; gap:12px; width:100%;
    padding:13px 14px; border-radius:var(--radius); border:1px solid var(--border);
    background:var(--surface); text-align:left; margin-bottom:10px;
  }
  .link-option:hover{background:var(--surface-2); border-color:var(--primary);}
  .link-option .icon{font-size:20px; flex-shrink:0;}
  .link-option .txt strong{display:block; font-size:14px; color:var(--ink);}
  .link-option .txt span{display:block; font-size:12px; color:var(--ink-faint); margin-top:1px;}
  .link-option.primary{border-color:var(--primary); background:var(--primary-light);}
  .link-skip{
    display:block; width:100%; text-align:center; margin-top:6px;
    background:none; border:none; font-size:12.5px; color:var(--ink-faint); text-decoration:underline;
    padding:6px;
  }
  .link-skip:hover{color:var(--ink-soft);}

  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}

<script>
/* ===================== ESTADO ===================== */
const LS_KEY = 'tyvraTasksState';
const DEFAULT_COLORS = ['#E2A83D','#2F6F5E','#4A6FA5','#9B5DE5','#C0453A','#3D8B8B','#B5838D'];

let state = {
  profile: { name: '', email: '', avatar: null },
  categories: [{ id: 'cat_geral', name: 'Geral', color: '#2F6F5E' }],
  tags: [],
  tasks: [],
  notes: [],
  events: [],
  uiGroupCollapse: {},
  showCompletedTasks: false,
  taskIdCounter: 0,
  theme: 'light'
};

let currentView = 'dashboard';
let calendarView = 'month'; // 'month' | 'week' | 'day'
let calendarFocusDate = todayStr();
let activeEventId = null;
let creatingNewEvent = false;
let activeCategoryFilter = null;
let activeTagFilters = [];
let activeCriticalityFilters = [];
let criticalityFilterPopoverOpen = false;
let activeNoteId = null;
let creatingNewNote = false;
let pendingNotePrefillTaskId = null;
let pendingNoteNotebookId = null;
const expandedNotebookIds = new Set();
let notebookSearchTerm = '';
let draggedNoteId = null;
let searchTerm = '';
let fileHandle = null;
let dirty = false;
let activeTaskId = null;
let creatingNewTask = false;
let tagsPopoverOpen = false;
let tagFilterPopoverOpen = false;

function applyTheme(){
  const isDark = state.theme === 'dark';
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  const sunIcon = document.getElementById('themeIconSun');
  const moonIcon = document.getElementById('themeIconMoon');
  const label = document.getElementById('themeToggleLabel');
  if(sunIcon) sunIcon.style.display = isDark ? 'block' : 'none';
  if(moonIcon) moonIcon.style.display = isDark ? 'none' : 'block';
  if(label) label.textContent = isDark ? 'Modo claro' : 'Modo escuro';
  document.querySelectorAll('.theme-toggle-switch input').forEach(inp => { inp.checked = isDark; });
}
function toggleTheme(){
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  applyTheme();
  persistOnly();
}
function openAboutModal(){
  const body = document.getElementById('aboutModalBody');
  body.style.position = 'relative';
  body.innerHTML = `
    <button type="button" id="aboutCloseBtn" class="about-close-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px; height:16px;"><path d="M18 6L6 18M6 6l12 12"/></svg>

        <rect x="10" y="12" width="14" height="76" rx="7" fill="#3FA087"/>
        <rect x="10" y="12" width="70" height="14" rx="7" fill="#3FA087"/>
        <rect x="29" y="37" width="53" height="10" rx="5" fill="#3FA087"/>
        <rect x="29" y="56" width="34" height="10" rx="5" fill="#3FA087"/>
        <path d="M42 76l10 10 28 -28" stroke="#3FA087" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <span class="brand-wordmark" style="font-size:28px;">Taskin</span>

document.getElementById('aboutBtn').onclick = openAboutModal;
let aboutOverlayMouseDownOnBackdrop = false;
document.getElementById('aboutOverlay').addEventListener('mousedown', e => {
  aboutOverlayMouseDownOnBackdrop = (e.target.id === 'aboutOverlay');
});
document.getElementById('aboutOverlay').addEventListener('click', e => {

});

document.getElementById('toggleThemeBtn').onclick = toggleTheme;
document.getElementById('toggleSidebarBtn').onclick = toggleSidebarCollapsed;

function normalizeState(){
  if(!state.profile) state.profile = { name:'', email:'', avatar:null };
  if(!state.tags) state.tags = [];
  if(!state.tasks) state.tasks = [];
  if(!state.notes) state.notes = [];
  if(!state.events) state.events = [];
  state.events.forEach(ev => {
    if(ev.tagIds === undefined) ev.tagIds = [];
    if(ev.allDay === undefined) ev.allDay = !ev.startTime;
    if(ev.recurrence === undefined) ev.recurrence = 'none';
    if(ev.recurrenceInterval === undefined) ev.recurrenceInterval = 1;
    if(ev.recurrenceBaseDate === undefined) ev.recurrenceBaseDate = ev.date || null;
    if(ev.linkedTaskId === undefined) ev.linkedTaskId = null;
    if(ev.endDate === undefined) ev.endDate = ev.date || null;
    if(ev.updatedAt === undefined) ev.updatedAt = ev.createdAt || null;
    if(ev.description === undefined) ev.description = '';
  });
  if(!state.uiGroupCollapse) state.uiGroupCollapse = {};
  if(state.defaultCategoryFilter === undefined) state.defaultCategoryFilter = null;
  if(!state.categoryOrder) state.categoryOrder = 'creation';
  if(!state.categoryGroupModes) state.categoryGroupModes = {};
  if(!state.categoryCalendarViews) state.categoryCalendarViews = {};
  if(!state.theme) state.theme = 'light';
  if(!state.calendarHourDensity) state.calendarHourDensity = 'normal';
  if(!state.calendarViewDefault) state.calendarViewDefault = 'month';
  if(state.weekStartDay === undefined) state.weekStartDay = 0;
  if(state.sidebarCollapsed === undefined) state.sidebarCollapsed = false;
  if(!Array.isArray(state.notebooks)) state.notebooks = [];
  if(!state.lastActiveNoteBySpace || typeof state.lastActiveNoteBySpace !== 'object') state.lastActiveNoteBySpace = {};
  state.categories.forEach(cat => {
    const hasNotebook = state.notebooks.some(nb => nb.categoryId === cat.id);
    const hasNotes = state.notes.some(n => n.categoryId === cat.id);
    if(!hasNotebook && hasNotes){
      const nb = { id: uid('nb'), name: 'Notas', categoryId: cat.id, createdAt: Date.now() };
      state.notebooks.push(nb);
      state.notes.forEach(n => { if(n.categoryId === cat.id && !n.notebookId) n.notebookId = nb.id; });
    }
  });
  state.notes.forEach(n => {
    if(n.notebookId === undefined) n.notebookId = null;
    if(n.notebookId){
      const nb = state.notebooks.find(x => x.id === n.notebookId);
      if(!nb || nb.categoryId !== n.categoryId) n.notebookId = null;
    }
    if(!n.notebookId){
      let nb = state.notebooks.find(x => x.categoryId === n.categoryId);
      if(!nb){
        nb = { id: uid('nb'), name: 'Notas', categoryId: n.categoryId, createdAt: Date.now() };
        state.notebooks.push(nb);
      }
      n.notebookId = nb.id;
    }
  });
  if(!state.tagOrder) state.tagOrder = 'creation';
  if(state.showCompletedTasks === undefined) state.showCompletedTasks = false;
  if(!state.notebooksColWidth) state.notebooksColWidth = 260;
  state.tags.forEach(tg => { if(tg.categoryId === undefined) tg.categoryId = null; });
  state.notes.forEach(n => {
    if(n.attachments === undefined) n.attachments = [];
    if(n.tagIds === undefined) n.tagIds = [];
    if(n.linkedTaskId === undefined) n.linkedTaskId = null;
    if(n.pinnedAt === undefined) n.pinnedAt = n.pinned ? (n.updatedAt || Date.now()) : null;
  });
  state.tasks.forEach(t => {
    if(t.description === undefined) t.description = '';
    if(t.dueTime === undefined) t.dueTime = null;
    if(t.tagIds === undefined) t.tagIds = [];
    if(t.recurrence === undefined) t.recurrence = 'none';
    if(t.subtasks === undefined) t.subtasks = [];
    if(t.comments === undefined) t.comments = [];
    if(t.status === undefined) t.status = t.done ? 'concluida' : 'nao_iniciado';
    if(t.pinnedAt === undefined) t.pinnedAt = t.pinned ? Date.now() : null;
    if(t.completedAt === undefined) t.completedAt = t.done ? (t.updatedAt || t.createdAt || null) : null;
    if(t.recurrenceInterval === undefined) t.recurrenceInterval = 1;
    if(t.recurrenceTime === undefined) t.recurrenceTime = (t.recurrence && t.recurrence !== 'none') ? (t.dueTime || null) : null;
    if(t.recurrenceBaseDate === undefined) t.recurrenceBaseDate = (t.recurrence && t.recurrence !== 'none') ? (t.dueDate || null) : null;
  });
  if(state.taskIdCounter === undefined) state.taskIdCounter = 0;
  state.tasks.forEach(t => { if(t.shortId && /^t\d+$/.test(t.shortId)) t.shortId = t.shortId.slice(1); });
  const tasksNeedingId = state.tasks.filter(t => !t.shortId).sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
  tasksNeedingId.forEach(t => {
    state.taskIdCounter++;
    t.shortId = String(state.taskIdCounter).padStart(4, '0');
  });
}

/* ===================== PERSISTÊNCIA ===================== */
function loadFromLocalStorage(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.categories){
        state = parsed;
      }
    }
  }catch(e){ console.error('Erro ao carregar localStorage', e); }
  normalizeState();
}

function saveToLocalStorage(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){ console.error('Erro ao salvar localStorage', e); }
}

let autoSaveTimer = null;
const AUTOSAVE_DEBOUNCE_MS = 250;

async function flushAutoSave(){
  if(!fileHandle || !dirty) return;
  clearTimeout(autoSaveTimer);
  try{ await writeStateToFile(); dirty = false; updateFileStatus(); }
  catch(e){ console.error('Auto-save falhou', e); }
}

function markDirty(){
  dirty = true;
  saveToLocalStorage();
  updateFileStatus();
  render();
  if(fileHandle){
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(async () => {
      try{ await writeStateToFile(); dirty = false; updateFileStatus(); }
      catch(e){ console.error('Auto-save falhou', e); }
    }, AUTOSAVE_DEBOUNCE_MS);
  }
}

/* Salva sem re-renderizar a tela inteira — usado em blur de campos de texto para não
   destruir o elemento que o usuário acabou de clicar (ex: seletor de fonte/cor) no meio da interação. */
function persistOnly(){
  dirty = true;
  saveToLocalStorage();
  updateFileStatus();
  if(fileHandle){
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(async () => {
      try{ await writeStateToFile(); dirty = false; updateFileStatus(); }
      catch(e){ console.error('Auto-save falhou', e); }
    }, AUTOSAVE_DEBOUNCE_MS);
  }
}

// Garante que alterações pendentes sejam gravadas antes de a aba ser minimizada,
// trocada ou fechada — evita perder a última edição feita bem antes do debounce disparar.
function commitOpenEditors(){
  if(currentNoteComposerCommit){
    try{ currentNoteComposerCommit(); }catch(e){ console.error(e); }
  }
  if(document.activeElement && typeof document.activeElement.blur === 'function'){
    try{ document.activeElement.blur(); }catch(e){}
  }
}
document.addEventListener('visibilitychange', () => { if(document.hidden){ commitOpenEditors(); flushAutoSave(); } });
window.addEventListener('beforeunload', () => { commitOpenEditors(); flushAutoSave(); });
window.addEventListener('pagehide', () => { commitOpenEditors(); flushAutoSave(); });

function updateFileStatus(){
  const dotSettings = document.getElementById('statusDotSettings');
  const textSettings = document.getElementById('statusTextSettings');
  if(fileHandle){
    const name = fileHandle.name || 'taskin.json';
    const cls = 'status-dot ' + (dirty ? 'dirty' : 'saved');
    const title = dirty ? 'Alterações não salvas' : 'Sincronizado';
    if(dotSettings){ dotSettings.className = cls; dotSettings.title = title; }
    if(textSettings) textSettings.textContent = name;
  } else {
    if(dotSettings){ dotSettings.className = 'status-dot'; dotSettings.title = ''; }
    if(textSettings) textSettings.textContent = 'Sem arquivo conectado';
  }
}

async function saveFileAs(){
  if(!window.showSaveFilePicker){ downloadFallback(); return; }
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: 'taskin.json',
      types: [{ description: 'Taskin JSON', accept: {'application/json': ['.json']} }]
    });
    fileHandle = handle;
    await writeStateToFile();
    await idbSetHandle('main', handle);
    localStorage.removeItem('tyvraSkipFileLink');
    dirty = false;
    updateFileStatus();
  }catch(e){ if(e.name !== 'AbortError') console.error(e); }
}

async function openFile(){
  if(!window.showOpenFilePicker){
    alert('Seu navegador não suporta a File System Access API. Use Chrome ou Edge para abrir/salvar o taskin.json diretamente. Enquanto isso, os dados continuam salvos no navegador.');
    return;
  }
  try{
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'Taskin JSON', accept: {'application/json': ['.json']} }]
    });
    const file = await handle.getFile();
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(parsed && parsed.categories){
      state = parsed;
      normalizeState();
      applyTheme();
      fileHandle = handle;
      await idbSetHandle('main', handle);
      localStorage.removeItem('tyvraSkipFileLink');
      dirty = false;
      saveToLocalStorage();
      updateFileStatus();
      render();
    } else {
      alert('Arquivo inválido para o Taskin.');
    }
  }catch(e){
    if(e.name !== 'AbortError') console.error(e);
  }
}

async function saveFile(){
  if(!window.showSaveFilePicker){
    downloadFallback();
    return;
  }
  try{
    if(!fileHandle){
      fileHandle = await window.showSaveFilePicker({
        suggestedName: 'taskin.json',
        types: [{ description: 'Taskin JSON', accept: {'application/json': ['.json']} }]
      });
      await idbSetHandle('main', fileHandle);
      localStorage.removeItem('tyvraSkipFileLink');
    }
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(state, null, 2));
    await writable.close();
    dirty = false;
    updateFileStatus();
  }catch(e){
    if(e.name !== 'AbortError') console.error(e);
  }
}

function downloadFallback(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'taskin.json'; a.click();
  URL.revokeObjectURL(url);
}

/* ===================== HELPERS ===================== */
function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function catById(id){ return state.categories.find(c => c.id === id); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmtDate(d){
  if(!d) return '';
  const [y,m,day] = d.split('-');
  return `${day}/${m}/${y.slice(2)}`;
}
function fmtFriendlyDate(d){
  if(!d) return '';
  const todayS = todayStr();
  if(d === todayS) return 'Hoje';
  if(d === addDaysStr(todayS, 1)) return 'Amanhã';
  const [y,m,day] = d.split('-');
  return `${day}/${m}/${y}`;
}
function fmtEditedLabel(ts){
  if(!ts) return '';
  const d = new Date(ts);
  const timeStr = d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  const dStr = dateToStr(d);
  const todayS = todayStr();
  const yestS = addDaysStr(todayS, -1);
  if(dStr === todayS) return `hoje, ${timeStr}`;
  if(dStr === yestS) return `ontem, ${timeStr}`;
  const [y,m,day] = dStr.split('-');
  return `em ${day}/${m}/${y}`;
}
function isOverdue(d, done){
  if(!d || done) return false;
  return new Date(d + 'T23:59:59') < new Date();
}
function pad2(n){ return String(n).padStart(2,'0'); }
function dateToStr(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function todayStr(){ return dateToStr(new Date()); }
const DEFAULT_DUE_TIME = '08:00';

function advanceDateByRecurrence(dateStr, recurrence, interval){
  const n = Math.max(1, parseInt(interval, 10) || 1);
  const base = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
  switch(recurrence){
    case 'daily': base.setDate(base.getDate()+n); break;
    case 'weekly': base.setDate(base.getDate()+7*n); break;
    case 'monthly': base.setMonth(base.getMonth()+n); break;
    case 'yearly': base.setFullYear(base.getFullYear()+n); break;
    default: return dateStr;
  }
  return dateToStr(base);
}

function spawnNextRecurrence(task){
  state.taskIdCounter = (state.taskIdCounter || 0) + 1;
  const next = {
    id: uid('task'),
    shortId: String(state.taskIdCounter).padStart(4, '0'),
    title: task.title,
    categoryId: task.categoryId,
    done: false,
    status: 'nao_iniciado',
    dueDate: advanceDateByRecurrence(task.dueDate, task.recurrence, task.recurrenceInterval),
    dueTime: task.dueTime,
    priority: task.priority,
    description: task.description || '',
    tagIds: (task.tagIds||[]).slice(),
    recurrence: task.recurrence,
    recurrenceInterval: task.recurrenceInterval || 1,
    recurrenceBaseDate: task.recurrenceBaseDate || task.dueDate || null,
    subtasks: (task.subtasks||[]).map(s => ({ id: uid('sub'), title: s.title, done:false })),
    comments: [],
    createdAt: Date.now()
  };
  state.tasks.push(next);
  return next;
}

let taskGroupMode = 'periodo'; // 'periodo' | 'grupos' | 'prioridade'

function periodBoundaries(){
  const now = new Date();
  const todayS = todayStr();
  const tomorrow = new Date(now); tomorrow.setDate(now.getDate()+1);
  const tomorrowS = dateToStr(tomorrow);
  const dow = now.getDay();
  const endOfWeek = new Date(now); endOfWeek.setDate(now.getDate() + ((7 - dow) % 7));
  const endOfWeekS = dateToStr(endOfWeek);
  const endOfNextWeek = new Date(endOfWeek); endOfNextWeek.setDate(endOfWeek.getDate()+7);
  const endOfNextWeekS = dateToStr(endOfNextWeek);
  const endOfMonth = new Date(now.getFullYear(), now.getMonth()+1, 0);
  const endOfMonthS = dateToStr(endOfMonth);
  return { todayS, tomorrowS, endOfWeekS, endOfNextWeekS, endOfMonthS };
}

function periodBucketKeyFor(dueDate){
  if(!dueDate) return 'sem_prazo';
  const { todayS, tomorrowS, endOfWeekS, endOfNextWeekS, endOfMonthS } = periodBoundaries();
  if(dueDate < todayS) return 'vencido';
  if(dueDate === todayS) return 'hoje';
  if(dueDate === tomorrowS) return 'amanha';
  if(dueDate <= endOfWeekS) return 'semana';
  if(dueDate <= endOfNextWeekS) return 'proxima_semana';
  if(dueDate <= endOfMonthS) return 'mes';
  return 'depois';
}

const PERIOD_CONFIG = [
  { key:'vencido', label:'Vencida', color:'var(--danger)' },
  { key:'hoje', label:'Vence hoje', color:'var(--priority-alta)' },
  { key:'amanha', label:'Amanhã', color:'var(--ink-soft)' },
  { key:'semana', label:'Nessa semana', color:'var(--ink-soft)' },
  { key:'proxima_semana', label:'Próxima semana', color:'var(--ink-soft)' },
  { key:'mes', label:'Neste mês', color:'var(--ink-faint)' },
  { key:'depois', label:'Mais tarde', color:'var(--ink-faint)' },
  { key:'sem_prazo', label:'Sem prazo', color:'var(--ink-faint)' }
];

function computeTaskGroups(){
  const term = searchTerm.trim().toLowerCase();
  let pool = state.tasks.filter(t => !activeCategoryFilter || t.categoryId === activeCategoryFilter);
  if(term) pool = pool.filter(t => t.title.toLowerCase().includes(term));
  if(activeTagFilters.length) pool = pool.filter(t => (t.tagIds||[]).some(id => activeTagFilters.includes(id)));
  if(activeCriticalityFilters.length) pool = pool.filter(t => activeCriticalityFilters.includes(t.priority||'media'));
  pool = pool.filter(t => !t.done);

  if(taskGroupMode === 'prioridade'){
    const order = [...PRIORITY_CONFIG].reverse().concat([{key:null,label:'Sem prioridade',color:'var(--ink-faint)'}]);
    return order.map(p => ({
      key: p.key || 'sem_prioridade', label: p.label, color: p.color,
      tasks: pool.filter(t => (t.priority||null) === p.key),
      quickAddDefaults: { priority: p.key }
    }));
  }
  if(taskGroupMode === 'status'){
    return STATUS_CONFIG.map(s => ({
      key: s.key, label: s.label, color: 'var(--ink-faint)',
      tasks: pool.filter(t => (t.status||'nao_iniciado') === s.key),
      quickAddDefaults: { status: s.key }
    }));
  }
  if(taskGroupMode === 'tags'){
    const groups = state.tags.map(tg => ({
      key: tg.id, label: tg.name, color: tg.color,
      tasks: pool.filter(t => (t.tagIds||[]).includes(tg.id)),
      quickAddDefaults: {}
    }));
    groups.push({
      key: 'sem_tag', label: 'Sem tag', color: 'var(--ink-faint)',
      tasks: pool.filter(t => !(t.tagIds||[]).length),
      quickAddDefaults: {}
    });
    return groups;
  }
  if(taskGroupMode === 'periodo'){
    return PERIOD_CONFIG.map(p => ({
      key:p.key, label:p.label, color:p.color,
      tasks: pool.filter(t => periodBucketKeyFor(t.dueDate) === p.key),
      quickAddDefaults: { dueDateKey: p.key }
    }));
  }
  // grupos (espaço)
  const cats = activeCategoryFilter ? state.categories.filter(c=>c.id===activeCategoryFilter) : state.categories;
  return cats.map(cat => ({
    key: cat.id, label: cat.name, color: cat.color,
    tasks: pool.filter(t => t.categoryId === cat.id),
    quickAddDefaults: { categoryId: cat.id }
  }));
}

function computeCompletedGroup(){
  const term = searchTerm.trim().toLowerCase();
  let pool = state.tasks.filter(t => t.done);
  pool = pool.filter(t => !activeCategoryFilter || t.categoryId === activeCategoryFilter);
  if(term) pool = pool.filter(t => t.title.toLowerCase().includes(term));
  if(activeTagFilters.length) pool = pool.filter(t => (t.tagIds||[]).some(id => activeTagFilters.includes(id)));
  if(activeCriticalityFilters.length) pool = pool.filter(t => activeCriticalityFilters.includes(t.priority||'media'));
  pool.sort((a,b) => (b.updatedAt||b.createdAt||0) - (a.updatedAt||a.createdAt||0));
  return { key:'concluidas', label:'Concluídas', color:'var(--ink-faint)', tasks: pool };
}

function quickAddDueDateFor(key){
  if(!key) return todayStr();
  const { todayS, tomorrowS, endOfWeekS } = periodBoundaries();
  if(key === 'hoje') return todayS;
  if(key === 'amanha') return tomorrowS;
  if(key === 'semana') return endOfWeekS;
  if(key === 'vencido' || key === 'sem_prazo') return todayS;
  return todayS;
}

  function buildBucket(group, isCompletedGroup){
    group.tasks.sort((a,b) => (a.done - b.done) || ((a.dueDate||'9999') > (b.dueDate||'9999') ? 1 : -1));
    if(group.tasks.length === 0) return;
    anyTask = anyTask || group.tasks.length > 0;

    const collapsed = !!state.uiGroupCollapse[group.key];
    const bucket = document.createElement('div');
    bucket.className = 'bucket' + (collapsed ? ' collapsed' : '');
    bucket.innerHTML = `
      <div class="bucket-header">
        <span class="bucket-chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></span>
        ${(!isCompletedGroup && (taskGroupMode === 'grupos' || taskGroupMode === 'prioridade')) ? `<span class="cat-swatch" style="background:${group.color}"></span>` : ''}
        <span class="bucket-title">${escapeHtml(group.label)}</span>
        <span class="bucket-count">${group.tasks.length}</span>
      </div>
      <div class="bucket-body">
        <div class="task-list"></div>
      </div>
    `;
    bucket.querySelector('.bucket-header').addEventListener('click', () => {
      state.uiGroupCollapse[group.key] = !state.uiGroupCollapse[group.key];
      markDirty();
    });
    const taskListEl = bucket.querySelector('.task-list');
    group.tasks.forEach(t => taskListEl.appendChild(renderTaskRow(t)));

    listCol.appendChild(bucket);
  }

  groups.forEach(group => buildBucket(group, false));

  if(state.showCompletedTasks){
    buildBucket(computeCompletedGroup(), true);
  }

  if(!anyTask && state.tasks.length === 0){
    listCol.insertAdjacentHTML('beforeend', `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      <p>Nenhuma tarefa ainda. Clique em "+ Nova tarefa" ou use o campo "+ Adicionar tarefa" em qualquer espaço.</p>
    </div>`);
  }

  if(activeTaskId || creatingNewTask){
    listCol.classList.add('with-panel');
    const panel = document.createElement('div');
    panel.className = 'task-panel';
    layout.appendChild(panel);
    renderTaskPanel(panel);
  }
}

function renderTaskRow(t){
  const row = document.createElement('div');
  const priClass = t.priority ? ` pri-${t.priority}` : '';
  const overdue = isOverdue(t.dueDate, t.done);
  row.className = 'task-row' + priClass + (t.done ? ' done' : '') + (t.id === activeTaskId ? ' selected' : '') + (overdue ? ' overdue' : '');
  row.dataset.id = t.id;
  const isToday = t.dueDate === todayStr();
  const tags = (t.tagIds||[]).map(id => state.tags.find(tg=>tg.id===id)).filter(Boolean);
  const commentCount = (t.comments||[]).length;
  const subtasks = t.subtasks || [];
  const subDone = subtasks.filter(s=>s.done).length;

  let statusPill = '';
  if(overdue) statusPill = `<span class="task-status-pill overdue">Vencida</span>`;
  else if(isToday && !t.done) statusPill = `<span class="task-status-pill today">Hoje</span>`;

  row.innerHTML = `
    <div class="task-check task-check-circle ${t.done?'done':''}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <div class="task-row-left">
      <span class="task-id-badge">${t.shortId||''}</span>
      <span class="task-title">${escapeHtml(t.title || 'Sem título')}</span>
      <span class="task-status-label">${(STATUS_CONFIG.find(s=>s.key===(t.status||'nao_iniciado'))||STATUS_CONFIG[0]).label}</span>
      ${t.dueDate ? `<span class="task-cal-badge ${overdue?'overdue':''}" style="margin-left:10px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>${fmtDate(t.dueDate)}${t.dueTime ? ' '+t.dueTime : ''}</span>` : ''}
      ${subtasks.length ? `<span class="task-subtask-badge">${subDone}/${subtasks.length}</span>` : ''}
      ${tags.length ? `<span class="task-tag-pill" style="background:${tags[0].color}22; color:${tags[0].color};"><span class="dot" style="background:${tags[0].color}"></span>${escapeHtml(tags[0].name)}</span>` : ''}
      ${tags.length > 1 ? `<span class="task-tag-more" title="${tags.slice(1).map(t=>t.name).join(', ')}">+${tags.length-1}</span>` : ''}
    </div>
    <div class="task-row-right">
      ${commentCount ? `<span class="task-comment-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>${commentCount}</span>` : ''}
      ${(t.recurrence && t.recurrence !== 'none') ? `<span class="task-recurrence-icon" title="Recorrente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2.1l4 4-4 4"/><path d="M3 12.6v-2a4 4 0 014-4h14"/><path d="M7 21.9l-4-4 4-4"/><path d="M21 11.4v2a4 4 0 01-4 4H3"/></svg></span>` : ''}
      ${statusPill}
      <div class="task-menu-wrap">
        <button class="task-menu-btn"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2.1"/><circle cx="12" cy="12" r="2.1"/><circle cx="12" cy="19" r="2.1"/></svg></button>
      </div>
    </div>
  `;
  row.querySelector('.task-check').onclick = (e) => {
    e.stopPropagation();
    const wasDone = t.done;
    t.done = !t.done;
    t.status = t.done ? 'concluida' : 'nao_iniciado';
    t.completedAt = t.done ? Date.now() : null;
    if(!wasDone && t.done && t.recurrence && t.recurrence !== 'none'){
      const next = spawnNextRecurrence(t);
      state.tasks = state.tasks.filter(x => x.id !== t.id);
      markDirty();
      openTaskPanel(next.id);
      return;
    }
    markDirty();
  };

  const menuWrap = row.querySelector('.task-menu-wrap');
  const menuBtn = row.querySelector('.task-menu-btn');
  menuBtn.onclick = (e) => {
    e.stopPropagation();
    const wasOpen = menuWrap.classList.contains('open');
    closeAllTaskMenus();
    if(!wasOpen) openTaskRowMenu(t, menuBtn, menuWrap);
  };

  row.addEventListener('click', () => openTaskPanel(t.id));
  return row;
}

function openTaskRowMenu(task, btnEl, wrapEl){
  const portal = ensureTaskMenuPortal();
  portal.innerHTML = `
    <button type="button" class="task-menu-item" data-action="edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>Editar</button>

    <button type="button" class="task-menu-item" data-action="move"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/><path d="M12 11v4M10 13h4"/></svg>Mover de espaço</button>

  `;
  const rect = btnEl.getBoundingClientRect();
  portal.style.top = Math.round(rect.bottom + 6) + 'px';
  portal.style.right = Math.round(window.innerWidth - rect.right) + 'px';
  portal.style.left = 'auto';
  portal.classList.add('show');
  wrapEl.classList.add('open');
  openMenuWrapEl = wrapEl;

  portal.querySelector('[data-action="edit"]').onclick = (e) => {
    e.stopPropagation();
    closeAllTaskMenus();
    openTaskPanel(task.id);
  };
  portal.querySelector('[data-action="duplicate"]').onclick = (e) => {
    e.stopPropagation();
    closeAllTaskMenus();
    const copy = JSON.parse(JSON.stringify(task));
    copy.id = uid('task');
    copy.title = task.title + ' (cópia)';
    copy.done = false;
    copy.createdAt = Date.now();
    (copy.subtasks||[]).forEach(s => s.id = uid('sub'));
    (copy.comments||[]).forEach(c => c.id = uid('cmt'));
    state.tasks.push(copy);
    markDirty();
  };
  portal.querySelector('[data-action="move"]').onclick = (e) => {
    e.stopPropagation();
    openMoveGroupPortal(e.currentTarget, task.categoryId, (newCatId) => {
      task.categoryId = newCatId;
      task.tagIds = (task.tagIds||[]).filter(id => {
        const tg = state.tags.find(x => x.id === id);
        return tg && (!tg.categoryId || tg.categoryId === newCatId);
      });
      markDirty();
    });
    closeAllTaskMenus();
  };
  portal.querySelector('[data-action="delete"]').onclick = (e) => {
    e.stopPropagation();
    closeAllTaskMenus();
    state.tasks = state.tasks.filter(x => x.id !== task.id);
    if(activeTaskId === task.id) activeTaskId = null;
    markDirty();
  };
}

function renderUnifiedTagPicker(portal, opts){
  const { categoryId, isSelected, onToggle, onChanged } = opts;
  portal.innerHTML = `
    <div class="search-input-wrap">
      <input type="text" class="tag-picker-search" id="tagPickerSearch_${portal.id}" placeholder="Buscar ou criar tag..." autocomplete="off">
      <button type="button" class="search-clear-btn" style="display:none;" title="Limpar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="tp-tags-popover-list" id="tagPickerList_${portal.id}"></div>
  `;
  const searchInput = portal.querySelector(`#tagPickerSearch_${portal.id}`);
  const list = portal.querySelector(`#tagPickerList_${portal.id}`);
  const clearBtn = portal.querySelector('.search-clear-btn');
  clearBtn.onclick = (e) => { e.stopPropagation(); searchInput.value=''; searchInput.dispatchEvent(new Event('input')); searchInput.focus(); };

  function renderList(){
    const term = searchInput.value.trim().toLowerCase();
    const visibleTags = state.tags.filter(tg => !tg.categoryId || tg.categoryId === categoryId);
    const matchFilter = tg => !term || tg.name.toLowerCase().includes(term);
    const ofGroup = visibleTags.filter(tg => tg.categoryId === categoryId && matchFilter(tg));
    const general = visibleTags.filter(tg => !tg.categoryId && matchFilter(tg));
    const renderRow = tg => `
      <div class="tp-tags-popover-row" data-tag="${tg.id}">
        <button type="button" class="tag-row-color-dot" data-tag-color="${tg.id}" style="background:${tg.color}" title="Alterar cor"></button>
        <span class="tp-tags-popover-name">${escapeHtml(tg.name)}</span>
        ${isSelected(tg.id) ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="13" height="13"><path d="M20 6L9 17l-5-5"/></svg>` : ''}
      </div>`;
    const exactMatch = visibleTags.some(tg => tg.name.toLowerCase() === term);
    let html = '';
    if(ofGroup.length) html += `<div class="tp-tags-popover-section">Deste espaço</div>` + ofGroup.map(renderRow).join('');
    if(general.length) html += `<div class="tp-tags-popover-section">Gerais</div>` + general.map(renderRow).join('');
    if(term && !exactMatch){
      html += `<div class="tp-tags-popover-row tag-create-row" data-create="1"><span class="tp-tags-popover-name">+ Criar tag "${escapeHtml(searchInput.value.trim())}"</span></div>`;
    }
    if(!html){
      html = '<div style="font-size:12px;color:var(--ink-faint); padding:6px 4px;">Nenhuma tag encontrada</div>';
    }
    list.innerHTML = html;

    list.querySelectorAll('.tp-tags-popover-row[data-tag]').forEach(row => {
      row.addEventListener('click', (e) => {
        if(e.target.closest('.tag-row-color-dot')) return;
        onToggle(row.dataset.tag);
        renderList();
        if(onChanged) onChanged();
      });
      const colorDot = row.querySelector('.tag-row-color-dot');
      colorDot.onclick = (e) => {
        e.stopPropagation();
        const tag = state.tags.find(t => t.id === row.dataset.tag);
        if(!tag) return;
        openColorPortal(tag.color, colorDot, (color) => {
          tag.color = color;
          colorDot.style.background = color;
          markDirty();
          if(onChanged) onChanged();
        });
      };
    });
    const createRow = list.querySelector('[data-create]');
    if(createRow){
      createRow.onclick = () => {
        const name = searchInput.value.trim();
        if(!name) return;
        const color = DEFAULT_COLORS[state.tags.length % DEFAULT_COLORS.length];
        const newTag = { id: uid('tag'), name, color, categoryId };
        state.tags.push(newTag);
        onToggle(newTag.id);
        searchInput.value = '';
        renderList();
        if(onChanged) onChanged();
      };
    }
  }
  searchInput.addEventListener('input', renderList);
  searchInput.addEventListener('input', () => { const cb = portal.querySelector('.search-clear-btn'); if(cb) cb.style.display = searchInput.value ? 'flex' : 'none'; });
  searchInput.addEventListener('click', e => e.stopPropagation());
  searchInput.addEventListener('keydown', e => e.stopPropagation());
  renderList();
  setTimeout(() => searchInput.focus(), 0);
}

      onChange();
      const dateField = document.getElementById('tpDate');
      if(dateField) dateField.value = e.target.value;
    });
  }

function positionTagsPortalNear(portal, anchorBtn){
  const rect = anchorBtn.getBoundingClientRect();
  const estHeight = portal.offsetHeight || 240;
  let top = rect.bottom + 6;
  if(top + estHeight > window.innerHeight) top = Math.max(8, rect.top - estHeight - 6);
  portal.style.top = Math.round(top) + 'px';
  let left = rect.left;
  if(left + 220 > window.innerWidth) left = window.innerWidth - 228;
  portal.style.left = Math.round(Math.max(8,left)) + 'px';
}

function openColorPortal(currentColor, btnEl, onSelect){
  const portal = ensureColorPortal();
  const wasOpenForThisBtn = portal.classList.contains('show') && portal.dataset.forBtn === btnEl.dataset.portalId;

  if(wasOpenForThisBtn) return;
  if(!btnEl.dataset.portalId) btnEl.dataset.portalId = uid('cswatch');
  portal.dataset.forBtn = btnEl.dataset.portalId;
  portal.innerHTML = DEFAULT_COLORS.map(c => `<span class="note-color-dot ${c===currentColor?'selected':''}" data-color="${c}" style="background:${c}"></span>`).join('');
  const rect = btnEl.getBoundingClientRect();
  portal.classList.add('show');
  const portalHeight = portal.offsetHeight || 90;
  let top = rect.bottom + 6;
  if(top + portalHeight > window.innerHeight) top = rect.top - portalHeight - 6;
  portal.style.top = Math.round(top) + 'px';
  let left = rect.left;
  if(left + 160 > window.innerWidth) left = window.innerWidth - 168;
  portal.style.left = Math.round(left) + 'px';
  portal.querySelectorAll('.note-color-dot').forEach(dot => {
    dot.onclick = (e) => {
      e.stopPropagation();

function getOrCreateActiveTask(){
  if(creatingNewTask){
    const defaultCat = (activeCategoryFilter && catById(activeCategoryFilter)) ? activeCategoryFilter : state.categories[0].id;
    state.taskIdCounter = (state.taskIdCounter || 0) + 1;
    const t = {
      id: uid('task'), shortId: String(state.taskIdCounter).padStart(4, '0'),
      title:'', categoryId: defaultCat, done:false, status:'nao_iniciado',
      dueDate: todayStr(), dueTime: DEFAULT_DUE_TIME, priority:'media', description:'',
      tagIds:[], recurrence:'none', subtasks:[], comments:[], createdAt: Date.now()
    };
    state.tasks.push(t);
    activeTaskId = t.id;
    creatingNewTask = false;
    return t;
  }
  return state.tasks.find(x => x.id === activeTaskId);
}

const RECURRENCE_LABELS = { none:'Não repete', daily:'Diariamente', weekly:'Semanalmente', monthly:'Mensalmente', yearly:'Anualmente' };
const RECURRENCE_UNIT_SINGULAR = { daily:'dia', weekly:'semana', monthly:'mês', yearly:'ano' };
const RECURRENCE_UNIT_PLURAL = { daily:'dias', weekly:'semanas', monthly:'meses', yearly:'anos' };

function recurrenceSummaryLabel(task){
  if(!task.recurrence || task.recurrence === 'none') return 'Não repete';
  const n = task.recurrenceInterval || 1;
  if(n === 1) return RECURRENCE_LABELS[task.recurrence];
  return `A cada ${n} ${RECURRENCE_UNIT_PLURAL[task.recurrence]}`;
}

        activeTaskId = null;
