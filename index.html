    <div class="note-attach-row" id="composerAttachRow"></div>
    <div class="note-bottom-bar" id="noteBottomBar">
      <div class="note-bottom-row-top">
        <button type="button" class="note-attach-btn" id="composerAttachBtn" title="Anexar imagem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a5 5 0 01-7.07-7.07l9.19-9.19a3.5 3.5 0 014.95 4.95l-9.19 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg></button>
        <input type="file" id="composerAttachInput" accept="image/*" multiple style="display:none;">
        <button type="button" class="note-linked-task-btn" id="noteLinkedTaskBtn" title="Vincular tarefa">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          <span id="noteLinkedTaskLabel">Vincular tarefa</span>
        </button>
      </div>
      <div class="note-bottom-row">
        <button type="button" class="move-group-btn" id="noteMoveGroupBtn" title="Mover de grupo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/><path d="M12 11v4M10 13h4"/></svg></button>
        <span class="group-current-chip" id="noteGroupChip"></span>
        <div class="tp-tags-selected" id="noteTagsSelected">
          ${(isEditing ? (existingNote.tagIds||[]) : []).map(id => state.tags.find(tg=>tg.id===id)).filter(Boolean).map(tg => `<span class="tp-tag-chip active" style="background:${tg.color}">${escapeHtml(tg.name)}</span>`).join('')}
          <button type="button" class="tp-tags-add-btn" id="noteTagsToggleBtn">+ Tag</button>
        </div>
        ${isEditing ? `<button type="button" class="move-group-btn ${existingNote.pinned?'pinned-active':''}" id="composerPinBtn" title="${existingNote.pinned?'Desafixar':'Fixar'}">${pinIconSvg(existingNote.pinned)}</button>` : ''}
        ${isEditing ? `<button type="button" class="btn ghost small" id="composerDeleteBtn" style="color:var(--danger); border-color:var(--danger-light);">Excluir</button>` : ''}
      </div>
    </div>
  `;
  const bodyInputEl = composer.querySelector('.note-body-input');
  if(isEditing) bodyInputEl.innerHTML = existingNote.body || '';
  attachFormattedPaste(bodyInputEl);
  const toolbarEl = buildRichToolbar(bodyInputEl);
  toolbarEl.style.background = tintSolid(selectedColor, 0.15);
  composer.querySelector('.rt-toolbar-slot').replaceWith(toolbarEl);
  composer.querySelector('#noteBottomBar').style.background = tintSolid(selectedColor, 0.15);

  const paletteGroup = document.createElement('div');
  paletteGroup.className = 'rt-toolbar-color-group';
  paletteGroup.innerHTML = `
    <svg class="rt-palette-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 011.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
    <button type="button" class="color-swatch-btn" style="background:${selectedColor}" title="Cor da nota"></button>
  `;
  toolbarEl.appendChild(paletteGroup);

  let noteTagIds = isEditing ? (existingNote.tagIds||[]).slice() : [];
  let noteLinkedTaskId = isEditing ? (existingNote.linkedTaskId || null) : (prefillTask ? prefillTask.id : null);
  function renderNoteLinkedTaskLabel(){
    const label = composer.querySelector('#noteLinkedTaskLabel');
    if(!label) return;
    const t = noteLinkedTaskId ? state.tasks.find(x => x.id === noteLinkedTaskId) : null;
    label.textContent = t ? `${t.shortId?t.shortId+' — ':''}${t.title||'Sem título'}` : 'Vincular tarefa';
    const btn = composer.querySelector('#noteLinkedTaskBtn');
    if(btn) btn.classList.toggle('linked', !!t);
  }
  composer.querySelector('#noteLinkedTaskBtn').onclick = (e) => {
    e.stopPropagation();
    const portal = ensureTagsPortal();
    const wasOpen = portal.classList.contains('show');
    closeTagsPortal();
    if(wasOpen) return;
    portal.classList.add('show');
    positionTagsPortalNear(portal, e.currentTarget);
    portal.onclick = e2 => e2.stopPropagation();
    renderTaskLinkPicker(portal, {
      currentTaskId: noteLinkedTaskId,
      onSelect: (taskId) => {
        noteLinkedTaskId = taskId;
        renderNoteLinkedTaskLabel();
        closeTagsPortal();
      }
    });
  };
  renderNoteLinkedTaskLabel();
  function renderNoteTagsSelected(){
    const box = composer.querySelector('#noteTagsSelected');
    const addBtn = box.querySelector('#noteTagsToggleBtn');
    box.querySelectorAll('.tp-tag-chip').forEach(el => el.remove());
    noteTagIds.map(id => state.tags.find(tg=>tg.id===id)).filter(Boolean).forEach(tg => {
      const chip = document.createElement('span');
      chip.className = 'tp-tag-chip active';
      chip.style.background = tg.color;
      chip.textContent = tg.name;
      box.insertBefore(chip, addBtn);
    });
  }

  const noteTagsToggleBtn = composer.querySelector('#noteTagsToggleBtn');

  function renderNoteGroupChip(){
    const cat = catById(noteCategoryId);
    const chip = composer.querySelector('#noteGroupChip');
    chip.style.background = cat ? cat.color + '22' : 'var(--surface-2)';
    chip.style.color = cat ? cat.color : 'var(--ink-soft)';
    chip.innerHTML = `<span class="cat-swatch" style="background:${cat?cat.color:'var(--ink-faint)'}"></span>${escapeHtml(cat?cat.name:'Sem categoria')}`;
  }
  renderNoteGroupChip();
  composer.querySelector('#noteMoveGroupBtn').onclick = (e) => {
    e.stopPropagation();
    openMoveGroupPortal(e.currentTarget, noteCategoryId, (newCatId) => {
      noteCategoryId = newCatId;
      noteTagIds = noteTagIds.filter(id => {
        const tg = state.tags.find(x => x.id === id);
        return tg && (!tg.categoryId || tg.categoryId === noteCategoryId);
      });
      renderNoteGroupChip();
      renderNoteTagsSelected();
    });
  };

  noteTagsToggleBtn.onclick = (e) => {
    e.stopPropagation();
    const portal = ensureTagsPortal();
    const wasOpen = portal.classList.contains('show');
    closeTagsPortal();
    if(wasOpen) return;
    portal.classList.add('show');
    positionTagsPortalNear(portal, noteTagsToggleBtn);
    portal.onclick = e2 => e2.stopPropagation();
    renderUnifiedTagPicker(portal, {
      categoryId: noteCategoryId,
      isSelected: (tagId) => noteTagIds.includes(tagId),
      onToggle: (tagId) => {
        if(noteTagIds.includes(tagId)) noteTagIds = noteTagIds.filter(id => id !== tagId);
        else noteTagIds.push(tagId);
        renderNoteTagsSelected();
      },
      onChanged: () => { renderNoteTagsSelected(); }
    });
  };

  const colorSwatchBtn = composer.querySelector('.color-swatch-btn');
  colorSwatchBtn.onclick = (e) => {
    e.stopPropagation();
    openColorPortal(selectedColor, colorSwatchBtn, (color) => {
      selectedColor = color;
      colorSwatchBtn.style.background = selectedColor;
      modal.style.background = tintSolid(selectedColor, 0.15);
      toolbarEl.style.background = tintSolid(selectedColor, 0.15);
      composer.querySelector('#noteBottomBar').style.background = tintSolid(selectedColor, 0.15);
    });
  };

  let attachments = isEditing ? (existingNote.attachments || []).slice() : [];
  function renderComposerAttachments(){
    const row = composer.querySelector('#composerAttachRow');
    row.innerHTML = '';
    attachments.forEach(att => {
      const thumb = document.createElement('div');
      thumb.className = 'note-attach-thumb';
      thumb.innerHTML = `<img src="${att.dataUrl}" alt=""><button type="button" class="note-attach-del">×</button>`;
      thumb.querySelector('img').onclick = () => window.open(att.dataUrl, '_blank');
      thumb.querySelector('.note-attach-del').onclick = () => {
        attachments = attachments.filter(a => a.id !== att.id);
        renderComposerAttachments();
      };
      row.appendChild(thumb);
    });
  }
  renderComposerAttachments();
  composer.querySelector('#composerAttachBtn').onclick = () => composer.querySelector('#composerAttachInput').click();
  composer.querySelector('#composerAttachInput').addEventListener('change', e => {
    Array.from(e.target.files||[]).forEach(file => {
      const reader = new FileReader();
      reader.onload = ev => {
        attachments.push({ id: uid('att'), name: file.name, dataUrl: ev.target.result });
        renderComposerAttachments();
      };
      reader.readAsDataURL(file);
    });
    e.target.value = '';
  });

  let deleted = false;
  if(isEditing){
    const pinBtn = composer.querySelector('#composerPinBtn');
    pinBtn.onclick = (e) => {
      e.stopPropagation();
      existingNote.pinned = !existingNote.pinned;
      existingNote.pinnedAt = existingNote.pinned ? Date.now() : null;
      pinBtn.classList.toggle('pinned-active', existingNote.pinned);
      pinBtn.title = existingNote.pinned ? 'Desafixar' : 'Fixar';
      pinBtn.innerHTML = pinIconSvg(existingNote.pinned);
      markDirty();
    };
    composer.querySelector('#composerDeleteBtn').onclick = (e) => {
      e.stopPropagation();
      openConfirmPortal(e.currentTarget, 'Excluir esta nota?', () => {
        state.notes = state.notes.filter(x => x.id !== existingNote.id);
        deleted = true;
        hideNoteComposerOverlay();
        markDirty();
      });
    };
  }

  const bodyInput = composer.querySelector('.note-body-input');

  let createdNoteRef = null;
  function commit(){
    if(deleted) return;
    const title = composer.querySelector('.note-title').value.trim();
    const body = bodyInput.innerHTML;
    if(!title && !bodyInput.textContent.trim() && attachments.length === 0) return;
    const categoryId = noteCategoryId;
    const targetNote = isEditing ? existingNote : createdNoteRef;
    if(targetNote){
      targetNote.title = title;
      targetNote.body = body;
      targetNote.categoryId = categoryId;
      targetNote.color = selectedColor;
      targetNote.attachments = attachments;
      targetNote.tagIds = noteTagIds;
      targetNote.linkedTaskId = noteLinkedTaskId;
      targetNote.updatedAt = Date.now();
    } else {
      const newNote = {
        id: uid('note'), title, body,
        categoryId,
        color: selectedColor, pinned:false, archived:false,
        attachments,
        tagIds: noteTagIds,
        linkedTaskId: noteLinkedTaskId,
        createdAt: Date.now(), updatedAt: Date.now()
      };
      state.notes.unshift(newNote);
      createdNoteRef = newNote;
    }
    markDirty();
  }

  return { element: composer, commit };
}

function openNoteComposer(existingNote, prefillTaskId){
  const modal = document.getElementById('noteComposerModal');
  modal.style.position = 'relative';
  modal.innerHTML = '';
  const { element: composer, commit } = buildNoteComposer(existingNote, prefillTaskId);
  modal.appendChild(composer);
  currentNoteComposerCommit = commit;
  document.getElementById('noteComposerOverlay').classList.add('show');
  setTimeout(() => composer.querySelector('.note-title').focus(), 0);
}

function hideNoteComposerOverlay(){
  document.getElementById('noteComposerOverlay').classList.remove('show');
  document.getElementById('noteComposerModal').style.background = '';
  currentNoteComposerCommit = null;
}

function closeNoteComposer(){
  if(currentNoteComposerCommit) currentNoteComposerCommit();
  hideNoteComposerOverlay();
}

let noteOverlayMouseDownOnBackdrop = false;
document.getElementById('noteComposerOverlay').addEventListener('mousedown', e => {
  noteOverlayMouseDownOnBackdrop = (e.target.id === 'noteComposerOverlay');
});
document.getElementById('noteComposerOverlay').addEventListener('click', e => {
  if(e.target.id === 'noteComposerOverlay' && noteOverlayMouseDownOnBackdrop) closeNoteComposer();
});

const WEEKDAY_LABELS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const WEEKDAY_FULL_LABELS = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const MONTH_LABELS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function eventsInScope(){
  return state.events.filter(ev => !activeCategoryFilter || ev.categoryId === activeCategoryFilter);
}
function getEventsForDate(dateStr){
  return eventsInScope().filter(ev => ev.date === dateStr).sort((a,b) => (a.startTime||'00:00').localeCompare(b.startTime||'00:00'));
}
function eventColor(ev){
  if(ev.tagIds && ev.tagIds.length){
    const tg = state.tags.find(t => t.id === ev.tagIds[0]);
    if(tg) return tg.color;
  }
  const cat = catById(ev.categoryId);
  return cat ? cat.color : 'var(--primary)';
}
function eventPrimaryTagName(ev){
  if(ev.tagIds && ev.tagIds.length){
    const tg = state.tags.find(t => t.id === ev.tagIds[0]);
    if(tg) return tg.name;
  }
  return null;
}
function addDaysStr(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return dateToStr(d);
}
function startOfWeekStr(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const startDay = state.weekStartDay || 0;
  const diff = (d.getDay() - startDay + 7) % 7;
  d.setDate(d.getDate() - diff);
  return dateToStr(d);
}

function svgDonutChart(segments, size){
  const total = segments.reduce((s,x)=>s+x.value,0);
  const r = size/2 - 6;
  const cx = size/2, cy = size/2;
  if(total <= 0){
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="10"></circle></svg>`;
  }
  let startAngle = -90;
  let paths = '';
  segments.forEach(seg => {
    if(seg.value <= 0) return;
    const angle = (seg.value/total)*360;
    const endAngle = startAngle + angle;
    const largeArc = angle > 180 ? 1 : 0;
    const x1 = cx + r*Math.cos(startAngle*Math.PI/180);
    const y1 = cy + r*Math.sin(startAngle*Math.PI/180);
    const x2 = cx + r*Math.cos(endAngle*Math.PI/180);
    const y2 = cy + r*Math.sin(endAngle*Math.PI/180);
    paths += `<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${largeArc} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${seg.color}"></path>`;
    startAngle = endAngle;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${paths}<circle cx="${cx}" cy="${cy}" r="${r*0.58}" fill="var(--surface)"></circle></svg>`;
}
function svgBarChart(values, labels, width, height){
  const max = Math.max(1, ...values);
  const barW = width/values.length;
  let bars = '';
  values.forEach((v,i) => {
    const h = v>0 ? Math.max(2, (v/max)*(height-18)) : 0;
    const x = i*barW + barW*0.22;
    const w = barW*0.56;
    const y = height - h - 14;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(--primary)"><title>${labels?labels[i]:''}: ${v}</title></rect>`;
  });
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" preserveAspectRatio="none">${bars}</svg>`;
}

  const completedPrev7 = completed.filter(t => t.completedAt && t.completedAt >= now - 14*DAY && t.completedAt < now - 7*DAY);

function renderCalendar(){
  const view = document.getElementById('calendarView');
  view.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'cal-header';
  const focusD = new Date(calendarFocusDate + 'T00:00:00');
  let periodLabel = '';
  if(calendarView === 'month') periodLabel = `${MONTH_LABELS[focusD.getMonth()]} ${focusD.getFullYear()}`;
  else if(calendarView === 'week'){
    const start = startOfWeekStr(calendarFocusDate);
    const end = addDaysStr(start, 6);
    const sD = new Date(start+'T00:00:00'), eD = new Date(end+'T00:00:00');
    periodLabel = `${sD.getDate()} de ${MONTH_LABELS[sD.getMonth()]} – ${eD.getDate()} de ${MONTH_LABELS[eD.getMonth()]}`;
  } else {
    periodLabel = `${focusD.getDate()} de ${MONTH_LABELS[focusD.getMonth()]}, ${WEEKDAY_LABELS[focusD.getDay()]}`;
  }

  header.innerHTML = `
    <div class="cal-view-toggle">
      <button type="button" data-cv="day" class="${calendarView==='day'?'active':''}">Dia</button>
      <button type="button" data-cv="week" class="${calendarView==='week'?'active':''}">Semana</button>
      <button type="button" data-cv="month" class="${calendarView==='month'?'active':''}">Mês</button>
    </div>
    <div class="cal-nav">
      <button type="button" id="calPrevBtn" title="Anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button type="button" id="calTodayBtn">Hoje</button>
      <button type="button" id="calNextBtn" title="Próximo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <div class="cal-period-label">${periodLabel}</div>
  `;
  view.appendChild(header);

  header.querySelectorAll('[data-cv]').forEach(btn => {
    btn.onclick = () => {
      calendarView = btn.dataset.cv;
      state.calendarViewDefault = calendarView;
      if(activeCategoryFilter){
        state.categoryCalendarViews[activeCategoryFilter] = calendarView;
      }
      markDirty();
    };
  });
  header.querySelector('#calTodayBtn').onclick = () => { calendarFocusDate = todayStr(); render(); };
  header.querySelector('#calPrevBtn').onclick = () => { navigateCalendar(-1); };
  header.querySelector('#calNextBtn').onclick = () => { navigateCalendar(1); };

  const body = document.createElement('div');
  body.className = 'cal-body';
  view.appendChild(body);

  if(calendarView === 'month') renderCalendarMonth(body);
  else if(calendarView === 'week') renderCalendarWeek(body);
  else renderCalendarDay(body);
}

function navigateCalendar(dir){
  if(calendarView === 'month'){
    const d = new Date(calendarFocusDate + 'T00:00:00');
    d.setMonth(d.getMonth() + dir);
    calendarFocusDate = dateToStr(d);
  } else if(calendarView === 'week'){
    calendarFocusDate = addDaysStr(calendarFocusDate, dir*7);
  } else {
    calendarFocusDate = addDaysStr(calendarFocusDate, dir);
  }
  render();
}

function renderCalendarMonth(body){
  const focusD = new Date(calendarFocusDate + 'T00:00:00');
  const year = focusD.getFullYear(), month = focusD.getMonth();
  const startDay = state.weekStartDay || 0;
  const firstOfMonth = new Date(year, month, 1);
  const gridStart = new Date(firstOfMonth);
  gridStart.setDate(gridStart.getDate() - ((firstOfMonth.getDay() - startDay + 7) % 7));
  const todayS = todayStr();
  const rotatedWeekdayLabels = WEEKDAY_LABELS.slice(startDay).concat(WEEKDAY_LABELS.slice(0, startDay));
  const rotatedWeekdayIndexes = [0,1,2,3,4,5,6].slice(startDay).concat([0,1,2,3,4,5,6].slice(0, startDay));

  const grid = document.createElement('div');
  grid.className = 'cal-month-grid';
  rotatedWeekdayLabels.forEach((l, i) => {
    const h = document.createElement('div');
    const dayIdx = rotatedWeekdayIndexes[i];
    h.className = 'cal-month-weekday' + (dayIdx===0||dayIdx===6?' weekend':'');
    h.textContent = l;
    grid.appendChild(h);
  });
  for(let i=0;i<42;i++){
    const cellDate = new Date(gridStart); cellDate.setDate(gridStart.getDate()+i);
    const cellStr = dateToStr(cellDate);

    });
    cell.addEventListener('click', () => openEventComposer(null, cellStr));
    grid.appendChild(cell);
  }
  body.appendChild(grid);
}

const CAL_HOUR_HEIGHT = 48;
function timeToMinutes(t){
  if(!t) return null;
  const [h,m] = t.split(':').map(Number);
  return h*60 + (m||0);
}

function getCalHourHeight(){
  return state.calendarHourDensity === 'normal' ? 48 : 26;
}
function getCalHourStep(){
  return state.calendarHourDensity === 'normal' ? 1 : 2;
}

  }).join('');
  wrap.appendChild(alldayRow);

  const scrollWrap = document.createElement('div');
  scrollWrap.className = 'cal-week-scroll';
  const grid = document.createElement('div');
  grid.className = 'cal-week-hourgrid';

  const gutter = document.createElement('div');
  gutter.className = 'cal-week-gutter';
  for(let h=0; h<24; h+=hourStep){
    const cell = document.createElement('div');
    cell.className = 'cal-week-hour-label';
    cell.style.height = (hourHeight*hourStep) + 'px';
    cell.textContent = String(h).padStart(2,'0')+':00';
    gutter.appendChild(cell);
  }
  grid.appendChild(gutter);

  days.forEach(dStr => {
    const col = document.createElement('div');
    const dObj = new Date(dStr+'T00:00:00');
    const isWeekend = dObj.getDay()===0 || dObj.getDay()===6;
    col.className = 'cal-week-daycol' + (dStr===todayS?' today':'') + (isWeekend?' weekend':'');
    col.style.height = (hourHeight*24) + 'px';
    for(let h=0; h<24; h+=hourStep){
      const line = document.createElement('div');
      line.className = 'cal-week-hour-line';
      line.style.top = (h*hourHeight) + 'px';
      col.appendChild(line);
    }
    const timedEvents = getEventsForDate(dStr).filter(ev => !ev.allDay && ev.startTime);
    timedEvents.forEach(ev => {
      const startMin = timeToMinutes(ev.startTime);
      const endMin = ev.endTime ? timeToMinutes(ev.endTime) : startMin + 60;
      const top = (startMin/60) * hourHeight;
      const height = Math.max(20, ((endMin-startMin)/60) * hourHeight);
      const block = document.createElement('div');
      block.className = 'cal-event-block-timed';
      block.dataset.eventId = ev.id;

    });
    col.addEventListener('click', (e) => {
      if(e.target.closest('.cal-event-block-timed')) return;

      const offsetY = e.clientY - rect.top;
      const hour = Math.max(0, Math.min(23, Math.floor(offsetY / hourHeight)));
      openEventComposer(null, dStr);
    });
    grid.appendChild(col);
  });

  scrollWrap.appendChild(grid);
  wrap.appendChild(scrollWrap);
  body.appendChild(wrap);

  alldayRow.querySelectorAll('.cal-event-pill').forEach(pill => {
    pill.onclick = (e) => { e.stopPropagation(); const ev = state.events.find(x=>x.id===pill.dataset.eventId); if(ev) openEventComposer(ev); };
  });

  const scrollToHour = Math.max(0, new Date().getHours() - 2);
  scrollWrap.scrollTop = scrollToHour * hourHeight;
}

function addOneHourToTime(timeStr){
  if(!timeStr) return '';
  const [h,m] = timeStr.split(':').map(Number);
  const newH = Math.min((h||0)+1, 23);
  return String(newH).padStart(2,'0') + ':' + String(m||0).padStart(2,'0');
}

function applyTaskDataToEvent(ev, task){
  ev.title = task.title || ev.title;
  ev.tagIds = (task.tagIds||[]).slice();
  ev.date = task.dueDate || ev.date;
  ev.endDate = task.dueDate || ev.date;
  ev.startTime = task.dueTime || '';
  ev.endTime = ev.startTime ? addOneHourToTime(ev.startTime) : '';
  ev.allDay = !task.dueTime;
}

function nextRoundedHourTimes(){
  const now = new Date();
  let hour = now.getHours();
  if(now.getMinutes() > 0) hour = Math.min(hour + 1, 23);
  const start = String(hour).padStart(2,'0') + ':00';
  const end = String(Math.min(hour + 1, 23)).padStart(2,'0') + ':00';
  return { start, end };
}

function icsDateStamp(dateStr, timeStr){
  const datePart = (dateStr || todayStr()).replace(/-/g, '');
  if(!timeStr) return datePart;
  const timePart = timeStr.replace(':', '') + '00';
  return `${datePart}T${timePart}`;
}
function icsEscape(text){
  return String(text||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
function downloadEventAsICS(ev){
  const isAllDay = !!ev.allDay || !ev.startTime;
  const dtStart = isAllDay ? icsDateStamp(ev.date) : icsDateStamp(ev.date, ev.startTime);
  const dtEnd = isAllDay ? icsDateStamp(ev.endDate || ev.date) : icsDateStamp(ev.endDate || ev.date, ev.endTime || ev.startTime);
  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Taskin//PT-BR',
    'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    'UID:' + ev.id + '@taskin',
    'DTSTAMP:' + icsDateStamp(todayStr(), '00:00'),
    isAllDay ? ('DTSTART;VALUE=DATE:' + dtStart) : ('DTSTART:' + dtStart),
    isAllDay ? ('DTEND;VALUE=DATE:' + dtEnd) : ('DTEND:' + dtEnd),
    'SUMMARY:' + icsEscape(ev.title || 'Sem título'),
    ev.description ? ('DESCRIPTION:' + icsEscape(ev.description)) : '',
    'END:VEVENT',
    'END:VCALENDAR'
  ].filter(Boolean);
  const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (ev.title || 'agenda').replace(/[^\w\-]+/g, '_') + '.ics';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => { try{ URL.revokeObjectURL(url); }catch(e){} }, 1000);
}

}

function renderNotes(){
  const view = document.getElementById('notesView');
  view.innerHTML = '';

  const noteFilterBar = document.createElement('div');
  noteFilterBar.className = 'group-mode-bar';
  noteFilterBar.innerHTML = `
    <div class="tag-filter-control" style="margin-left:0;">
      <button type="button" class="tag-filter-btn" id="noteTagFilterBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41L11 3.83A2 2 0 009.59 3.24H4a1 1 0 00-1 1v5.59a2 2 0 00.59 1.41l9.58 9.58a2 2 0 002.82 0l5.6-5.59a2 2 0 000-2.82z"/><circle cx="7" cy="7" r="1.3" fill="currentColor" stroke="none"/></svg>
        <span id="noteTagFilterLabel">${activeNoteTagFilters.length ? activeNoteTagFilters.length + ' tag(s)' : 'Todas as tags'}</span>
      </button>
      <div class="tag-filter-popover" id="noteTagFilterPopover" style="display:${noteTagFilterPopoverOpen?'block':'none'};">
        ${(() => {
          const usedTagIds = new Set();
          state.notes.forEach(n => (n.tagIds||[]).forEach(id => usedTagIds.add(id)));
          const usableTags = state.tags.filter(tg => usedTagIds.has(tg.id));
          if(usableTags.length === 0) return '<div style="font-size:12px;color:var(--ink-faint); padding:4px 2px;">Nenhuma tag em uso nas notas</div>';
          return usableTags.map(tg => `
            <label class="tag-filter-row">
              <input type="checkbox" data-tag="${tg.id}" ${activeNoteTagFilters.includes(tg.id)?'checked':''}>
              <span class="cat-swatch" style="background:${tg.color}"></span>
              ${escapeHtml(tg.name)}
            </label>
          `).join('');
        })()}
      </div>
    </div>
  `;
  const noteTagFilterBtn = noteFilterBar.querySelector('#noteTagFilterBtn');
  const noteTagFilterPopover = noteFilterBar.querySelector('#noteTagFilterPopover');
  noteTagFilterBtn.onclick = (e) => {
    e.stopPropagation();
    noteTagFilterPopoverOpen = !noteTagFilterPopoverOpen;
    noteTagFilterPopover.style.display = noteTagFilterPopoverOpen ? 'block' : 'none';
  };
  noteTagFilterPopover.addEventListener('click', e => e.stopPropagation());
  noteTagFilterPopover.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', e => {
      const tagId = e.target.dataset.tag;
      if(e.target.checked){ if(!activeNoteTagFilters.includes(tagId)) activeNoteTagFilters.push(tagId); }
      else { activeNoteTagFilters = activeNoteTagFilters.filter(id => id !== tagId); }
      render();
    });
  });
  view.appendChild(noteFilterBar);

  const term = searchTerm.trim().toLowerCase();
  let notes = state.notes.filter(n => !activeCategoryFilter || n.categoryId === activeCategoryFilter);
  if(term) notes = notes.filter(n => (n.title + stripHtml(n.body)).toLowerCase().includes(term));
  if(activeNoteTagFilters.length) notes = notes.filter(n => (n.tagIds||[]).some(id => activeNoteTagFilters.includes(id)));

  const active = notes.filter(n=>!n.archived);
  const archived = notes.filter(n=>n.archived);
  active.sort((a,b) => (b.pinned - a.pinned) || ((b.pinnedAt||0) - (a.pinnedAt||0)) || (b.updatedAt - a.updatedAt));

  if(active.length === 0 && archived.length === 0){
    view.insertAdjacentHTML('beforeend', `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-4"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      <p>Nenhuma nota ainda. Clique em "+" para começar.</p>
    </div>`);
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'notes-grid';
  active.forEach(n => grid.appendChild(renderNoteCard(n)));
  view.appendChild(grid);
  (window.requestAnimationFrame || window.setTimeout)(() => applyNotesMasonry(grid));

  if(archived.length){
    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = `Arquivadas (${archived.length})`;
    view.appendChild(label);
    const grid2 = document.createElement('div');
    grid2.className = 'notes-grid';
    archived.forEach(n => grid2.appendChild(renderNoteCard(n)));
    view.appendChild(grid2);
    (window.requestAnimationFrame || window.setTimeout)(() => applyNotesMasonry(grid2));
  }
}

function applyNotesMasonry(grid){
  if(!grid || !grid.isConnected) return;
  const styles = window.getComputedStyle(grid);
  const rowHeight = parseFloat(styles.getPropertyValue('grid-auto-rows')) || 4;
  const rowGapRaw = styles.getPropertyValue('row-gap') || styles.getPropertyValue('gap') || '16px';
  const rowGap = parseFloat(rowGapRaw) || 16;
  grid.querySelectorAll('.note-card').forEach(card => {
    const height = card.getBoundingClientRect().height;
    if(!height) return;
    const span = Math.ceil((height + rowGap) / (rowHeight + rowGap));
    card.style.gridRowEnd = 'span ' + Math.max(1, span);
  });
}

      n.categoryId = newCatId;
      n.tagIds = (n.tagIds||[]).filter(id => {

  card.querySelector('.note-clip-wrap').addEventListener('click', openThisNote);
  card.querySelector('.note-meta').addEventListener('click', openThisNote);

function initials(name){
  const parts = (name||'').trim().split(/\s+/).filter(Boolean);
  if(parts.length === 0) return '?';
  return parts.slice(0,2).map(p=>p[0].toUpperCase()).join('');
}

function renderCatRows(focusId){
  const rows = document.getElementById('catRows');
  if(!rows) return;
  rows.innerHTML = '';
  const ordered = getOrderedCategories();
  const isCustom = state.categoryOrder === 'custom';
  ordered.forEach((cat, idx) => {
    const row = document.createElement('div');
    row.className = 'cat-row';
    row.innerHTML = `
      <button type="button" class="fav-star-btn ${state.defaultCategoryFilter===cat.id?'active':''}" title="Definir como categoria padrão"><svg viewBox="0 0 24 24" fill="${state.defaultCategoryFilter===cat.id?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg></button>
      <input type="color" value="${cat.color}">
      <input type="text" value="${escapeHtml(cat.name)}">
      ${isCustom ? `
        <button type="button" class="reorder-btn" data-dir="up" ${idx===0?'disabled':''} title="Mover para cima"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg></button>
        <button type="button" class="reorder-btn" data-dir="down" ${idx===ordered.length-1?'disabled':''} title="Mover para baixo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
      ` : ''}
      <button title="Remover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m2 0v14a2 2 0 01-2 2H8a2 2 0 01-2-2V6h12z"/></svg></button>
    `;
    if(isCustom){
      row.querySelectorAll('.reorder-btn').forEach(btn => {
        btn.onclick = () => {
          const realIdx = state.categories.findIndex(c => c.id === cat.id);
          const dir = btn.dataset.dir === 'up' ? -1 : 1;
          const swapIdx = realIdx + dir;
          if(swapIdx < 0 || swapIdx >= state.categories.length) return;
          [state.categories[realIdx], state.categories[swapIdx]] = [state.categories[swapIdx], state.categories[realIdx]];
          markDirty();
          renderCatRows();
        };
      });
    }
    row.querySelector('.fav-star-btn').onclick = () => {
      state.defaultCategoryFilter = state.defaultCategoryFilter === cat.id ? null : cat.id;
      markDirty();
      renderCatRows();
    };
    row.querySelector('input[type=color]').oninput = e => { cat.color = e.target.value; markDirty(); renderCatRows(); };
    const nameInput = row.querySelector('input[type=text]');
    nameInput.addEventListener('blur', e => { cat.name = e.target.value.trim() || cat.name; markDirty(); });
    nameInput.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); e.target.blur(); } });
    row.querySelector('button[title="Remover"]').onclick = (e) => {
      e.stopPropagation();
      if(state.categories.length === 1){ alert('Mantenha ao menos uma categoria.'); return; }
      openConfirmPortal(e.currentTarget, `Remover "${cat.name}"? Tarefas e notas dessa categoria serão movidas para a primeira categoria disponível.`, () => {
        const fallback = state.categories.find(c => c.id !== cat.id);
        state.tasks.forEach(t => { if(t.categoryId === cat.id) t.categoryId = fallback.id; });
        state.notes.forEach(n => { if(n.categoryId === cat.id) n.categoryId = fallback.id; });
        state.categories = state.categories.filter(c => c.id !== cat.id);
        if(activeCategoryFilter === cat.id) activeCategoryFilter = null;
        if(state.defaultCategoryFilter === cat.id) state.defaultCategoryFilter = null;
        markDirty();
        renderCatRows();
      });
    };
    rows.appendChild(row);
    if(cat.id === focusId){ nameInput.focus(); nameInput.select(); }
  });
}

    markDirty();
    renderTagRows(newTag.id);
  };
}

function renderTagRows(focusId){
  const rows = document.getElementById('tagRows');
  if(!rows) return;
  rows.innerHTML = '';
  if(state.tags.length === 0){
    rows.innerHTML = `<p style="font-size:12.5px; color:var(--ink-faint);">Nenhuma tag criada ainda. Você também pode criar tags direto no painel de uma tarefa.</p>`;
  }
  const catOptions = `<option value="">Geral (todas)</option>` + state.categories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  const ordered = getOrderedTags();
  const isCustom = state.tagOrder === 'custom';
  ordered.forEach((tag, idx) => {
    const row = document.createElement('div');
    row.className = 'cat-row tag-row-settings';
    row.innerHTML = `
      <input type="color" value="${tag.color}">
      <input type="text" value="${escapeHtml(tag.name)}">
      <select class="tag-cat-select">${catOptions}</select>
      ${isCustom ? `
        <button type="button" class="reorder-btn" data-dir="up" ${idx===0?'disabled':''} title="Mover para cima"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg></button>
        <button type="button" class="reorder-btn" data-dir="down" ${idx===ordered.length-1?'disabled':''} title="Mover para baixo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
      ` : ''}
      <button title="Remover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m2 0v14a2 2 0 01-2 2H8a2 2 0 01-2-2V6h12z"/></svg></button>
    `;
    if(isCustom){
      row.querySelectorAll('.reorder-btn').forEach(btn => {
        btn.onclick = () => {
          const realIdx = state.tags.findIndex(t => t.id === tag.id);
          const dir = btn.dataset.dir === 'up' ? -1 : 1;
          const swapIdx = realIdx + dir;
          if(swapIdx < 0 || swapIdx >= state.tags.length) return;
          [state.tags[realIdx], state.tags[swapIdx]] = [state.tags[swapIdx], state.tags[realIdx]];
          markDirty();
          renderTagRows();
        };
      });
    }
    row.querySelector('.tag-cat-select').value = tag.categoryId || '';
    row.querySelector('input[type=color]').oninput = e => { tag.color = e.target.value; markDirty(); renderTagRows(); };
    const nameInput = row.querySelector('input[type=text]');
    nameInput.addEventListener('blur', e => { tag.name = e.target.value.trim() || tag.name; markDirty(); });
    nameInput.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); e.target.blur(); } });
    row.querySelector('.tag-cat-select').addEventListener('change', e => {
      tag.categoryId = e.target.value || null;
      state.tasks.forEach(t => {
        if((t.tagIds||[]).includes(tag.id) && tag.categoryId && t.categoryId !== tag.categoryId){
          t.tagIds = t.tagIds.filter(id => id !== tag.id);
        }
      });
      markDirty();
    });
    row.querySelector('button').onclick = (e) => {
      e.stopPropagation();
      const usedIn = state.tasks.filter(t => (t.tagIds||[]).includes(tag.id)).length;
      const msg = usedIn > 0
        ? `Remover a tag "${tag.name}"? Ela será retirada de ${usedIn} tarefa(s).`
        : `Remover a tag "${tag.name}"?`;
      openConfirmPortal(e.currentTarget, msg, () => {
        state.tasks.forEach(t => { if(t.tagIds) t.tagIds = t.tagIds.filter(id => id !== tag.id); });
        state.tags = state.tags.filter(tg => tg.id !== tag.id);
        markDirty();
        renderTagRows();
      });
    };
    rows.appendChild(row);
    if(tag.id === focusId){ nameInput.focus(); nameInput.select(); }
  });
}

/* ---- recorte circular ---- */
const cropImgEl = () => document.getElementById('cropImg');
let cropState = { natW:0, natH:0, base:1, zoom:1, offX:0, offY:0, dragging:false, startMouse:{x:0,y:0}, startOff:{x:0,y:0} };
const CROP_SIZE = 220;

function openCropModal(dataUrl){
  const img = cropImgEl();
  img.onload = () => {
    cropState.natW = img.naturalWidth;
    cropState.natH = img.naturalHeight;
    cropState.base = Math.max(CROP_SIZE/cropState.natW, CROP_SIZE/cropState.natH);
    cropState.zoom = 1; cropState.offX = 0; cropState.offY = 0;
    document.getElementById('cropZoom').value = 1;
    updateCropTransform();
  };
  img.src = dataUrl;
  document.getElementById('cropOverlay').classList.add('show');
}

function cropBounds(){
  const total = cropState.base * cropState.zoom;
  const w = cropState.natW * total, h = cropState.natH * total;
  return { maxX: Math.max(0,(w-CROP_SIZE)/2), maxY: Math.max(0,(h-CROP_SIZE)/2), w, h, total };
}

function updateCropTransform(){
  const { maxX, maxY, w, h } = cropBounds();
  cropState.offX = Math.min(maxX, Math.max(-maxX, cropState.offX));
  cropState.offY = Math.min(maxY, Math.max(-maxY, cropState.offY));
  const img = cropImgEl();
  img.style.width = w+'px';
  img.style.height = h+'px';
  img.style.left = (CROP_SIZE/2 - w/2 + cropState.offX)+'px';
  img.style.top = (CROP_SIZE/2 - h/2 + cropState.offY)+'px';
}

const cropStageEl = document.getElementById('cropStage');
cropStageEl.addEventListener('mousedown', e => {
  cropState.dragging = true;
  cropState.startMouse = { x:e.clientX, y:e.clientY };
  cropState.startOff = { x:cropState.offX, y:cropState.offY };
});
window.addEventListener('mousemove', e => {
  if(!cropState.dragging) return;
  cropState.offX = cropState.startOff.x + (e.clientX - cropState.startMouse.x);
  cropState.offY = cropState.startOff.y + (e.clientY - cropState.startMouse.y);
  updateCropTransform();
});
window.addEventListener('mouseup', () => cropState.dragging = false);

document.getElementById('cropZoom').addEventListener('input', e => {
  cropState.zoom = parseFloat(e.target.value);
  updateCropTransform();
});

document.getElementById('cancelCropBtn').onclick = () => document.getElementById('cropOverlay').classList.remove('show');
let cropOverlayMouseDownOnBackdrop = false;
document.getElementById('cropOverlay').addEventListener('mousedown', e => {
  cropOverlayMouseDownOnBackdrop = (e.target.id === 'cropOverlay');
});
document.getElementById('cropOverlay').addEventListener('click', e => {
  if(e.target.id==='cropOverlay' && cropOverlayMouseDownOnBackdrop) e.target.classList.remove('show');
});

document.getElementById('applyCropBtn').onclick = () => {
  const { total } = cropBounds();
  const canvas = document.createElement('canvas');
  canvas.width = CROP_SIZE; canvas.height = CROP_SIZE;
  const ctx = canvas.getContext('2d');
  ctx.save();
  ctx.translate(CROP_SIZE/2 + cropState.offX, CROP_SIZE/2 + cropState.offY);
  ctx.scale(total, total);
  ctx.drawImage(cropImgEl(), -cropState.natW/2, -cropState.natH/2);
  ctx.restore();
  tempAvatarData = canvas.toDataURL('image/png');
  const preview = document.getElementById('avatarPreview');
  if(preview) preview.innerHTML = avatarInnerHtml({ name: state.profile.name, avatar: tempAvatarData });
  document.getElementById('cropOverlay').classList.remove('show');
};

/* ===================== INDEXEDDB (handle do arquivo entre sessões) ===================== */
function openHandleDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('tyvraTasksDB', 1);
    req.onupgradeneeded = () => { req.result.createObjectStore('handles'); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGetHandle(key){
  try{
    const db = await openHandleDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction('handles','readonly');
      const req = tx.objectStore('handles').get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }catch(e){ return null; }
}
async function idbSetHandle(key, handle){
  try{
    const db = await openHandleDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction('handles','readwrite');
      tx.objectStore('handles').put(handle, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){ console.error(e); }
}
async function idbDeleteHandle(key){
  try{
    const db = await openHandleDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction('handles','readwrite');
      tx.objectStore('handles').delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){ console.error(e); }
}

/* ===================== VÍNCULO DE ARQUIVO BASE ===================== */
const FS_SUPPORTED = !!window.showOpenFilePicker && !!window.showSaveFilePicker;

function openLinkOverlay(){ document.getElementById('linkOverlay').classList.add('show'); }
function closeLinkOverlay(){ document.getElementById('linkOverlay').classList.remove('show'); }

  if(mode === 'reconnect'){
    body.innerHTML = `

      <button class="link-option primary" id="btnReconnect"><span class="icon">🔗</span><span class="txt"><strong>Reconectar taskin.json</strong><span>Concede permissão novamente ao arquivo já vinculado</span></span></button>
      <button class="link-option" id="btnLinkNewInstead"><span class="icon">📂</span><span class="txt"><strong>Vincular outro arquivo</strong><span>Escolher ou criar um arquivo diferente</span></span></button>
      ${forced ? '' : '<button class="link-skip" id="btnSkipLink">Continuar sem conectar (usar apenas este navegador)</button>'}
    `;

  } else {
    body.innerHTML = `

      <p class="link-desc">${forced ? 'O sistema fica indisponível sem um arquivo base conectado. Abra um <strong>taskin.json</strong> existente ou crie um novo para continuar.' : 'O Taskin ainda não está vinculado a um arquivo local. Vincule um <strong>taskin.json</strong> para manter tarefas, notas e perfil salvos e sincronizados entre sessões.'}</p>
      <button class="link-option primary" id="btnOpenExisting"><span class="icon">📂</span><span class="txt"><strong>Abrir arquivo existente</strong><span>Já tenho um taskin.json salvo</span></span></button>
      <button class="link-option" id="btnCreateNew"><span class="icon">🆕</span><span class="txt"><strong>Criar novo arquivo</strong><span>Começar do zero e salvar um novo taskin.json</span></span></button>
      ${forced ? '' : '<button class="link-skip" id="btnSkipLink">Continuar sem conectar (usar apenas este navegador)</button>'}
    `;
    document.getElementById('btnOpenExisting').onclick = linkOpenExisting;
    document.getElementById('btnCreateNew').onclick = linkCreateNew;
    if(!forced) document.getElementById('btnSkipLink').onclick = skipLinking;
  }
}

async function reconnectHandle(handle){
  try{
    const perm = await handle.requestPermission({ mode:'readwrite' });
    if(perm === 'granted'){
      fileHandle = handle;
      await syncStateFromFile();
      dirty = false;
      closeLinkOverlay();
      updateFileStatus();
      render();
    } else {
      alert('Permissão não concedida. Você pode tentar novamente pelo botão "Conectar arquivo base".');
      closeLinkOverlay();
    }
  }catch(e){ console.error(e); closeLinkOverlay(); }
}

async function syncStateFromFile(){
  try{
    const file = await fileHandle.getFile();
    const text = await file.text();
    if(text && text.trim()){
      const parsed = JSON.parse(text);
      if(parsed && parsed.categories){
        state = parsed;
        normalizeState();
        applyTheme();
      }
    } else {
      await writeStateToFile();
    }
  }catch(e){ console.error(e); }
}

async function writeStateToFile(){
  const writable = await fileHandle.createWritable();
  await writable.write(JSON.stringify(state, null, 2));
  await writable.close();
}

async function linkOpenExisting(){
  try{
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'Taskin JSON', accept: {'application/json': ['.json']} }]
    });
    const file = await handle.getFile();
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(!(parsed && parsed.categories)){ alert('Arquivo inválido para o Taskin.'); return; }
    state = parsed;
    normalizeState();
    applyTheme();
    fileHandle = handle;
    await idbSetHandle('main', handle);
    localStorage.removeItem('tyvraSkipFileLink');
    dirty = false;
    saveToLocalStorage();
    closeLinkOverlay();
    updateFileStatus();
    render();
  }catch(e){ if(e.name !== 'AbortError') console.error(e); }
}

async function linkCreateNew(){
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: 'taskin.json',
      types: [{ description: 'Taskin JSON', accept: {'application/json': ['.json']} }]
    });
    fileHandle = handle;
    await writeStateToFile();
    await idbSetHandle('main', handle);
    localStorage.removeItem('tyvraSkipFileLink');
    dirty = false;
    closeLinkOverlay();
    updateFileStatus();
    render();
  }catch(e){ if(e.name !== 'AbortError') console.error(e); }
}

function skipLinking(){
  localStorage.setItem('tyvraSkipFileLink','1');
  closeLinkOverlay();
  render();
}

async function disconnectFile(e){
  if(e) e.stopPropagation();
  const anchor = (e && e.currentTarget) || document.getElementById('avatarMenuLogoutBtn') || document.getElementById('topbarAvatarBtn');
  openConfirmPortal(anchor, 'Desconectar o arquivo base? O sistema ficará indisponível até que você conecte um arquivo novamente.', async () => {
    fileHandle = null;
    await idbDeleteHandle('main');
    localStorage.removeItem('tyvraSkipFileLink');
    dirty = false;
    updateFileStatus();
    renderLinkModal('choose', null, true);
    openLinkOverlay();
  }, 'Desconectar');
}

async function initFileLink(){
  if(!FS_SUPPORTED){ updateFileStatus(); return; }
  const storedHandle = await idbGetHandle('main');
  if(storedHandle){
    try{
      const perm = await storedHandle.queryPermission({ mode:'readwrite' });
      if(perm === 'granted'){
        fileHandle = storedHandle;
        await syncStateFromFile();
        updateFileStatus();
        render();
        return;
      }
      renderLinkModal('reconnect', storedHandle);
      openLinkOverlay();
      return;
    }catch(e){ console.error(e); }
  }
  if(localStorage.getItem('tyvraSkipFileLink')){ updateFileStatus(); return; }
  renderLinkModal('choose');
  openLinkOverlay();
}

  else if(currentView === 'notes') renderNotes();
  else if(currentView === 'calendar') renderCalendar();
  else renderSettingsView();

}

/* ===================== INIT ===================== */
async function boot(){
  loadFromLocalStorage();
  applyTheme();
  if(state.defaultCategoryFilter) activeCategoryFilter = state.defaultCategoryFilter;
  if(state.calendarViewDefault) calendarView = state.calendarViewDefault;

  if(FS_SUPPORTED){
    try{
      const storedHandle = await idbGetHandle('main');
      if(storedHandle){
        const perm = await storedHandle.queryPermission({ mode:'readwrite' });
        if(perm === 'granted'){
          fileHandle = storedHandle;
          await syncStateFromFile();
          applyTheme();
          if(state.defaultCategoryFilter) activeCategoryFilter = state.defaultCategoryFilter;
          if(state.calendarViewDefault) calendarView = state.calendarViewDefault;
          render();
          updateFileStatus();
          return;
        }
        render();
        renderLinkModal('reconnect', storedHandle);
        openLinkOverlay();
        updateFileStatus();
        return;
      }
    }catch(e){ console.error(e); }
  }

  render();
  initFileLink();
}
boot();
