  tpNameEl.addEventListener('blur', e => {
    const v = e.target.value.trim();
    if(!v && creatingNewTask) return; // nada digitado ainda, não cria
    const t = getOrCreateActiveTask();
    if(!t) return;
    t.title = v;
    if(!creatingNewTask) tpNameEl.setAttribute('readonly', '');
    markDirty();
  });
  tpNameEl.addEventListener('keydown', e => { if(e.key==='Enter') e.target.blur(); });

    t.done = !t.done;
    t.status = t.done ? 'concluida' : 'nao_iniciado';
    t.completedAt = t.done ? Date.now() : null;
    if(!wasDone && t.done && t.recurrence && t.recurrence !== 'none'){
      const next = spawnNextRecurrence(t);
      state.tasks = state.tasks.filter(x => x.id !== t.id);
      markDirty();
      openTaskPanel(next.id);
      return;
    }
    markDirty();

  tpStatusTrigger.onclick = (e) => {
    e.stopPropagation();
    const isOpen = tpStatusDropdown.style.display === 'block';
    tpStatusDropdown.style.display = isOpen ? 'none' : 'block';
  };
  tpStatusDropdown.addEventListener('click', e => e.stopPropagation());

    opt.onclick = () => {
      const t = getOrCreateActiveTask(); if(!t) return;
      const s = opt.dataset.s;
      t.status = s;
      t.done = (s === 'concluida');
      t.completedAt = t.done ? Date.now() : null;
      tpStatusDropdown.style.display = 'none';
      if(t.done && t.recurrence && t.recurrence !== 'none'){
        const next = spawnNextRecurrence(t);
        state.tasks = state.tasks.filter(x => x.id !== t.id);

const RT_ICONS = {
  alignLeft: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h14"/></svg>',
  alignCenter: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M5 18h14"/></svg>',
  alignRight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M10 12h10M6 18h14"/></svg>',
  bulletList: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="4.5" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="4.5" cy="18" r="1.4" fill="currentColor" stroke="none"/><path d="M9.5 6h10M9.5 12h10M9.5 18h10"/></svg>',
  numberList: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="0.6" font-family="sans-serif"><text x="1.5" y="8.5" font-size="7">1</text><text x="1.5" y="14.5" font-size="7">2</text><text x="1.5" y="20.5" font-size="7">3</text><path d="M9.5 6h10M9.5 12h10M9.5 18h10" stroke-width="2" fill="none"/></svg>',
  clearFormat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H8l-6-6a2 2 0 010-3l9-9a2 2 0 013 0l7 7a2 2 0 010 3l-8 8"/><path d="M12.5 6.5l7 7"/><line x1="4" y1="21" x2="20" y2="21"/></svg>'
};

function clearFormattingInSelection(targetEl){
  ensureSelectionInTarget(targetEl);
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount) return;
  const range = sel.getRangeAt(0);

  function topLevelAncestor(node){
    if(!node) return null;
    while(node && node.parentNode !== targetEl) node = node.parentNode;
    return node;
  }
  function nodeToLines(node){
    let html = node.nodeType === 1 ? node.innerHTML : escapeHtml(node.textContent || '');
    html = html.replace(/<br\s*\/?>/gi, '\n').replace(/<\/(div|p|li|h1|h2|h3)>/gi, '\n').replace(/<[^>]+>/g, '');
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    const lines = (tmp.textContent || '').split('\n');
    if(lines.length > 1 && lines[lines.length-1] === '') lines.pop();
    return lines;
  }
  function buildFragmentFromLines(lines){
    const frag = document.createDocumentFragment();
    lines.forEach(line => {
      const d = document.createElement('div');
      if(line === '') d.innerHTML = '<br>';
      else d.textContent = line;
      frag.appendChild(d);
    });
    return frag;
  }

  if(range.collapsed){
    let node = range.startContainer;
    let el = node.nodeType === 1 ? node : node.parentNode;
    while(el && el !== targetEl && !/^(DIV|P|H1|H2|H3|LI|UL|OL)$/.test(el.tagName)){
      el = el.parentNode;
    }
    if(!el || el === targetEl) return;
    const top = topLevelAncestor(el) || el;
    const lines = nodeToLines(top);
    if(lines.every(l => !l)) return;
    const frag = buildFragmentFromLines(lines);
    const lastNew = frag.lastChild;
    top.parentNode.replaceChild(frag, top);
    if(lastNew){
      const newRange = document.createRange();
      newRange.selectNodeContents(lastNew);
      newRange.collapse(false);
      sel.removeAllRanges();
      sel.addRange(newRange);
    }
    return;
  }

  function resolveEdgeNode(container, offset, isEnd){
    if(container.nodeType === 1){
      if(container === targetEl){
        const idx = isEnd ? Math.max(0, offset - 1) : Math.min(offset, container.childNodes.length - 1);
        return container.childNodes[idx] || (isEnd ? container.lastChild : container.firstChild);
      }
      return container;
    }
    return container.parentNode;
  }
  const startNode = resolveEdgeNode(range.startContainer, range.startOffset, false);
  const endNode = resolveEdgeNode(range.endContainer, range.endOffset, true);
  const startTop = topLevelAncestor(startNode);
  const endTop = topLevelAncestor(endNode);

  if(!startTop || !endTop || startTop === endTop){
    // Seleção contida num único bloco: usar o removeFormat nativo do navegador,
    // que divide corretamente as tags inline (negrito/itálico/sublinhado) nos
    // limites exatos da seleção, sem afetar o restante do parágrafo.
    try{ document.execCommand('removeFormat', false, null); }catch(e){}
    return;
  }

  const nodesToReplace = [];
  let cur = startTop;
  while(cur){
    nodesToReplace.push(cur);
    if(cur === endTop) break;
    cur = cur.nextSibling;
  }
  const allLines = [];
  nodesToReplace.forEach(n => { allLines.push(...nodeToLines(n)); });
  const frag = buildFragmentFromLines(allLines);
  const lastNew = frag.lastChild;
  targetEl.insertBefore(frag, nodesToReplace[0]);
  nodesToReplace.forEach(n => { if(n.parentNode === targetEl) targetEl.removeChild(n); });

  if(lastNew){
    const newRange = document.createRange();
    newRange.selectNodeContents(lastNew);
    sel.removeAllRanges();
    sel.addRange(newRange);
  }
}

function ensureSelectionInTarget(targetEl){
  if(!targetEl) return;
  const sel = window.getSelection();
  let inTarget = false;
  if(sel && sel.rangeCount > 0){
    const node = sel.getRangeAt(0).commonAncestorContainer;
    const el = node.nodeType === 1 ? node : node.parentNode;
    inTarget = !!(el && targetEl.contains(el));
  }
  if(!inTarget){
    targetEl.focus();
    const range = document.createRange();
    range.selectNodeContents(targetEl);
    range.collapse(false);
    if(sel){ sel.removeAllRanges(); sel.addRange(range); }
  }
}

function makeRtButton({ label, style, icon, cmd, title }, targetEl, onAfter){
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'rt-btn';
  btn.title = title || cmd;
  if(icon) btn.innerHTML = RT_ICONS[icon];
  else { btn.textContent = label; if(style) btn.style.cssText = style; }
  btn.addEventListener('mousedown', e => {
    e.preventDefault();
    ensureSelectionInTarget(targetEl);
    document.execCommand(cmd, false, null);
    if(onAfter) onAfter();
  });
  return btn;
}

function makeRtFormatSelect(targetEl){
  const select = document.createElement('select');
  select.className = 'rt-format-select';
  select.title = 'Tamanho do texto';
  select.innerHTML = `
    <option value="P">Normal</option>
    <option value="H1">Título 1</option>
    <option value="H2">Título 2</option>
    <option value="H3">Título 3</option>
  `;
  let savedRange = null;
  select.addEventListener('mousedown', () => {
    ensureSelectionInTarget(targetEl);
    const sel = window.getSelection();
    if(sel && sel.rangeCount) savedRange = sel.getRangeAt(0).cloneRange();
  });
  select.addEventListener('change', () => {
    if(targetEl) targetEl.focus();
    if(savedRange){
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(savedRange);
    } else {
      ensureSelectionInTarget(targetEl);
    }
    document.execCommand('formatBlock', false, select.value);
    select.value = 'P';
  });
  return select;
}

function buildRichToolbar(targetEl){
  const bar = document.createElement('div');
  bar.className = 'rt-toolbar';
  bar.appendChild(makeRtFormatSelect(targetEl));
  const sep0 = document.createElement('span'); sep0.className='rt-sep'; bar.appendChild(sep0);

  const tracked = [];
  function updateActiveStates(){
    tracked.forEach(({ cmd, btn }) => {
      let isActive = false;
      try{ isActive = document.queryCommandState(cmd); }catch(e){}
      btn.classList.toggle('active', isActive);
    });
  }
  function addTracked(cmd, btn){ tracked.push({ cmd, btn }); bar.appendChild(btn); }

  addTracked('bold', makeRtButton({ label:'B', style:'font-weight:700;', cmd:'bold', title:'Negrito' }, targetEl, updateActiveStates));
  addTracked('italic', makeRtButton({ label:'I', style:'font-style:italic;', cmd:'italic', title:'Itálico' }, targetEl, updateActiveStates));
  addTracked('underline', makeRtButton({ label:'U', style:'text-decoration:underline;', cmd:'underline', title:'Sublinhado' }, targetEl, updateActiveStates));
  const sep1 = document.createElement('span'); sep1.className='rt-sep'; bar.appendChild(sep1);
  addTracked('justifyLeft', makeRtButton({ icon:'alignLeft', cmd:'justifyLeft', title:'Alinhar à esquerda' }, targetEl, updateActiveStates));
  addTracked('justifyCenter', makeRtButton({ icon:'alignCenter', cmd:'justifyCenter', title:'Centralizar' }, targetEl, updateActiveStates));
  addTracked('justifyRight', makeRtButton({ icon:'alignRight', cmd:'justifyRight', title:'Alinhar à direita' }, targetEl, updateActiveStates));
  const sep2 = document.createElement('span'); sep2.className='rt-sep'; bar.appendChild(sep2);
  addTracked('insertUnorderedList', makeRtButton({ icon:'bulletList', cmd:'insertUnorderedList', title:'Marcadores' }, targetEl, updateActiveStates));
  addTracked('insertOrderedList', makeRtButton({ icon:'numberList', cmd:'insertOrderedList', title:'Numeração' }, targetEl, updateActiveStates));
  const sep3 = document.createElement('span'); sep3.className='rt-sep'; bar.appendChild(sep3);
  const clearFormatBtn = document.createElement('button');
  clearFormatBtn.type = 'button';
  clearFormatBtn.className = 'rt-btn';
  clearFormatBtn.title = 'Limpar formatação';
  clearFormatBtn.innerHTML = RT_ICONS.clearFormat;
  clearFormatBtn.addEventListener('mousedown', e => {
    e.preventDefault();
    clearFormattingInSelection(targetEl);
    updateActiveStates();
  });
  bar.appendChild(clearFormatBtn);

  if(targetEl){
    targetEl.addEventListener('keyup', updateActiveStates);
    targetEl.addEventListener('mouseup', updateActiveStates);
    targetEl.addEventListener('focus', updateActiveStates);
    targetEl.addEventListener('click', updateActiveStates);
  }
  return bar;
}

function fmtUpdatedAt(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}

function fmtActivityTime(ts){
  if(!ts) return '';
  const d = new Date(ts);
  const timeStr = d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  const dStr = dateToStr(d);
  const todayS = todayStr();
  const yestS = addDaysStr(todayS, -1);
  if(dStr === todayS) return `Hoje, ${timeStr}`;
  if(dStr === yestS) return `Ontem, ${timeStr}`;
  return `${d.toLocaleDateString('pt-BR')}, ${timeStr}`;
}

function tintSolid(hex, amount){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16);
  const g = parseInt(h.substring(2,4),16);
  const b = parseInt(h.substring(4,6),16);
  const mix = (c) => Math.round(c + (255 - c) * (1 - amount));
  return `rgb(${mix(r)}, ${mix(g)}, ${mix(b)})`;
}

const PASTE_ALLOWED_TAGS = ['B','STRONG','I','EM','U','H1','H2','H3','UL','OL','LI','BR','P','DIV'];
function sanitizePastedHtml(html){
  const temp = document.createElement('div');
  temp.innerHTML = html;
  function clean(node){
    Array.from(node.childNodes).forEach(child => {
      if(child.nodeType === 1){
        clean(child);
        if(!PASTE_ALLOWED_TAGS.includes(child.tagName)){
          const parent = child.parentNode;
          while(child.firstChild) parent.insertBefore(child.firstChild, child);
          parent.removeChild(child);
        } else {
          Array.from(child.attributes).forEach(attr => child.removeAttribute(attr.name));
        }
      } else if(child.nodeType !== 3){
        child.parentNode.removeChild(child);
      }
    });
  }
  clean(temp);
  return temp.innerHTML;
}

function attachFormattedPaste(targetEl){
  targetEl.addEventListener('paste', (e) => {
    const cd = e.clipboardData || window.clipboardData;
    const items = cd && cd.items ? Array.from(cd.items) : [];
    const imageItem = items.find(it => it.type && it.type.indexOf('image') === 0);
    if(imageItem){
      e.preventDefault();
      const file = imageItem.getAsFile();
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        document.execCommand('insertHTML', false, `<img src="${ev.target.result}" style="max-width:100%; border-radius:6px; margin:6px 0;">`);
      };
      reader.readAsDataURL(file);
      return;
    }
    e.preventDefault();
    const textData = cd.getData('text/plain');
    const insertHtml = escapeHtml(textData).replace(/\n/g, '<br>');
    document.execCommand('insertHTML', false, insertHtml);
  });
}

function stripHtml(html){
  const tmp = document.createElement('div');
  tmp.innerHTML = html || '';
  return tmp.textContent || '';
}

function svgDonutChart(segments, size){
  const total = segments.reduce((s,x)=>s+x.value,0);
  const r = size/2 - 6;
  const cx = size/2, cy = size/2;
  if(total <= 0){
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="10"></circle></svg>`;
  }
  let startAngle = -90;
  let paths = '';
  segments.forEach(seg => {
    if(seg.value <= 0) return;
    const angle = (seg.value/total)*360;
    const endAngle = startAngle + angle;
    const largeArc = angle > 180 ? 1 : 0;
    const x1 = cx + r*Math.cos(startAngle*Math.PI/180);
    const y1 = cy + r*Math.sin(startAngle*Math.PI/180);
    const x2 = cx + r*Math.cos(endAngle*Math.PI/180);
    const y2 = cy + r*Math.sin(endAngle*Math.PI/180);
    paths += `<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${largeArc} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${seg.color}"></path>`;
    startAngle = endAngle;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${paths}<circle cx="${cx}" cy="${cy}" r="${r*0.58}" fill="var(--surface)"></circle></svg>`;
}
function svgSparkline(values, width, height, color){
  const max = Math.max(1, ...values);
  const stepX = width / Math.max(1, values.length - 1);
  const points = values.map((v,i) => {
    const x = i*stepX;
    const y = height - (v/max) * (height-4) - 2;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" preserveAspectRatio="none">
    <polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}
function svgBarChart(values, labels, width, height){
  const max = Math.max(1, ...values);
  const barW = width/values.length;
  let bars = '';
  values.forEach((v,i) => {
    const h = v>0 ? Math.max(2, (v/max)*(height-18)) : 0;
    const x = i*barW + barW*0.22;
    const w = barW*0.56;
    const y = height - h - 14;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(--primary)"><title>${labels?labels[i]:''}: ${v}</title></rect>`;
  });
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" preserveAspectRatio="none">${bars}</svg>`;
}

  activityItems.sort((a,b) => b.ts - a.ts);
  const recentActivities = activityItems.slice(0, 4);

  const completedLast7 = completed.filter(t => t.completedAt && t.completedAt >= now - 7*DAY);

  const maxWeekdayIdx = weekdayCounts.indexOf(Math.max(...weekdayCounts));
  const bestWeekday = Math.max(...weekdayCounts) > 0 ? WEEKDAY_LABELS[maxWeekdayIdx] : '—';

  const dayLabels = [];

function renderCalendar(){
  const view = document.getElementById('calendarView');
  view.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'cal-header';
  const focusD = new Date(calendarFocusDate + 'T00:00:00');
  let periodLabel = '';
  if(calendarView === 'month') periodLabel = `${MONTH_LABELS[focusD.getMonth()]} ${focusD.getFullYear()}`;
  else if(calendarView === 'week'){
    const start = startOfWeekStr(calendarFocusDate);
    const end = addDaysStr(start, 6);
    const sD = new Date(start+'T00:00:00'), eD = new Date(end+'T00:00:00');
    periodLabel = `${sD.getDate()} de ${MONTH_LABELS[sD.getMonth()]} – ${eD.getDate()} de ${MONTH_LABELS[eD.getMonth()]}`;
  } else {
    periodLabel = `${focusD.getDate()} de ${MONTH_LABELS[focusD.getMonth()]}, ${WEEKDAY_LABELS[focusD.getDay()]}`;
  }

  header.innerHTML = `
    <div class="cal-view-toggle">
      <button type="button" data-cv="day" class="${calendarView==='day'?'active':''}">Dia</button>
      <button type="button" data-cv="week" class="${calendarView==='week'?'active':''}">Semana</button>
      <button type="button" data-cv="month" class="${calendarView==='month'?'active':''}">Mês</button>
    </div>
    <div class="cal-nav">
      <button type="button" id="calPrevBtn" title="Anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button type="button" id="calTodayBtn">Hoje</button>
      <button type="button" id="calNextBtn" title="Próximo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <div class="cal-period-label">${periodLabel}</div>
  `;
  view.appendChild(header);

  header.querySelectorAll('[data-cv]').forEach(btn => {
    btn.onclick = () => {
      calendarView = btn.dataset.cv;
      state.calendarViewDefault = calendarView;
      if(activeCategoryFilter){
        state.categoryCalendarViews[activeCategoryFilter] = calendarView;
      }
      markDirty();
    };
  });
  header.querySelector('#calTodayBtn').onclick = () => { calendarFocusDate = todayStr(); render(); };
  header.querySelector('#calPrevBtn').onclick = () => { navigateCalendar(-1); };
  header.querySelector('#calNextBtn').onclick = () => { navigateCalendar(1); };

  const body = document.createElement('div');
  body.className = 'cal-body';
  view.appendChild(body);

  if(calendarView === 'month') renderCalendarMonth(body);
  else if(calendarView === 'week') renderCalendarWeek(body);
  else renderCalendarDay(body);
}

function navigateCalendar(dir){
  if(calendarView === 'month'){
    const d = new Date(calendarFocusDate + 'T00:00:00');
    d.setMonth(d.getMonth() + dir);
    calendarFocusDate = dateToStr(d);
  } else if(calendarView === 'week'){
    calendarFocusDate = addDaysStr(calendarFocusDate, dir*7);
  } else {
    calendarFocusDate = addDaysStr(calendarFocusDate, dir);
  }
  render();
}

function renderCalendarMonth(body){
  const focusD = new Date(calendarFocusDate + 'T00:00:00');
  const year = focusD.getFullYear(), month = focusD.getMonth();
  const startDay = state.weekStartDay || 0;
  const firstOfMonth = new Date(year, month, 1);
  const gridStart = new Date(firstOfMonth);
  gridStart.setDate(gridStart.getDate() - ((firstOfMonth.getDay() - startDay + 7) % 7));
  const todayS = todayStr();
  const rotatedWeekdayLabels = WEEKDAY_LABELS.slice(startDay).concat(WEEKDAY_LABELS.slice(0, startDay));

  });
  for(let i=0;i<42;i++){

    });

    grid.appendChild(cell);
  }
  body.appendChild(grid);
}

const CAL_HOUR_HEIGHT = 48;
function timeToMinutes(t){
  if(!t) return null;
  const [h,m] = t.split(':').map(Number);
  return h*60 + (m||0);
}

function getCalHourHeight(){
  return state.calendarHourDensity === 'normal' ? 48 : 26;
}
function getCalHourStep(){
  return state.calendarHourDensity === 'normal' ? 1 : 2;
}

  const scrollWrap = document.createElement('div');
  scrollWrap.className = 'cal-week-scroll';
  const grid = document.createElement('div');
  grid.className = 'cal-week-hourgrid';

  const gutter = document.createElement('div');
  gutter.className = 'cal-week-gutter';
  for(let h=0; h<24; h+=hourStep){
    const cell = document.createElement('div');

    for(let h=0; h<24; h+=hourStep){
      const line = document.createElement('div');
      line.className = 'cal-week-hour-line';
      line.style.top = (h*hourHeight) + 'px';
      col.appendChild(line);
    }
    const timedEvents = getEventsForDate(dStr).filter(ev => !ev.allDay && ev.startTime);
    timedEvents.forEach(ev => {
      const startMin = timeToMinutes(ev.startTime);
      const endMin = ev.endTime ? timeToMinutes(ev.endTime) : startMin + 60;
      const top = (startMin/60) * hourHeight;
      const height = Math.max(20, ((endMin-startMin)/60) * hourHeight);
      const block = document.createElement('div');
      block.className = 'cal-event-block-timed';
      block.dataset.eventId = ev.id;

      if(e.target.closest('.cal-event-block-timed')) return;

      const offsetY = e.clientY - rect.top;
      const hour = Math.max(0, Math.min(23, Math.floor(offsetY / hourHeight)));
      openEventComposer(null, dStr);
    });
    grid.appendChild(col);
  });

  scrollWrap.appendChild(grid);
  wrap.appendChild(scrollWrap);
  body.appendChild(wrap);

  alldayRow.querySelectorAll('.cal-event-pill').forEach(pill => {
    pill.onclick = (e) => { e.stopPropagation(); const ev = state.events.find(x=>x.id===pill.dataset.eventId); if(ev) openEventComposer(ev); };
  });

  const scrollToHour = Math.max(0, new Date().getHours() - 2);
  scrollWrap.scrollTop = scrollToHour * hourHeight;
}

function addOneHourToTime(timeStr){
  if(!timeStr) return '';
  const [h,m] = timeStr.split(':').map(Number);
  const newH = Math.min((h||0)+1, 23);
  return String(newH).padStart(2,'0') + ':' + String(m||0).padStart(2,'0');
}

function applyTaskDataToEvent(ev, task){
  ev.title = task.title || ev.title;
  ev.tagIds = (task.tagIds||[]).slice();
  ev.date = task.dueDate || ev.date;
  ev.endDate = task.dueDate || ev.date;
  ev.startTime = task.dueTime || '';
  ev.endTime = ev.startTime ? addOneHourToTime(ev.startTime) : '';
  ev.allDay = !task.dueTime;
  ev.description = task.description || ev.description;
}

function nextRoundedHourTimes(){
  const now = new Date();
  let hour = now.getHours();
  if(now.getMinutes() > 0) hour = Math.min(hour + 1, 23);
  const start = String(hour).padStart(2,'0') + ':00';
  const end = String(Math.min(hour + 1, 23)).padStart(2,'0') + ':00';
  return { start, end };
}

function icsDateStamp(dateStr, timeStr){
  const datePart = (dateStr || todayStr()).replace(/-/g, '');
  if(!timeStr) return datePart;
  const timePart = timeStr.replace(':', '') + '00';
  return `${datePart}T${timePart}`;
}
function icsEscape(text){
  return String(text||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
function downloadEventAsICS(ev){
  const isAllDay = !!ev.allDay || !ev.startTime;
  const dtStart = isAllDay ? icsDateStamp(ev.date) : icsDateStamp(ev.date, ev.startTime);
  const dtEnd = isAllDay ? icsDateStamp(ev.endDate || ev.date) : icsDateStamp(ev.endDate || ev.date, ev.endTime || ev.startTime);
  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Taskin//PT-BR',
    'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    'UID:' + ev.id + '@taskin',
    'DTSTAMP:' + icsDateStamp(todayStr(), '00:00'),
    isAllDay ? ('DTSTART;VALUE=DATE:' + dtStart) : ('DTSTART:' + dtStart),
    isAllDay ? ('DTEND;VALUE=DATE:' + dtEnd) : ('DTEND:' + dtEnd),
    'SUMMARY:' + icsEscape(ev.title || 'Sem título'),
    ev.description ? ('DESCRIPTION:' + icsEscape(ev.description)) : '',
    'END:VEVENT',
    'END:VCALENDAR'
  ].filter(Boolean);
  const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (ev.title || 'agenda').replace(/[^\w\-]+/g, '_') + '.ics';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => { try{ URL.revokeObjectURL(url); }catch(e){} }, 1000);
}

        if(taskId){
          const t = state.tasks.find(x => x.id === taskId);
          if(t) applyTaskDataToEvent(ev, t);
        }
        renderEvLinkedTaskLabel();
        reloadFieldsFromEv();
        closeTagsPortal();
      }
    });
  };

  if(isEditing){
    modal.querySelector('#evDeleteBtn').onclick = (e) => {
      e.stopPropagation();
      openConfirmPortal(e.currentTarget, 'Excluir esta agenda?', () => {
        state.events = state.events.filter(x => x.id !== ev.id);
        closeEventComposer();
        markDirty();
      });
    };
    modal.querySelector('#evExportIcsBtn').onclick = (e) => {
      e.stopPropagation();
      downloadEventAsICS(ev);
    };
  }

  modal.querySelector('#evSaveBtn').onclick = () => {
    ev.title = modal.querySelector('#evTitle').value.trim();
    ev.date = modal.querySelector('#evDate').value || todayStr();
    ev.endDate = modal.querySelector('#evEndDate').value || ev.date;
    ev.startTime = modal.querySelector('#evStartTime').value || '';
    ev.endTime = modal.querySelector('#evEndTime').value || '';
    ev.description = modal.querySelector('#evDescription').value;
    ev.updatedAt = Date.now();
    ev.wasEdited = isEditing;
    if(!isEditing) state.events.push(ev);
    closeEventComposer();
    markDirty();
  };

  document.getElementById('eventComposerOverlay').classList.add('show');
  setTimeout(() => modal.querySelector('#evTitle').focus(), 0);
}

function closeEventComposer(){
  document.getElementById('eventComposerOverlay').classList.remove('show');
}

let eventOverlayMouseDownOnBackdrop = false;
document.getElementById('eventComposerOverlay').addEventListener('mousedown', e => {
  eventOverlayMouseDownOnBackdrop = (e.target.id === 'eventComposerOverlay');
});
document.getElementById('eventComposerOverlay').addEventListener('click', e => {
  if(e.target.id === 'eventComposerOverlay' && eventOverlayMouseDownOnBackdrop) closeEventComposer();
});

function noteSpaceKey(){ return activeCategoryFilter || '_all'; }
let lastRenderedNoteSpaceKey = null;

function closeNotebookMenu(){
  const m = document.getElementById('notebookMenuPopover');
  if(m) m.remove();
}

function renderNotes(){
  const view = document.getElementById('notesView');
  const nbSearchFocused = document.activeElement && document.activeElement.id === 'notebookSearchInput';
  const nbSearchCursor = nbSearchFocused ? document.activeElement.selectionStart : null;
  view.innerHTML = '';

  const term = searchTerm.trim().toLowerCase();
  function matches(n){
    if(term && !(n.title + stripHtml(n.body)).toLowerCase().includes(term)) return false;
    return true;
  }

  const nbSearchLower = notebookSearchTerm.trim().toLowerCase();
  const spaceNotebooks = state.notebooks
    .filter(nb => !activeCategoryFilter || nb.categoryId === activeCategoryFilter)
    .filter(nb => !nbSearchLower || (nb.name||'').toLowerCase().includes(nbSearchLower))
    .sort((a,b) => (a.createdAt||0) - (b.createdAt||0));

  // se o espaço mudou desde o último render, soltar a nota ativa para restaurar a do novo espaço
  if(lastRenderedNoteSpaceKey !== null && lastRenderedNoteSpaceKey !== noteSpaceKey()){
    if(currentNoteComposerCommit) currentNoteComposerCommit();
    activeNoteId = null;
    creatingNewNote = false;
  }
  lastRenderedNoteSpaceKey = noteSpaceKey();

  // restaurar última nota aberta deste espaço, se ainda não houver nota/edição ativa
  if(!activeNoteId && !creatingNewNote){
    const lastId = state.lastActiveNoteBySpace[noteSpaceKey()];
    if(lastId){
      const n = state.notes.find(x => x.id === lastId && !x.archived && (!activeCategoryFilter || x.categoryId === activeCategoryFilter));
      if(n){ activeNoteId = n.id; if(n.notebookId) expandedNotebookIds.add(n.notebookId); }
    }
  }
  if(activeNoteId) state.lastActiveNoteBySpace[noteSpaceKey()] = activeNoteId;

  const layout = document.createElement('div');
  layout.className = 'notes-layout';

  const notebooksCol = document.createElement('div');
  notebooksCol.className = 'notebooks-col';
  notebooksCol.style.width = (state.notebooksColWidth || 260) + 'px';
  function notebookGroupHtml(nb){
    const nbNotes = state.notes.filter(n => n.notebookId === nb.id && !n.archived && matches(n))
      .sort((a,b) => (b.pinned - a.pinned) || ((b.pinnedAt||0) - (a.pinnedAt||0)) || (b.updatedAt - a.updatedAt));
    const expanded = expandedNotebookIds.has(nb.id);
    return `
      <div class="notebook-group">
        <div class="notebook-row" data-nb-id="${nb.id}">
          <svg class="notebook-chevron ${expanded?'expanded':''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          <svg class="notebook-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
          <span class="notebook-name">${escapeHtml(nb.name && nb.name.trim() ? nb.name : 'Caderno sem nome')}</span>
          <span class="notebook-count">${nbNotes.length}</span>
          <button type="button" class="notebook-menu-btn" data-nb-id="${nb.id}" title="Opções"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.4" fill="currentColor" stroke="none"/></svg></button>
        </div>
        ${expanded ? `
        <div class="notebook-notes">
          ${nbNotes.map(n => `<div class="notebook-note-item ${n.id===activeNoteId?'active':''} ${n.pinned?'is-pinned':''}" data-note-id="${n.id}" draggable="true">${n.pinned?`<svg class="nb-note-pin" data-unpin-note-id="${n.id}" title="Desafixar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="11" height="11"><path d="M12 17v5M9 10.76a2 2 0 01-1.11 1.79l-1.78.9A2 2 0 005 15.24V16a1 1 0 001 1h12a1 1 0 001-1v-.76a2 2 0 00-1.11-1.79l-1.78-.9A2 2 0 0115 10.76V7a1 1 0 011-1 2 2 0 000-4H8a2 2 0 000 4 1 1 0 011 1z"/></svg>`:''}<span>${escapeHtml(n.title||'Sem título')}</span></div>`).join('')}
          <button type="button" class="notebook-add-note-btn" data-nb-id="${nb.id}">+ Nova nota</button>
        </div>` : ''}
      </div>
    `;
  }
  let nbHtml = '';
  if(activeCategoryFilter){
    spaceNotebooks.forEach(nb => { nbHtml += notebookGroupHtml(nb); });
  } else {
    // sem filtro de espaço: agrupar os cadernos por espaço, mantendo a estrutura de cada um separada
    state.categories.forEach(cat => {
      const catNotebooks = spaceNotebooks.filter(nb => nb.categoryId === cat.id);
      if(catNotebooks.length === 0) return;
      nbHtml += `<div class="notebooks-space-header"><span class="cat-swatch" style="background:${cat.color}"></span>${escapeHtml(cat.name)}</div>`;
      catNotebooks.forEach(nb => { nbHtml += notebookGroupHtml(nb); });
    });
  }
  if(!nbHtml && nbSearchLower){
    nbHtml = `<div class="notebook-empty-hint">Nenhum caderno encontrado.</div>`;
  }
  notebooksCol.innerHTML = `
    <div class="notebooks-col-header-row">
      <div class="notebooks-col-header">Cadernos</div>
      <button type="button" class="notebook-new-btn-top" id="newNotebookBtn" title="Novo caderno">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div class="notebook-search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" class="notebook-search-input" id="notebookSearchInput" placeholder="Buscar caderno..." value="${escapeHtml(notebookSearchTerm)}">
    </div>
    <div class="notebooks-list">${nbHtml}</div>
    <div class="notebooks-col-resize-handle" id="notebooksColResizeHandle" title="Arrastar para redimensionar"></div>
  `;
  const resizeHandle = notebooksCol.querySelector('#notebooksColResizeHandle');
  resizeHandle.addEventListener('mousedown', (e) => {
    e.preventDefault();
    const startX = e.clientX;
    const startWidth = notebooksCol.getBoundingClientRect().width;
    resizeHandle.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    function onMove(e2){
      const newWidth = Math.min(480, Math.max(200, startWidth + (e2.clientX - startX)));
      notebooksCol.style.width = newWidth + 'px';
    }
    function onUp(){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      resizeHandle.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      state.notebooksColWidth = Math.round(notebooksCol.getBoundingClientRect().width);
      persistOnly();
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
  const notebookSearchInput = notebooksCol.querySelector('#notebookSearchInput');
  notebookSearchInput.addEventListener('input', (e) => {
    notebookSearchTerm = e.target.value;
    renderNotes();
  });

  const detailCol = document.createElement('div');
  detailCol.className = 'note-detail-col';
  const activeNote = activeNoteId ? state.notes.find(n => n.id === activeNoteId) : null;
  if(activeNote){
    const { element, commit } = buildNoteComposer(activeNote);
    currentNoteComposerCommit = commit;
    detailCol.appendChild(element);
  } else if(creatingNewNote){
    const { element, commit } = buildNoteComposer(null, pendingNotePrefillTaskId, pendingNoteNotebookId);
    currentNoteComposerCommit = commit;
    detailCol.appendChild(element);
    setTimeout(() => { const t = element.querySelector('.note-title'); if(t) t.focus(); }, 0);
  } else {
    currentNoteComposerCommit = null;
    detailCol.innerHTML = `<div class="note-detail-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg>
      <p>Selecione uma nota ao lado, ou crie uma nova para começar.</p>
    </div>`;
  }

  layout.appendChild(notebooksCol);
  layout.appendChild(detailCol);
  view.appendChild(layout);
  if(nbSearchFocused){
    notebookSearchInput.focus();
    notebookSearchInput.setSelectionRange(nbSearchCursor, nbSearchCursor);
  }

  function selectNote(noteId){
    if(currentNoteComposerCommit) currentNoteComposerCommit();
    activeNoteId = noteId;
    creatingNewNote = false;
    state.lastActiveNoteBySpace[noteSpaceKey()] = noteId;
    markDirty();
    renderNotes();
  }

  notebooksCol.querySelectorAll('.notebook-row').forEach(row => {
    row.addEventListener('click', (e) => {
      if(e.target.closest('.notebook-menu-btn')) return;
      const id = row.dataset.nbId;
      if(expandedNotebookIds.has(id)) expandedNotebookIds.delete(id);
      else expandedNotebookIds.add(id);
      renderNotes();
    });
    row.addEventListener('dragover', (e) => {
      if(!draggedNoteId) return;
      e.preventDefault();
      row.classList.add('drag-over');
    });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
    row.addEventListener('drop', (e) => {
      e.preventDefault();
      row.classList.remove('drag-over');
      if(!draggedNoteId) return;
      const n = state.notes.find(x => x.id === draggedNoteId);
      const nb = state.notebooks.find(x => x.id === row.dataset.nbId);
      if(!n || !nb || n.notebookId === nb.id) return;
      if(currentNoteComposerCommit) currentNoteComposerCommit();
      n.notebookId = nb.id;
      expandedNotebookIds.add(nb.id);
      markDirty();
      renderNotes();
    });
  });
  notebooksCol.querySelectorAll('.notebook-note-item[data-note-id]').forEach(item => {
    item.addEventListener('click', () => selectNote(item.dataset.noteId));
    item.addEventListener('dragstart', (e) => {
      draggedNoteId = item.dataset.noteId;
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    item.addEventListener('dragend', () => {
      draggedNoteId = null;
      item.classList.remove('dragging');
      notebooksCol.querySelectorAll('.notebook-row.drag-over').forEach(r => r.classList.remove('drag-over'));
    });
  });
  notebooksCol.querySelectorAll('.nb-note-pin[data-unpin-note-id]').forEach(pin => {
    pin.addEventListener('click', (e) => {
      e.stopPropagation();
      const n = state.notes.find(x => x.id === pin.dataset.unpinNoteId);
      if(!n) return;
      n.pinned = false;
      n.pinnedAt = null;
      if(currentNoteComposerCommit) currentNoteComposerCommit();
      markDirty();
      renderNotes();
    });
  });
  notebooksCol.querySelectorAll('.notebook-add-note-btn[data-nb-id]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if(currentNoteComposerCommit) currentNoteComposerCommit();
      activeNoteId = null;
      creatingNewNote = true;
      pendingNotePrefillTaskId = null;
      pendingNoteNotebookId = btn.dataset.nbId;
      expandedNotebookIds.add(btn.dataset.nbId);
      renderNotes();
    });
  });
  notebooksCol.querySelectorAll('.notebook-menu-btn[data-nb-id]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const existing = document.getElementById('notebookMenuPopover');
      closeNotebookMenu();
      if(existing && existing.dataset.nbId === btn.dataset.nbId) return;
      const nb = state.notebooks.find(x => x.id === btn.dataset.nbId);
      if(!nb) return;
      const pop = document.createElement('div');
      pop.id = 'notebookMenuPopover';
      pop.className = 'task-menu-portal show';
      pop.dataset.nbId = nb.id;
      pop.innerHTML = `
        <button type="button" class="task-menu-item" data-act="rename"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>Renomear</button>
        <button type="button" class="task-menu-item" data-act="move-space"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>Mover de Espaço</button>
        <button type="button" class="task-menu-item danger" data-act="delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m2 0v14a2 2 0 01-2 2H8a2 2 0 01-2-2V6h12z"/></svg>Excluir caderno</button>
      `;
      document.body.appendChild(pop);
      const r = btn.getBoundingClientRect();
      pop.style.left = Math.min(r.left, window.innerWidth - 190) + 'px';
      pop.style.top = (r.bottom + 4) + 'px';
      pop.onclick = e2 => e2.stopPropagation();
      pop.querySelector('[data-act=move-space]').onclick = (e2) => {
        openMoveGroupPortal(e2.currentTarget, nb.categoryId, (newCatId) => {
          nb.categoryId = newCatId;
          state.notes.forEach(n => { if(n.notebookId === nb.id) n.categoryId = newCatId; });
          closeNotebookMenu();
          markDirty();
          renderNotes();
        });
      };
      pop.querySelector('[data-act=rename]').onclick = () => {
        closeNotebookMenu();
        const row = notebooksCol.querySelector(`.notebook-row[data-nb-id="${nb.id}"] .notebook-name`);
        if(!row) return;
        const input = document.createElement('input');
        input.type = 'text'; input.className = 'notebook-rename-input'; input.value = nb.name;
        row.replaceWith(input);
        input.focus(); input.select();
        const finish = () => {
          const v = input.value.trim();
          if(v) nb.name = v;
          markDirty();
          renderNotes();
        };
        input.addEventListener('blur', finish);
        input.addEventListener('keydown', e2 => { if(e2.key==='Enter') input.blur(); if(e2.key==='Escape'){ input.value = nb.name; input.blur(); } });
        input.addEventListener('click', e2 => e2.stopPropagation());
      };
      pop.querySelector('[data-act=delete]').onclick = () => {
        closeNotebookMenu();
        openConfirmPortal(btn, `Excluir o caderno "${nb.name}"? As notas dele ficarão sem caderno.`, () => {
          state.notes.forEach(n => { if(n.notebookId === nb.id) n.notebookId = null; });
          state.notebooks = state.notebooks.filter(x => x.id !== nb.id);
          if(activeNote && activeNote.notebookId === nb.id){ activeNoteId = null; }
          markDirty();
          renderNotes();
        });
      };
    });
  });
  document.getElementById('newNotebookBtn').onclick = () => {
    const catId = activeCategoryFilter || state.categories[0].id;
    const nb = { id: uid('nb'), name: 'Novo caderno', categoryId: catId, createdAt: Date.now() };
    state.notebooks.push(nb);
    expandedNotebookIds.add(nb.id);
    markDirty();
    renderNotes();
  };
}

function initials(name){
  const parts = (name||'').trim().split(/\s+/).filter(Boolean);
  if(parts.length === 0) return '?';
  return parts.slice(0,2).map(p=>p[0].toUpperCase()).join('');
}

/* ---- recorte circular ---- */
const cropImgEl = () => document.getElementById('cropImg');
let cropState = { natW:0, natH:0, base:1, zoom:1, offX:0, offY:0, dragging:false, startMouse:{x:0,y:0}, startOff:{x:0,y:0} };
const CROP_SIZE = 220;

function openCropModal(dataUrl){
  const img = cropImgEl();
  img.onload = () => {
    cropState.natW = img.naturalWidth;
    cropState.natH = img.naturalHeight;
    cropState.base = Math.max(CROP_SIZE/cropState.natW, CROP_SIZE/cropState.natH);
    cropState.zoom = 1; cropState.offX = 0; cropState.offY = 0;
    document.getElementById('cropZoom').value = 1;
    updateCropTransform();
  };
  img.src = dataUrl;
  document.getElementById('cropOverlay').classList.add('show');
}

function cropBounds(){
  const total = cropState.base * cropState.zoom;
  const w = cropState.natW * total, h = cropState.natH * total;
  return { maxX: Math.max(0,(w-CROP_SIZE)/2), maxY: Math.max(0,(h-CROP_SIZE)/2), w, h, total };
}

function updateCropTransform(){
  const { maxX, maxY, w, h } = cropBounds();
  cropState.offX = Math.min(maxX, Math.max(-maxX, cropState.offX));
  cropState.offY = Math.min(maxY, Math.max(-maxY, cropState.offY));
  const img = cropImgEl();
  img.style.width = w+'px';
  img.style.height = h+'px';
  img.style.left = (CROP_SIZE/2 - w/2 + cropState.offX)+'px';
  img.style.top = (CROP_SIZE/2 - h/2 + cropState.offY)+'px';
}

const cropStageEl = document.getElementById('cropStage');
cropStageEl.addEventListener('mousedown', e => {
  cropState.dragging = true;
  cropState.startMouse = { x:e.clientX, y:e.clientY };
  cropState.startOff = { x:cropState.offX, y:cropState.offY };
});
window.addEventListener('mousemove', e => {
  if(!cropState.dragging) return;
  cropState.offX = cropState.startOff.x + (e.clientX - cropState.startMouse.x);
  cropState.offY = cropState.startOff.y + (e.clientY - cropState.startMouse.y);
  updateCropTransform();
});
window.addEventListener('mouseup', () => cropState.dragging = false);

document.getElementById('cropZoom').addEventListener('input', e => {
  cropState.zoom = parseFloat(e.target.value);
  updateCropTransform();
});

document.getElementById('cancelCropBtn').onclick = () => document.getElementById('cropOverlay').classList.remove('show');
let cropOverlayMouseDownOnBackdrop = false;
document.getElementById('cropOverlay').addEventListener('mousedown', e => {
  cropOverlayMouseDownOnBackdrop = (e.target.id === 'cropOverlay');
});
document.getElementById('cropOverlay').addEventListener('click', e => {
  if(e.target.id==='cropOverlay' && cropOverlayMouseDownOnBackdrop) e.target.classList.remove('show');
});

document.getElementById('applyCropBtn').onclick = () => {
  const { total } = cropBounds();
  const canvas = document.createElement('canvas');
  canvas.width = CROP_SIZE; canvas.height = CROP_SIZE;
  const ctx = canvas.getContext('2d');
  ctx.save();
  ctx.translate(CROP_SIZE/2 + cropState.offX, CROP_SIZE/2 + cropState.offY);
  ctx.scale(total, total);
  ctx.drawImage(cropImgEl(), -cropState.natW/2, -cropState.natH/2);
  ctx.restore();
  tempAvatarData = canvas.toDataURL('image/png');
  const preview = document.getElementById('avatarPreview');
  if(preview) preview.innerHTML = avatarInnerHtml({ name: state.profile.name, avatar: tempAvatarData });
  document.getElementById('cropOverlay').classList.remove('show');
};

/* ===================== INDEXEDDB (handle do arquivo entre sessões) ===================== */
function openHandleDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('tyvraTasksDB', 1);
    req.onupgradeneeded = () => { req.result.createObjectStore('handles'); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGetHandle(key){
  try{
    const db = await openHandleDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction('handles','readonly');
      const req = tx.objectStore('handles').get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }catch(e){ return null; }
}
async function idbSetHandle(key, handle){
  try{
    const db = await openHandleDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction('handles','readwrite');
      tx.objectStore('handles').put(handle, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){ console.error(e); }
}
async function idbDeleteHandle(key){
  try{
    const db = await openHandleDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction('handles','readwrite');
      tx.objectStore('handles').delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){ console.error(e); }
}

async function reconnectHandle(handle){
  try{
    const perm = await handle.requestPermission({ mode:'readwrite' });
    if(perm === 'granted'){
      fileHandle = handle;
      await syncStateFromFile();
      dirty = false;
      closeLinkOverlay();
      updateFileStatus();
      render();
    } else {
      alert('Permissão não concedida. Você pode tentar novamente pelo botão "Conectar arquivo base".');
      closeLinkOverlay();
    }
  }catch(e){ console.error(e); closeLinkOverlay(); }
}

async function syncStateFromFile(){
  try{
    const file = await fileHandle.getFile();
    const text = await file.text();
    if(text && text.trim()){
      const parsed = JSON.parse(text);
      if(parsed && parsed.categories){
        state = parsed;
        normalizeState();
        applyTheme();
      }
    } else {
      await writeStateToFile();
    }
  }catch(e){ console.error(e); }
}

async function writeStateToFile(){
  const writable = await fileHandle.createWritable();
  await writable.write(JSON.stringify(state, null, 2));
  await writable.close();
}

async function linkOpenExisting(){
  try{
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'Taskin JSON', accept: {'application/json': ['.json']} }]
    });
    const file = await handle.getFile();
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(!(parsed && parsed.categories)){ alert('Arquivo inválido para o Taskin.'); return; }
    state = parsed;
    normalizeState();
    applyTheme();
    fileHandle = handle;
    await idbSetHandle('main', handle);
    localStorage.removeItem('tyvraSkipFileLink');
    dirty = false;
    saveToLocalStorage();
    closeLinkOverlay();
    updateFileStatus();
    render();
  }catch(e){ if(e.name !== 'AbortError') console.error(e); }
}

async function linkCreateNew(){
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: 'taskin.json',
      types: [{ description: 'Taskin JSON', accept: {'application/json': ['.json']} }]
    });
    fileHandle = handle;
    await writeStateToFile();
    await idbSetHandle('main', handle);
    localStorage.removeItem('tyvraSkipFileLink');
    dirty = false;
    closeLinkOverlay();
    updateFileStatus();
    render();
  }catch(e){ if(e.name !== 'AbortError') console.error(e); }
}

function skipLinking(){
  localStorage.setItem('tyvraSkipFileLink','1');
  closeLinkOverlay();
  render();
}

async function disconnectFile(e){
  if(e) e.stopPropagation();
  const anchor = (e && e.currentTarget) || document.getElementById('avatarMenuLogoutBtn') || document.getElementById('topbarAvatarBtn');
  openConfirmPortal(anchor, 'Desconectar o arquivo base? O sistema ficará indisponível até que você conecte um arquivo novamente.', async () => {
    fileHandle = null;
    await idbDeleteHandle('main');
    localStorage.removeItem('tyvraSkipFileLink');
    dirty = false;
    updateFileStatus();
    renderLinkModal('choose', null, true);
    openLinkOverlay();
  }, 'Desconectar');
}

async function initFileLink(){
  if(!FS_SUPPORTED){ updateFileStatus(); return; }
  const storedHandle = await idbGetHandle('main');
  if(storedHandle){
    try{
      const perm = await storedHandle.queryPermission({ mode:'readwrite' });
      if(perm === 'granted'){
        fileHandle = storedHandle;
        await syncStateFromFile();
        updateFileStatus();
        render();
        return;
      }
      renderLinkModal('reconnect', storedHandle);
      openLinkOverlay();
      return;
    }catch(e){ console.error(e); }
  }
  if(localStorage.getItem('tyvraSkipFileLink')){ updateFileStatus(); return; }
  renderLinkModal('choose');
  openLinkOverlay();
}

  if(panel && document.activeElement && panel.contains(document.activeElement) && typeof document.activeElement.blur === 'function'){
    document.activeElement.blur();
  }
  currentView = 'settings';
  if(tab) settingsTab = tab;
  document.querySelectorAll('.nav-item[data-view]').forEach(b=>b.classList.remove('active'));
  activeTaskId = null;
  creatingNewTask = false;
  creatingNewNote = false;
  pendingNoteNotebookId = null;
  clearSearchTerm();
  render();
}

function createNewSpace(){
  const color = DEFAULT_COLORS[state.categories.length % DEFAULT_COLORS.length];
  const newCat = { id: uid('cat'), name: 'Novo espaço', color };
  state.categories.push(newCat);
  openSettingsView('categorias');
  markDirty();
  setTimeout(() => renderCatRows(newCat.id), 0);
}

function closeSpaceSelectorDropdown(){
  const dd = document.getElementById('spaceSelectorDropdown');
  if(dd) dd.style.display = 'none';
}

function renderSpaceSelector(){
  const wrap = document.getElementById('spaceSelectorWrap');
  if(!wrap) return;
  const showOn = (currentView === 'tasks' || currentView === 'notes' || currentView === 'calendar');
  wrap.style.display = showOn ? 'flex' : 'none';
  if(!showOn){ closeSpaceSelectorDropdown(); return; }

  const cat = activeCategoryFilter ? catById(activeCategoryFilter) : null;
  document.getElementById('spaceSelectorDot').style.background = cat ? cat.color : 'var(--ink-faint)';
  document.getElementById('spaceSelectorName').textContent = cat ? cat.name : 'Todos os espaços';
}

document.getElementById('spaceSelectorBtn').onclick = (e) => {
  e.stopPropagation();
  const dd = document.getElementById('spaceSelectorDropdown');
  const wasOpen = dd.style.display !== 'none';
  closeSpaceSelectorDropdown();
  if(wasOpen) return;

  const checkSvg = '<svg class="space-selector-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>';
  let html = '<div class="space-selector-label">ESPAÇOS</div>';
  html += getOrderedCategories().map(cat => `
    <div class="space-selector-item" data-cat-id="${cat.id}">
      <span class="space-selector-dot" style="background:${cat.color}"></span>
      <span class="space-selector-item-name">${escapeHtml(cat.name)}</span>
      ${activeCategoryFilter===cat.id ? checkSvg : ''}
    </div>
  `).join('');
  html += `<div class="space-selector-divider"></div>`;
  html += `
    <div class="space-selector-item" data-cat-id="">
      <span class="space-selector-dot" style="background:var(--ink-faint)"></span>
      <span class="space-selector-item-name">Todos os espaços</span>
      ${activeCategoryFilter===null ? checkSvg : ''}
    </div>
    <div class="space-selector-divider"></div>
    <div class="space-selector-item action" id="spaceSelectorNewBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      <span class="space-selector-item-name">Novo espaço</span>
    </div>
    <div class="space-selector-item action" id="spaceSelectorManageBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <span class="space-selector-item-name">Gerenciar espaços</span>
    </div>
  `;
  dd.innerHTML = html;
  dd.style.display = 'block';
  dd.querySelectorAll('.space-selector-item[data-cat-id]').forEach(item => {
    item.onclick = () => { selectSpace(item.dataset.catId); closeSpaceSelectorDropdown(); };
  });
  document.getElementById('spaceSelectorNewBtn').onclick = () => { closeSpaceSelectorDropdown(); createNewSpace(); };
  document.getElementById('spaceSelectorManageBtn').onclick = () => { closeSpaceSelectorDropdown(); openSettingsView('categorias'); };
};
document.addEventListener('click', (e) => {
  const wrap = document.getElementById('spaceSelectorWrap');
  const dd = document.getElementById('spaceSelectorDropdown');
  if(dd && dd.style.display !== 'none' && wrap && !wrap.contains(e.target)){
    closeSpaceSelectorDropdown();
  }
});

document.getElementById('primaryAddBtn').onclick = () => {
  if(currentView === 'tasks'){
    openNewTaskPanel();
  } else if(currentView === 'notes'){
    openNoteComposer();
  } else if(currentView === 'calendar'){
    openEventComposer(null, calendarFocusDate);
  }
};

function updateSearchClearBtnVisibility(){
  const input = document.getElementById('searchInput');
  const clearBtn = document.getElementById('searchClearBtn');
  if(input && clearBtn) clearBtn.style.display = input.value ? 'flex' : 'none';
}
function clearSearchTerm(){
  searchTerm = '';
  const input = document.getElementById('searchInput');
  if(input) input.value = '';
  updateSearchClearBtnVisibility();
}
document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value;
  updateSearchClearBtnVisibility();
  render();
});
document.getElementById('searchClearBtn').onclick = () => {
  const input = document.getElementById('searchInput');
  input.value = '';
  searchTerm = '';
  updateSearchClearBtnVisibility();
  input.focus();
  render();
};
/* ===================== MENU DO AVATAR ===================== */
document.getElementById('topbarAvatarBtn').onclick = (e) => {
  e.stopPropagation();
  const menu = document.getElementById('avatarDropdownMenu');
  menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
};
document.addEventListener('click', (e) => {
  const wrap = document.getElementById('topbarAvatarWrap');
  const menu = document.getElementById('avatarDropdownMenu');
  if(menu.style.display !== 'none' && wrap && !wrap.contains(e.target)){
    menu.style.display = 'none';
  }
});
document.addEventListener('click', (e) => {
  const pop = document.getElementById('notebookMenuPopover');
  if(pop && !pop.contains(e.target) && !e.target.closest('.notebook-menu-btn')){
    closeNotebookMenu();
  }
});
document.getElementById('avatarMenuProfileBtn').onclick = () => {
  document.getElementById('avatarDropdownMenu').style.display = 'none';
  openSettingsView('perfil');
};
document.getElementById('avatarMenuSettingsBtn').onclick = () => {
  document.getElementById('avatarDropdownMenu').style.display = 'none';
  openSettingsView('personalizacao');
};
document.getElementById('avatarMenuLogoutBtn').onclick = (e) => {
  e.stopPropagation();
  disconnectFile(e);
  document.getElementById('avatarDropdownMenu').style.display = 'none';
};

/* ===================== RENDER PRINCIPAL ===================== */
const VIEW_TITLES = { dashboard:'Visão geral', tasks:'Tarefas', notes:'Notas', calendar:'Calendário', settings:'Configurações' };
function render(){
  applySidebarCollapsed();
  renderSpaceSelector();
  document.getElementById('viewTitle').textContent = VIEW_TITLES[currentView];
  const subtitleEl = document.getElementById('viewSubtitle');
  if(currentView === 'dashboard'){
    const focusD = new Date(todayStr()+'T00:00:00');
    subtitleEl.textContent = `${WEEKDAY_FULL_LABELS[focusD.getDay()]}, ${focusD.getDate()} de ${MONTH_LABELS[focusD.getMonth()]} de ${focusD.getFullYear()}`;
    subtitleEl.style.display = 'block';
  } else {
    subtitleEl.style.display = 'none';
  }
  document.getElementById('dashboardView').style.display = currentView === 'dashboard' ? 'block' : 'none';
  document.getElementById('tasksView').style.display = currentView === 'tasks' ? 'block' : 'none';
  document.getElementById('notesView').style.display = currentView === 'notes' ? 'block' : 'none';
  document.getElementById('calendarView').style.display = currentView === 'calendar' ? 'block' : 'none';
  document.getElementById('settingsView').style.display = currentView === 'settings' ? 'block' : 'none';
  document.getElementById('searchWrap').style.display = (currentView === 'settings' || currentView === 'calendar' || currentView === 'dashboard') ? 'none' : 'flex';
  const addBtn = document.getElementById('primaryAddBtn');
  if(currentView === 'settings' || currentView === 'dashboard'){
    addBtn.style.display = 'none';
  } else {
    addBtn.style.display = 'flex';
    addBtn.title = currentView === 'tasks' ? 'Nova tarefa' : currentView === 'calendar' ? 'Nova agenda' : 'Nova nota';
  }
  addBtn.classList.toggle('shifted', currentView === 'tasks' && (activeTaskId || creatingNewTask));
  renderProfileCard();
  renderSidebarCats();
  if(currentView === 'dashboard') renderDashboard();
  else if(currentView === 'tasks') renderTasks();
  else if(currentView === 'notes') renderNotes();
  else if(currentView === 'calendar') renderCalendar();
  else renderSettingsView();
  updateFileStatus();
}

/* ===================== INIT ===================== */
async function boot(){
  loadFromLocalStorage();
  applyTheme();
  if(state.defaultCategoryFilter) activeCategoryFilter = state.defaultCategoryFilter;
  if(state.calendarViewDefault) calendarView = state.calendarViewDefault;

  if(FS_SUPPORTED){
    try{
      const storedHandle = await idbGetHandle('main');
      if(storedHandle){
        const perm = await storedHandle.queryPermission({ mode:'readwrite' });
        if(perm === 'granted'){
          fileHandle = storedHandle;
          await syncStateFromFile();
          applyTheme();
          if(state.defaultCategoryFilter) activeCategoryFilter = state.defaultCategoryFilter;
          if(state.calendarViewDefault) calendarView = state.calendarViewDefault;
          render();
          updateFileStatus();
          return;
        }
        render();
        renderLinkModal('reconnect', storedHandle);
        openLinkOverlay();
        updateFileStatus();
        return;
      }
    }catch(e){ console.error(e); }
  }

  render();
  initFileLink();
}
boot();
</script>
